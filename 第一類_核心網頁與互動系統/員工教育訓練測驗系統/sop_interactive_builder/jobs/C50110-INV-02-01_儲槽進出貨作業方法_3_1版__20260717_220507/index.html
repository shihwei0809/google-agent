<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>SOP 互動教學簡報與測驗</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #111;
      color: #fff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #main-content {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide, .quiz-slide {
      display: none;
      width: 80%;
      max-width: 900px;
      text-align: left;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
      animation: fadeIn 0.5s;
    }
    .slide.active, .quiz-slide.active {
      display: block;
    }
    .slide h1, .quiz-slide h1 {
      color: #4da6ff;
      margin-top: 0;
    }
    .slide-content {
      font-size: 1.2rem;
      line-height: 1.8;
      white-space: pre-wrap;
    }
    .quiz-options {
      margin-top: 20px;
    }
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 15px;
      margin-bottom: 10px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .quiz-option:hover {
      background: #444;
    }
    .quiz-option.correct {
      background: #28a745;
      border-color: #28a745;
    }
    .quiz-option.wrong {
      background: #dc3545;
      border-color: #dc3545;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #controls {
      height: 60px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-top: 1px solid #444;
    }
    .btn {
      background: #4da6ff;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      background: #3388dd;
    }
    #progress-text {
      font-weight: bold;
      color: #ccc;
    }
    
    /* Play Overlay */
    #play-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #play-overlay button {
      font-size: 2rem;
      padding: 15px 40px;
      border-radius: 50px;
      background: #4da6ff;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="play-overlay">
    <button onclick="startPresentation()">▶ 開始觀看簡報</button>
  </div>

  <div id="main-content">
    <!-- Slides & Quizzes will be injected here -->
  </div>

  <div id="controls">
    <button class="btn" id="prev-btn" onclick="prevSlide()">上一頁</button>
    <div id="progress-text">1 / 1</div>
    <button class="btn" id="next-btn" onclick="nextSlide()">下一頁</button>
  </div>

  <audio id="audio-player"></audio>

  <script>
    // 注入的簡報設定 (後端產生 HTML 時替換此變數)
    const slidesData = [{"title": "儲槽進出貨作業方法：目的與適用範圍", "content": "文件編號：C50110-INV-02-01 (版別 3.1),制定目的：建立安全操作規範，避免人為疏忽,適用範圍：儲槽區及進出貨作業系統,相關文件：儲槽作業、進出貨作業、原料採購、出貨作業管理辦法", "audio": null}, {"title": "關鍵名詞定義", "content": "ISO TANK：國際標準罐式貨櫃 (貨櫃化學槽),油罐車 (槽車)：日常作業簡稱，以便與 ISO TANK 區別,Flush (沖洗)：利用快速流動將管線物料排出，為取樣關鍵步驟,PPE (個人防護器具)：安全帽、安全鞋、護目鏡、防毒面具等,放櫃：車頭與聯結之油罐車、貨櫃或 ISO TANK 分離之作業", "audio": null}, {"title": "一般檢查作業流程", "content": "核對產品名稱及槽別 (依據當日通知單),確認管線、凡爾開關及泵浦運轉是否正常,確認進出儲槽相關之油水分離凡爾「全關」,檢查現場滅火及安全防護設備,使用管線接合室需開立「管線接合室異動」申請", "audio": null}, {"title": "槽車進貨與卸貨作業規範", "content": "入廠安全：引導熄火、拉手煞車、放置輪檔、接妥接地線 (電阻 < 10歐姆),取樣檢驗：1、2 輪由操作員取樣 (須經認證)；3 輪後由品管取樣,卸貨巡檢：泵料入槽時需依管線流向巡查，留意液位計防滿溢,濾袋更換時機 (任一滿足即更換)：,  - 過濾袋壓力超過 2kg/cm2,  - 使用時間超過 12 個月,  - 使用量超過 12,000 噸", "audio": null}, {"title": "ISO TANK 卸貨與高處作業安全", "content": "高處作業防護：2 公尺以上作業必須穿著「背負式安全帶」並勾掛妥當,卸料取樣 Flush 規範：,  - 工業級：Flush 約 40 公升後取樣,  - 電子級：Flush 約 200 公升後取樣 (超 3 個月未入廠需 Flush 400L),補壓作業：銜接氮氣管線，加壓後再開啟緊急遮斷閥卸料,拆卸與完工：確認洩壓完成再拆管 (注意化學品不落地)，設備復歸", "audio": null}, {"title": "一般槽車與 ISO TANK 出貨灌裝", "content": "基本安全：確認出貨儲槽編號，灌裝期間操作人員「絕對不得離開現場」,EBR 系列特殊要求：出貨前於儲槽接合氮氣管線攪拌 10~30 分鐘,ISO TANK 灌裝前置：管線料品先 Flush 至 1T 桶約 100 公升後取樣送檢,保壓與拆管：灌裝後關馬達，排空管線，將 ISO TANK 保壓至 0.5~1.0 kg/cm2,取樣復歸：通知品管取樣，釋放氮氣管壓力，砲管殘料回收，拆管並復歸", "audio": "audio_5.wav"}, {"title": "安全注意事項與風險控制", "content": ["防護裝備：作業前必須先佩戴好個人防護器具 (PPE)", "放櫃限制：油罐車原则上不得放櫃，特殊狀況須經主管簽核「放櫃前檢點表」", "醋酸 (GAA) 低溫保溫：氣溫低於 16°C (含) 時，必須開啟熱水泵浦保溫", "重要風險管控：", "  - 誤接管線：人工核對、刷掃描條碼確認、取樣確認", "  - 操作員離場：嚴格執行監控、雙人作業，異常即時處置"], "audio": null}];
    const quizData = [];
    
    let currentIndex = 0;
    let isQuizMode = false;
    let presentationStarted = false;
    let correctCount = 0;
    const audioPlayer = document.getElementById("audio-player");
    
    function init() {
      const container = document.getElementById("main-content");
      
      // 插入投影片
      slidesData.forEach((s, idx) => {
        const slideDiv = document.createElement("div");
        slideDiv.className = "slide item-container";
        slideDiv.id = `slide-${idx}`;
        slideDiv.innerHTML = `
          <h1>${s.title}</h1>
          <div class="slide-content">${s.content}</div>
        `;
        container.appendChild(slideDiv);
      });
      
      // 插入考題
      if (quizData && quizData.length > 0) {
        quizData.forEach((q, idx) => {
          const quizDiv = document.createElement("div");
          quizDiv.className = "quiz-slide item-container";
          quizDiv.id = `quiz-${idx}`;
          
          let optionsHtml = '';
          q.options.forEach((opt, oIdx) => {
             optionsHtml += `<button class="quiz-option" onclick="checkAnswer(${idx}, ${oIdx}, this)">${String.fromCharCode(65+oIdx)}. ${opt}</button>`;
          });
          
          quizDiv.innerHTML = `
            <h1>隨堂測驗 (第 ${idx + 1} 題 / 共 ${quizData.length} 題)</h1>
            <div class="slide-content">${q.question}</div>
            <div class="quiz-options">${optionsHtml}</div>
            <p id="quiz-msg-${idx}" style="margin-top: 15px; font-weight: bold;"></p>
          `;
          container.appendChild(quizDiv);
        });
      }
      
      updateUI();
    }
    
    function startPresentation() {
      document.getElementById("play-overlay").style.display = "none";
      presentationStarted = true;
      playSlideAudio(currentIndex);
    }
    
    function updateUI() {
      const totalItems = slidesData.length + (quizData ? quizData.length : 0);
      document.querySelectorAll(".item-container").forEach((el, idx) => {
        if (idx === currentIndex) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      });
      
      document.getElementById("progress-text").innerText = `${currentIndex + 1} / ${totalItems}`;
      document.getElementById("prev-btn").disabled = currentIndex === 0;
      
      isQuizMode = currentIndex >= slidesData.length;
      
      // 如果進入考題模式或完全沒有考題而簡報結束，看是否需要解鎖
      if (!isQuizMode && currentIndex === slidesData.length - 1 && (!quizData || quizData.length === 0)) {
        notifyParentCompleted();
      }
    }
    
    function playSlideAudio(index) {
      if (!presentationStarted || isQuizMode) return;
      const audioFile = slidesData[index].audio;
      if (audioFile) {
        audioPlayer.src = audioFile;
        audioPlayer.play().catch(e => console.log("Auto-play blocked:", e));
      } else {
        audioPlayer.pause();
        audioPlayer.removeAttribute('src'); 
      }
    }
    
    function nextSlide() {
      const totalItems = slidesData.length + (quizData ? quizData.length : 0);
      if (currentIndex < totalItems - 1) {
        currentIndex++;
        updateUI();
        if (!isQuizMode) playSlideAudio(currentIndex);
      }
    }
    
    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        updateUI();
        if (!isQuizMode) playSlideAudio(currentIndex);
      }
    }
    
    function checkAnswer(quizIdx, selectedOptIdx, btnEl) {
      const q = quizData[quizIdx];
      const msgEl = document.getElementById(`quiz-msg-${quizIdx}`);
      const parent = btnEl.parentNode;
      
      // 停用所有按鈕
      parent.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
      
      if (selectedOptIdx === q.answer) {
        btnEl.classList.add("correct");
        msgEl.innerText = "✅ 答對了！";
        msgEl.style.color = "#28a745";
        correctCount++;
      } else {
        btnEl.classList.add("wrong");
        parent.children[q.answer].classList.add("correct");
        msgEl.innerText = "❌ 答錯了！";
        msgEl.style.color = "#dc3545";
      }
      
      // 如果是最後一題，送出解鎖
      if (quizIdx === quizData.length - 1) {
         setTimeout(() => {
            alert(`測驗結束！您答對了 ${correctCount} 題。`);
            notifyParentCompleted();
         }, 1000);
      }
    }
    
    // Auto advance on audio end
    audioPlayer.addEventListener("ended", () => {
      nextSlide();
    });
    
    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
      if (!presentationStarted) return;
      if (e.key === "ArrowRight" || e.key === " ") {
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        prevSlide();
      }
    });
    
    function notifyParentCompleted() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'slide-completed' }, '*');
      }
    }

    window.onload = init;
  </script>
</body>
</html>
