                      );
                    })}

                    {activePlantTanks.length === 0 && (
                      <div className="p-6 text-center text-slate-400 font-bold border border-dashed rounded-lg bg-white">
                        目前 {activePlantObj.name} 尚未設定專屬儲槽。
                      </div>
                    )}
                  </div>
                </div>
              </>
            )}

          </div>

          {/* 新增產線 Modal 彈窗 */}
          {showAddLineModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-2xl p-5 max-w-md w-full border space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">➕ 新增產線配置</h3>
                  <button onClick={() => setShowAddLineModal(false)} className="text-slate-400 hover:text-slate-600 text-base font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">歸屬廠區</label>
                    <select 
                      value={newLinePlantId} 
                      onChange={e => setNewLinePlantId(e.target.value)}
                      className="w-full p-2 border rounded font-bold bg-blue-50 text-blue-800"
                    >
                      {PLANTS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">產線名稱 (如：溶八)</label>
                    <input 
                      type="text" 
                      value={newLineName} 
                      onChange={e => setNewLineName(e.target.value)}
                      placeholder="輸入產線名稱" 
                      className="w-full p-2 border rounded font-bold"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold mb-1">預設流速 (T/hr)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        value={newLineFlow} 
                        onChange={e => setNewLineFlow(e.target.value)}
                        className="w-full p-2 border rounded font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold mb-1 text-orange-700">獨立良率 (%)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        value={newLineYield} 
                        onChange={e => setNewLineYield(e.target.value)}
                        className="w-full p-2 border rounded font-bold text-orange-800 bg-orange-50"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold mb-1">預設進料來源</label>
                      <select 
                        value={newLineSource} 
                        onChange={e => setNewLineSource(e.target.value)}
                        className="w-full p-2 border rounded font-bold"
                      >
                        {newLinePlantId === 'plant1' && (
                          <option value="SHARED_POOL">🔗 一廠 5 槽共用池</option>
                        )}
                        {currentPlantSupplyTanks.map(st => (
                          <option key={st.id} value={st.id}>{st.id} ({st.name})</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold mb-1">預設下腳料槽</label>
                      <select 
                        value={newLineScrap} 
                        onChange={e => setNewLineScrap(e.target.value)}
                        className="w-full p-2 border rounded font-bold"
                      >
                        {currentPlantScrapTanks.map(st => (
                          <option key={st.id} value={st.id}>{st.id}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t">
                  <button onClick={() => setShowAddLineModal(false)} className="px-3 py-1.5 bg-slate-200 text-slate-700 rounded font-bold text-xs">
                    取消
                  </button>
                  <button onClick={handleAddLine} className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold text-xs shadow">
                    確認新增
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 新增儲槽 Modal 彈窗 */}
          {showAddTankModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-2xl p-5 max-w-md w-full border space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">➕ 新增儲槽</h3>
                  <button onClick={() => setShowAddTankModal(false)} className="text-slate-400 hover:text-slate-600 text-base font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">儲槽代號 (如：TK698)</label>
                    <input 
                      type="text" 
                      value={newTankId} 
                      onChange={e => setNewTankId(e.target.value)}
                      placeholder="輸入代號，如 TK698" 
                      className="w-full p-2 border rounded font-bold uppercase"
                    />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">儲槽顯示全名</label>
                    <input 
                      type="text" 
                      value={newTankName} 
                      onChange={e => setNewTankName(e.target.value)}
                      placeholder="輸入名稱，如 TK698 原料槽" 
                      className="w-full p-2 border rounded font-bold"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold mb-1">儲槽類別</label>
                      <select 
                        value={newTankType} 
                        onChange={e => setNewTankType(e.target.value)}
                        className="w-full p-2 border rounded font-bold"
                      >
                        <option value="SUPPLY">原料槽 (SUPPLY)</option>
                        <option value="SCRAP">下腳料槽 (SCRAP)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold mb-1">歸屬廠區</label>
                      <select 
                        value={newTankPlantId} 
                        onChange={e => setNewTankPlantId(e.target.value)}
                        className="w-full p-2 border rounded font-bold"
                      >
                        {PLANTS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                    </div>
                  </div>

                  {newTankPlantId === 'plant1' && newTankType === 'SUPPLY' && (
                    <div className="p-2.5 bg-blue-50 border border-blue-200 rounded">
                      <label className="flex items-center space-x-2 cursor-pointer font-bold text-blue-800">
                        <input 
                          type="checkbox" 
                          checked={newTankIsShared} 
                          onChange={e => setNewTankIsShared(e.target.checked)} 
                          className="h-4 w-4 text-blue-600 rounded"
                        />
                        <span>納入一廠「共用原料池 (Shared Pool)」合併試算</span>
                      </label>
                    </div>
                  )}

                  {newTankType === 'SCRAP' && (
                    <div className="p-2.5 bg-emerald-50 border border-emerald-200 rounded">
                      <label className="flex items-center space-x-2 cursor-pointer font-bold text-emerald-800">
                        <input 
                          type="checkbox" 
                          checked={newTankCanRecycle} 
                          onChange={e => setNewTankCanRecycle(e.target.checked)} 
                          className="h-4 w-4 text-emerald-600 rounded"
                        />
                        <span>允許下腳料「產線/槽車回吃 (Recycle)」扣減</span>
                      </label>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold mb-1">預設初始庫存 (T)</label>
                    <input 
                      type="number" 
                      value={newTankInit} 
                      onChange={e => setNewTankInit(e.target.value)}
                      className="w-full p-2 border rounded font-bold text-center"
                    />
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t">
                  <button onClick={() => setShowAddTankModal(false)} className="px-3 py-1.5 bg-slate-200 text-slate-700 rounded font-bold text-xs">
                    取消
                  </button>
                  <button onClick={handleAddTank} className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold text-xs shadow">
                    確認新增儲槽
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 📋 原採進貨排程智慧匯入 Modal */}
          {showProcurementModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-3xl w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center pb-2 border-b">
                  <h3 className="font-bold text-slate-800 text-base flex items-center">
                    <span className="mr-2">📋</span> 快速匯入原採原料預計入廠時間 (批次排程)
                  </h3>
                  <button onClick={() => setShowProcurementModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">
                    ✕
                  </button>
                </div>

                <div className="text-xs text-slate-600 space-y-1">
                  <p>
                    像三合一單匯入一樣便利：直接複製原採採購進貨通知、郵件表格或 Excel 貼上，系統自動識別 <strong>數量 (MT)</strong>、<strong>單號/批號</strong> 與 <strong>預計入廠日期</strong>，自動批次加總寫入對應日期的【進貨量 (+)】。
                  </p>
                </div>

                <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold text-slate-700">預設指派儲槽：</span>
                    <select
                      value={defaultImportTarget}
                      onChange={e => {
                        const newT = e.target.value;
                        setDefaultImportTarget(newT);
                        setParsedProcurementList(prev => prev.map(item => ({ ...item, targetTank: newT })));
                      }}
                      className="text-xs p-1.5 rounded border border-indigo-300 font-bold bg-white text-indigo-900 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    >
                      <optgroup label="── 彰濱一廠 ──">
                        <option value="SHARED_POOL">🔗 一廠 5 槽共用池 (自動平均分配 5 槽，總進貨一致)</option>
                        {tanksList.filter(t => t.plantId === 'plant1' && t.type === 'SUPPLY').map(st => (
                          <option key={st.id} value={st.id}>一廠 - {st.id} ({st.name})</option>
                        ))}
                      </optgroup>
                      <optgroup label="── 崙尾二廠 ──">
                        {tanksList.filter(t => t.plantId === 'plant2' && t.type === 'SUPPLY').map(st => (
                          <option key={st.id} value={st.id}>二廠 - {st.id} ({st.name})</option>
                        ))}
                      </optgroup>
                    </select>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      const sampleText = "數量\tETD\tETA\t預計入廠時間\nCIF-5 2609-I05 175MT\t9/26\t10/7\t10/14-15\nCIF-6 2609-I06 175MT\t10/1\t10/10\t10/12-14\nFOB-10 2609-I10 175MT\t10/15\t10/24\t10/28\nCIF-7 2610-I01 175MT\t10/10\t10/20\t待定";
                      handleProcurementTextChange(sampleText);
                    }}
                    className="text-xs px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded font-bold transition-colors cursor-pointer"
                  >
                    📝 帶入郵件範例文字
                  </button>
                </div>

                <div className="flex-1 flex flex-col min-h-0 space-y-2">
                  <label className="text-xs font-bold text-slate-700">貼上原採表格內容 (或直接 Ctrl+V)：</label>
                  <textarea
                    rows="4"
                    value={procurementRawText}
                    onChange={e => handleProcurementTextChange(e.target.value)}
                    placeholder="請在此貼上原採寄送的文字或表格（例如：CIF-5 2609-I05 175MT ... 10/14-15）..."
                    className="w-full p-2.5 border rounded-lg text-xs font-mono bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  />
                </div>

                {parsedProcurementList.length > 0 && (
                  <div className="space-y-1.5 flex-1 overflow-hidden flex flex-col">
                    <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                      <span>🔍 解析結果預覽 ({parsedProcurementList.length} 筆，有效 {parsedProcurementList.filter(it => !it.isPending && it.weight > 0).length} 筆)：</span>
                      <span className="text-[11px] text-indigo-700">
                        有效總量：{parsedProcurementList.filter(it => !it.isPending).reduce((sum, it) => sum + it.weight, 0)} MT
                      </span>
                    </div>
                    <div className="border rounded-lg overflow-y-auto max-h-[180px] bg-white">
                      <table className="w-full text-xs text-center border-collapse">
                        <thead className="bg-slate-100 border-b text-slate-700 font-bold sticky top-0">
                          <tr>
                            <th className="p-1.5">項次</th>
                            <th className="p-1.5">單號 / 批號</th>
                            <th className="p-1.5">數量 (MT)</th>
                            <th className="p-1.5">預計入廠日</th>
                            <th className="p-1.5">分配儲槽</th>
                            <th className="p-1.5">狀態</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {parsedProcurementList.map((item, idx) => (
                            <tr key={idx} className={item.isPending ? "bg-slate-50 text-slate-400" : "hover:bg-indigo-50/40 text-slate-800"}>
                              <td className="p-1.5 font-bold">{idx + 1}</td>
                              <td className="p-1.5 font-bold">{item.po}</td>
                              <td className="p-1.5 font-bold text-blue-700">{item.weight} MT</td>
                              <td className="p-1.5 font-bold">
                                {item.isPending ? (
                                  <span className="text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">待定</span>
                                ) : (
                                  <span className="text-indigo-800 bg-indigo-50 px-1.5 py-0.5 rounded font-bold">
                                    {item.month}/{item.day} 日 ({item.dateDisplay})
                                  </span>
                                )}
                              </td>
                              <td className="p-1.5">
                                <select
                                  value={item.targetTank}
                                  disabled={item.isPending}
                                  onChange={e => {
                                    const val = e.target.value;
                                    setParsedProcurementList(prev => prev.map((it, i) => i === idx ? { ...it, targetTank: val } : it));
                                  }}
                                  className="text-[11px] p-1 border rounded font-bold bg-white focus:outline-none"
                                >
                                  <optgroup label="── 彰濱一廠 ──">
                                    <option value="SHARED_POOL">🔗 一廠池 (均分5槽)</option>
                                    {tanksList.filter(t => t.plantId === 'plant1' && t.type === 'SUPPLY').map(st => (
                                      <option key={st.id} value={st.id}>一廠 - {st.id}</option>
                                    ))}
                                  </optgroup>
                                  <optgroup label="── 崙尾二廠 ──">
                                    {tanksList.filter(t => t.plantId === 'plant2' && t.type === 'SUPPLY').map(st => (
                                      <option key={st.id} value={st.id}>二廠 - {st.id}</option>
                                    ))}
                                  </optgroup>
                                </select>
                              </td>
                              <td className="p-1.5 font-bold">
                                {item.isPending ? (
                                  <span className="text-slate-400 text-[11px]">⏳ 待定(暫不寫入)</span>
                                ) : (
                                  <span className="text-emerald-600 text-[11px]">✓ 準備寫入進貨</span>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                <div className="flex justify-between items-center pt-3 border-t">
                  <button
                    onClick={() => {
                      setProcurementRawText('');
                      setParsedProcurementList([]);
                    }}
                    className="px-3 py-1.5 text-slate-500 hover:text-slate-700 font-bold text-xs cursor-pointer"
                  >
                    🗑️ 清空文字
                  </button>
                  <div className="flex space-x-2">
                    <button
                      onClick={() => setShowProcurementModal(false)}
                      className="px-4 py-1.5 bg-slate-200 text-slate-700 rounded-lg font-bold text-xs cursor-pointer"
                    >
                      取消
                    </button>
                    <button
                      onClick={handleConfirmProcurementImport}
                      disabled={parsedProcurementList.filter(it => !it.isPending && it.weight > 0).length === 0}
                      className={`px-5 py-1.5 rounded-lg font-bold text-xs shadow text-white transition-all ${
                        parsedProcurementList.filter(it => !it.isPending && it.weight > 0).length > 0
                          ? 'bg-indigo-600 hover:bg-indigo-500 cursor-pointer'
                          : 'bg-slate-300 cursor-not-allowed'
                      }`}
                    >
                      確認匯入至進貨量 (+)
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 📅 儲槽作業日報 Excel 分頁解析與一鍵填入 Modal */}
          {showDailyExcelModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-5 space-y-3.5 max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center pb-2 border-b">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">📂</span>
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">
                        儲槽作業日報 Excel 分頁解析結果
                      </h3>
                      <p className="text-[11px] text-slate-500">
                        檔案：<span className="font-mono font-bold text-slate-700">{uploadedExcelFileName || '日報 Excel'}</span>（共讀取到 {parsedExcelSheetsList.length} 個有效日期分頁）
                      </p>
                    </div>
                  </div>
                  <button onClick={() => setShowDailyExcelModal(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer">
                    ✕
                  </button>
                </div>

                <p className="text-xs text-slate-600 bg-amber-50 p-2 rounded border border-amber-200">
                  系統已自動秒讀各分頁 08:00 槽重。請點選您要起算的日期（例如 12 日），系統將<strong>自動將重量填入產銷對應日</strong>，並立即切換至【產銷排產模式】自動起算！
                </p>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[380px]">
                  {parsedExcelSheetsList.map((item) => {
                    const isPlant1 = activePlantId === 'plant1';
                    return (
                      <div key={item.dateStr} className="p-3 border rounded-lg bg-slate-50 hover:bg-amber-50/50 transition-all flex items-center justify-between">
                        <div className="space-y-1">
                          <div className="flex items-center space-x-2">
                            <span className="font-bold text-slate-900 text-sm">
                              📅 分頁 [{item.sheetName}] ({item.month}/{item.day} 日)
                            </span>
                            <span className="text-xs font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded">
                              {isPlant1 ? `一廠 5 槽共用池合計: ${item.plant1 || 0} 噸` : `TK617: ${item.TK617 || 0}T / TK618: ${item.TK618 || 0}T`}
                            </span>
                          </div>
                          {isPlant1 && item.tanks && (
                            <div className="text-[10px] text-slate-500 font-mono flex flex-wrap gap-x-2">
                              <span>TK604A: {item.tanks.TK604A || 0}T</span>
                              <span>TK604B: {item.tanks.TK604B || 0}T</span>
                              <span>TK693: {item.tanks.TK693 || 0}T</span>
                              <span>TK696: {item.tanks.TK696 || 0}T</span>
                              <span>TK697: {item.tanks.TK697 || 0}T</span>
                            </div>
                          )}
                        </div>

                        <button
                          onClick={() => handleApplyDailyReport(item.dateStr)}
                          className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded font-bold text-xs shadow transition-all shrink-0 cursor-pointer"
                        >
                          ⚡ 自動填入產銷 {item.day} 日起算
                        </button>
                      </div>
                    );
                  })}
                </div>

                <div className="flex justify-between items-center pt-2 border-t">
                  <span className="text-[11px] text-slate-500">
                    💡 提示：點擊按鈕後，系統會在產銷對應日填入重量並設定為最新起算日，不影響其他設定。
                  </span>
                  <button
                    onClick={() => setShowDailyExcelModal(false)}
                    className="px-4 py-1.5 bg-slate-200 text-slate-700 rounded font-bold text-xs cursor-pointer"
                  >
                    關閉
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IPASystemApp />);
  </script>
</body>
</html>
