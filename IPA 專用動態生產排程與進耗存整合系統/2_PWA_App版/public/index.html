<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>IPA 生產排程與進耗存整合系統 v3.8 (國定假日自動紅字與共用槽位勾選排除)</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e293b">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./xlsx.full.min.js"></script>
  
  <style>
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .sticky-col { position: sticky; left: 0; z-index: 20; background: #f8fafc; border-right: 2px solid #cbd5e1; min-width: 150px; white-space: nowrap; }
    .table-input { width: 100%; border: 1px solid transparent; background: transparent; text-align: center; font-weight: bold; }
    .table-input:hover, .table-input:focus { border: 1px solid #3b82f6; background: #eff6ff; outline: none; border-radius: 4px; }
    
    /* PWA Install Banner Styles */
    #pwa-install-banner {
      display: none;
      background: #3b82f6;
      color: white;
      padding: 10px;
      text-align: center;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    #pwa-install-btn {
      background: white;
      color: #3b82f6;
      border: none;
      padding: 5px 15px;
      margin-left: 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    #update-banner {
      display: none;
      background: #059669;
      color: white;
      padding: 10px;
      text-align: center;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1001;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pt-8">
  <div id="update-banner" onclick="window.location.reload(true)">
    🎉 系統已發布新版本！點擊此處立即更新 🔄
  </div>

  <div id="pwa-install-banner">
    📲 想要更順暢的體驗？安裝 PWA 桌面/手機版應用程式！
    <button id="pwa-install-btn">立即安裝</button>
  </div>
  
  <div id="root"></div>

  <script>
    // PWA Service Worker Registration & Network-First Auto Update
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('SW registered:', reg);
          reg.update(); // 開啟主動向雲端檢查更新
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            if (installingWorker) {
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showUpdateBanner();
                }
              };
            }
          };
        }).catch(err => {
          console.log('SW registration failed:', err);
        });
      });

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        showUpdateBanner();
      });

      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'VERSION_UPDATED') {
          showUpdateBanner();
        }
      });
    }

    function showUpdateBanner() {
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'block';
    }

    // PWA Install Prompt Logic
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-install-banner').style.display = 'block';
    });

    document.getElementById('pwa-install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User accepted the install prompt');
        }
        deferredPrompt = null;
        document.getElementById('pwa-install-banner').style.display = 'none';
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 系統最新版別標籤
    const SYSTEM_VERSION = "v3.8 (國定假日自動紅字與一廠共用槽位自由勾選排除)";

    // 數字格式化輔助函式：即時過濾前導 0
    const cleanNumStr = (val) => {
      if (val === undefined || val === null || val === '') return '';
      const str = String(val).trim();
      if (str === '') return '';
      if (str === '0') return '0';
      return str.replace(/^0+(?=\d)/, '');
    };

    // 廠區定義
    const PLANTS = [
      { id: "plant1", name: "🏭 彰濱一廠 (5槽共用原料池)", color: "blue" },
      { id: "plant2", name: "🏭 彰濱二廠 (TK617 LG / TK618 日本)", color: "indigo" }
    ];

    // 預設產線配置 (含試開俥開關運轉日期區間 trialStartDay / trialEndDay)
    const DEFAULT_LINES = [
      { id: "溶四", plantId: "plant1", enabled: true, flow: 1.4, yieldRate: 93.4, source: "SHARED_POOL", scrap: "TK652", autoSwitch: true, trialStartDay: 1, trialEndDay: 31 },
      { id: "溶五", plantId: "plant1", enabled: false, flow: 1.5, yieldRate: 92.0, source: "SHARED_POOL", scrap: "TK652", autoSwitch: true, trialStartDay: 1, trialEndDay: 31 },
      { id: "溶六", plantId: "plant2", enabled: true, flow: 1.5, yieldRate: 95.0, source: "TK617", scrap: "TK611", autoSwitch: false, trialStartDay: 1, trialEndDay: 31 },
      { id: "溶七", plantId: "plant2", enabled: false, flow: 1.5, yieldRate: 91.5, source: "TK618", scrap: "TK613", autoSwitch: false, trialStartDay: 1, trialEndDay: 31 }
    ];

    // 預設真實儲槽號碼
    const DEFAULT_TANKS = [
      { id: "TK604A", plantId: "plant1", name: "TK604A 原料槽 (一廠池 1)", type: "SUPPLY", isSharedPool: true, color: "blue", defaultInit: 300 },
      { id: "TK604B", plantId: "plant1", name: "TK604B 原料槽 (一廠池 2)", type: "SUPPLY", isSharedPool: true, color: "indigo", defaultInit: 250 },
      { id: "TK696",  plantId: "plant1", name: "TK696 原料槽 (一廠池 3)", type: "SUPPLY", isSharedPool: true, color: "sky", defaultInit: 200 },
      { id: "TK697",  plantId: "plant1", name: "TK697 原料槽 (一廠池 4)", type: "SUPPLY", isSharedPool: true, color: "cyan", defaultInit: 180 },
      { id: "TK693",  plantId: "plant1", name: "TK693 原料槽 (一廠池 5)", type: "SUPPLY", isSharedPool: true, color: "teal", defaultInit: 150 },
      { id: "TK652",  plantId: "plant1", name: "TK652 下腳料槽 (一廠)", type: "SCRAP", canRecycle: false, color: "emerald", defaultInit: 100 },

      { id: "TK617", plantId: "plant2", name: "TK617 原料槽 (LG)", type: "SUPPLY", isSharedPool: false, color: "blue", defaultInit: 335 },
      { id: "TK618", plantId: "plant2", name: "TK618 原料槽 (日本)", type: "SUPPLY", isSharedPool: false, color: "indigo", defaultInit: 150 },
      { id: "TK611", plantId: "plant2", name: "TK611 下腳料槽 (可回吃 🔄)", type: "SCRAP", canRecycle: true, color: "emerald", defaultInit: 100 },
      { id: "TK613", plantId: "plant2", name: "TK613 下腳料槽 (不可回吃 ⛔)", type: "SCRAP", canRecycle: false, color: "teal", defaultInit: 100 }
    ];

    const DEFAULT_TANK_INITS = {
      TK604A: 300, TK604B: 250, TK696: 200, TK697: 180, TK693: 150, TK652: 100, TK617: 335, TK618: 150, TK611: 100, TK613: 100
    };

    function IPASystemApp() {
      const [isDataLoaded, setIsDataLoaded] = useState(false);
      const [saveStatus, setSaveStatus] = useState('idle');

      // 歷史備份清單
      const [archiveList, setArchiveList] = useState([]);
      const [selectedArchive, setSelectedArchive] = useState('');
      const [isRestoring, setIsRestoring] = useState(false);

      // 第一層大分頁：("plant1" | "plant2" | "config")
      const [activePlantId, setActivePlantId] = useState("plant1");

      // 全域動態儲槽清單與產線清單
      const [tanksList, setTanksList] = useState(DEFAULT_TANKS);
      const [lines, setLines] = useState(DEFAULT_LINES);

      const [safetyStock, setSafetyStock] = useState(50);
      const [tankInits, setTankInits] = useState(DEFAULT_TANK_INITS);
      const [tankLimits, setTankLimits] = useState({
        TK604A: 50, TK604B: 50, TK696: 50, TK697: 50, TK693: 50, TK652: 200, TK617: 50, TK618: 50, TK611: 200, TK613: 200
      });

      // 試算依據切換：("FLOW" 產線流速滿載模式 | "SALES" 產銷當日計畫重量模式)
      const [calcMode, setCalcMode] = useState("FLOW");

      // 右側選單次分頁：("init" 1號期初庫存 | "sales" 產銷當日原料庫存)
      const [sideTab, setSideTab] = useState("init");

      // 產銷當日實體原料庫存重量 (salesPlanData[monthKey][targetKey][dayIdx])
      // 🌟 一廠為 'plant1'；二廠等獨立槽位為各自儲槽 ID (如 'TK617', 'TK618')
      const [salesPlanData, setSalesPlanData] = useState({});

      // 二廠/獨立槽位產銷庫存輸入切換選擇器 (例如 'TK617' 或 'TK618')
      const [selectedSalesTankId, setSelectedSalesTankId] = useState('TK617');

      // 月份分頁管理 (自動計算出當月與接續4個月份)
      const monthsList = useMemo(() => {
        const list = [];
        const now = new Date();
        let year = now.getFullYear();
        let month = now.getMonth();

        for (let i = 0; i < 4; i++) {
          const d = new Date(year, month + i, 1);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          list.push({
            key: `${y}-${m}`,
            label: `${y}/${m}月`,
            year: y,
            month: d.getMonth() + 1,
            daysCount: new Date(y, d.getMonth() + 1, 0).getDate()
          });
        }
        return list;
      }, []);

      const [activeMonthKey, setActiveMonthKey] = useState(monthsList[0].key);

      // 手動輸入項 (manualGridData[monthKey][tankId][dayIdx])
      const [manualGridData, setManualGridData] = useState({});

      // 新增產線 Modal 控制
      const [showAddLineModal, setShowAddLineModal] = useState(false);
      const [newLineName, setNewLineName] = useState('');
      const [newLinePlantId, setNewLinePlantId] = useState('plant1');
      const [newLineFlow, setNewLineFlow] = useState(1.5);
      const [newLineYield, setNewLineYield] = useState(93.4);
      const [newLineSource, setNewLineSource] = useState('SHARED_POOL');
      const [newLineScrap, setNewLineScrap] = useState('TK652');

      // 新增儲槽 Modal 控制
      const [showAddTankModal, setShowAddTankModal] = useState(false);
      const [newTankId, setNewTankId] = useState('');
      const [newTankName, setNewTankName] = useState('');
      const [newTankType, setNewTankType] = useState('SUPPLY');
      const [newTankPlantId, setNewTankPlantId] = useState('plant1');
      const [newTankIsShared, setNewTankIsShared] = useState(true);
      const [newTankCanRecycle, setNewTankCanRecycle] = useState(false);
      const [newTankInit, setNewTankInit] = useState(150);

      // 儲槽作業日報 08:00 重量歷史/當前資料庫
      const [tankDailyData, setTankDailyData] = useState({});
      const [selectedReportDate, setSelectedReportDate] = useState('');
      const [showDailyExcelModal, setShowDailyExcelModal] = useState(false);
      const [uploadedExcelFileName, setUploadedExcelFileName] = useState('');
      const [parsedExcelSheetsList, setParsedExcelSheetsList] = useState([]);
      const excelFileInputRef = useRef(null);

      // 原採進貨排程快速匯入 Modal 控制
      const [showProcurementModal, setShowProcurementModal] = useState(false);
      const [procurementRawText, setProcurementRawText] = useState('');
      const [parsedProcurementList, setParsedProcurementList] = useState([]);
      const [defaultImportTarget, setDefaultImportTarget] = useState('SHARED_POOL');

      // 從 LocalStorage 與 API 雲端雙向載入資料 (離線優先，永不丟失)
      const fetchAllData = async () => {
        setIsDataLoaded(false);

        // 🌟 1. 先從 LocalStorage 瞬間讀取本機快取 (確保即便 functions 404，資料也 100% 存在)
        try {
          const localSaved = localStorage.getItem('ipa_schedule_local_data');
          if (localSaved) {
            applyDataToState(JSON.parse(localSaved));
          }
        } catch (e) {
          console.warn("讀取本機快取失敗", e);
        }

        // 🌟 2. 非同步向雲端 D1 /api/data 對齊
        try {
          const res = await fetch('/api/data');
          if (res.ok) {
            const data = await res.json();
            if (!data._error && Object.keys(data).length > 0) {
              applyDataToState(data);
              localStorage.setItem('ipa_schedule_local_data', JSON.stringify(data));
            }
          }
          
          const archRes = await fetch('/api/archive');
          if (archRes.ok) {
            const list = await archRes.json();
            setArchiveList(list || []);
          }

          // 讀取儲槽作業日報 08:00 重量快照索引
          try {
            const dailyRes = await fetch('./tank_daily_0800.json');
            let mergedDaily = {};
            if (dailyRes.ok) {
              mergedDaily = await dailyRes.json();
            }
            // 合併本機 localStorage 歷史上傳之日報 Excel 快照
            try {
              const cachedStr = localStorage.getItem('ipa_custom_tank_daily');
              if (cachedStr) {
                const cachedDaily = JSON.parse(cachedStr);
                mergedDaily = { ...mergedDaily, ...cachedDaily };
              }
            } catch (e) {}
            setTankDailyData(mergedDaily || {});
          } catch (e) {
            console.warn("未能載入儲槽日報快照", e);
          }
        } catch (err) {
          console.warn("【雲端暫未連線，已採用本機保存資料】", err);
        } finally {
          setIsDataLoaded(true);
        }
      };

      const applyDataToState = (data) => {
        if (!data) return;
        if (data.safetyStock !== undefined) setSafetyStock(data.safetyStock !== null && data.safetyStock !== '' ? Number(data.safetyStock) : 50);
        if (data.calcMode) setCalcMode(data.calcMode);

        let loadedTanks = data.tanksList;
        if (!loadedTanks || !Array.isArray(loadedTanks) || loadedTanks.some(t => t.id === 'TK617' && t.plantId === 'plant1')) {
          loadedTanks = DEFAULT_TANKS;
        }
        setTanksList(loadedTanks);

        let loadedLines = data.lines;
        if (!loadedLines || !Array.isArray(loadedLines) || loadedLines.some(l => l.scrap === 'TK611' && l.plantId === 'plant1')) {
          loadedLines = DEFAULT_LINES;
        } else {
          loadedLines = loadedLines.map(l => ({ 
            ...l, 
            yieldRate: l.yieldRate !== undefined ? Number(l.yieldRate) : 93.4,
            trialStartDay: l.trialStartDay !== undefined ? Number(l.trialStartDay) : 1,
            trialEndDay: l.trialEndDay !== undefined ? Number(l.trialEndDay) : 31
          }));
        }
        setLines(loadedLines);

        if (data.tankInits) {
          const cleanedInits = {};
          Object.keys(data.tankInits).forEach(k => {
            cleanedInits[k] = data.tankInits[k] !== undefined ? cleanNumStr(data.tankInits[k]) : '';
          });
          setTankInits({ ...DEFAULT_TANK_INITS, ...cleanedInits });
        }
        if (data.tankLimits) setTankLimits(prev => ({ ...prev, ...data.tankLimits }));
        if (data.manualGridData) setManualGridData(data.manualGridData);
        if (data.salesPlanData) setSalesPlanData(data.salesPlanData);
      };

      useEffect(() => {
        fetchAllData();
      }, []);

      const getCurrentPayload = () => ({
        safetyStock, calcMode, tanksList, lines, tankInits, tankLimits, manualGridData, salesPlanData
      });

      const handleSave = async () => {
        const payload = getCurrentPayload();
        // 🌟 1. 永不遺失防護：任何修改立刻同步存入瀏覽器 localStorage！
        try {
          localStorage.setItem('ipa_schedule_local_data', JSON.stringify(payload));
        } catch(e) {}

        setSaveStatus('saving');
        try {
          const res = await fetch('/api/data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const resultText = await res.text();
          if (resultText === "SUCCESS") {
            setSaveStatus('success');
            setTimeout(() => setSaveStatus('idle'), 2000);
          } else {
            // 若雲端 functions 404，本機已安全儲存，顯示離線已存
            setSaveStatus('success');
            setTimeout(() => setSaveStatus('idle'), 2000);
          }
        } catch (err) {
          // 網路中斷或純前端環境，本機已安全儲存
          setSaveStatus('success');
          setTimeout(() => setSaveStatus('idle'), 2000);
        }
      };

      useEffect(() => {
        if (!isDataLoaded || isRestoring) return;
        const timer = setTimeout(handleSave, 2000);
        return () => clearTimeout(timer);
      }, [safetyStock, calcMode, tanksList, lines, tankInits, tankLimits, manualGridData, salesPlanData]);

      // 快照備份 (支援雲端 D1 + LocalStorage 雙軌備份)
      const handleArchiveOnly = async () => {
        const archiveName = window.prompt("請輸入備份紀錄名稱：");
        if (!archiveName || !archiveName.trim()) return;

        const cleanName = archiveName.trim();
        const payload = getCurrentPayload();
        setSaveStatus('saving');

        // 🌟 1. 本地 LocalStorage 快照儲存 (離線可用、保證不丟)
        try {
          const localArchsStr = localStorage.getItem('ipa_schedule_archives') || '[]';
          const localArchs = JSON.parse(localArchsStr);
          const newArchItem = {
            id: `${cleanName} (${new Date().toLocaleString('zh-TW', { hour12: false })})`,
            dataStr: JSON.stringify(payload),
            time: new Date().toISOString()
          };
          const updatedArchs = [newArchItem, ...localArchs.filter(a => a.id !== newArchItem.id)];
          localStorage.setItem('ipa_schedule_archives', JSON.stringify(updatedArchs));
          setArchiveList(updatedArchs);
        } catch(e) {}

        // 🌟 2. 嘗試同步至雲端 D1 /api/archive
        try {
          const res = await fetch('/api/archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ archiveName: cleanName, payload })
          });
          const resultText = await res.text();
          if (resultText === "SUCCESS") {
            const archRes = await fetch('/api/archive');
            if (archRes.ok) {
              const list = await archRes.json();
              setArchiveList(list);
            }
          }
        } catch (err) {
          console.warn("雲端存檔未連線，已安全保存至本機快照庫", err);
        }

        setSaveStatus('success');
        setTimeout(() => setSaveStatus('idle'), 2000);
        alert(`✅ 備份成功！已安全保存為「${cleanName}」`);
      };

      // 載入備份紀錄 (支援雲端與本機快照庫)
      const handleRestoreArchive = () => {
        if (!selectedArchive) return alert("請先選擇要載入的歷史備份！");
        const target = archiveList.find(a => a.id === selectedArchive);
        if (!target || !target.dataStr) return;

        if (window.confirm(`確定要載入備份「${selectedArchive}」嗎？現有資料將被覆蓋。`)) {
          try {
            setIsRestoring(true);
            applyDataToState(JSON.parse(target.dataStr));
            alert("✅ 載入備份成功！");
            setTimeout(() => { setIsRestoring(false); handleSave(); }, 800);
          } catch(e) { alert("解析歷史紀錄失敗"); }
        }
      };

      // 強制清空重置
      const handleClearAll = () => {
        if (window.confirm("確定要重置為最新產線與儲槽預設值嗎？")) {
          setTanksList(DEFAULT_TANKS);
          setLines(DEFAULT_LINES);
          setTankInits(DEFAULT_TANK_INITS);
          setManualGridData({});
          setSalesPlanData({});
          setTimeout(handleSave, 500);
        }
      };

      // 快速切換儲槽共用狀態（勾選納入/排除共用池）
      const toggleTankSharedPool = (tId) => {
        setTanksList(prev => {
          const nextTanks = prev.map(t => t.id === tId ? { ...t, isSharedPool: !t.isSharedPool } : t);
          const nextShared = nextTanks.filter(t => t.plantId === 'plant1' && t.type === 'SUPPLY' && t.isSharedPool);

          // 🌟 若當前處於產銷排產模式 (SALES)，自動根據當前起算日與日報資料，動態扣除或加回該槽重量！
          if (calcMode === 'SALES' && latestSalesDayIndex >= 0) {
            const dayNum = latestSalesDayIndex + 1;
            const targetDateStr = `${activeMonthObj.year}-${String(activeMonthObj.month).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
            const dData = tankDailyData[targetDateStr];

            if (dData) {
              // 重新計算當日僅屬於 nextShared 的合計重量
              let newTotal = 0;
              let includedCount = 0;
              nextShared.forEach(st => {
                if (dData[st.id] !== undefined) {
                  newTotal += Number(dData[st.id]) || 0;
                  includedCount++;
                }
              });

              if (includedCount > 0) {
                newTotal = Math.round(newTotal * 100) / 100;
                setSalesPlanData(prevSales => {
                  const mData = prevSales[activeMonthKey] || {};
                  const p1Data = mData['plant1'] || {};
                  return {
                    ...prevSales,
                    [activeMonthKey]: {
                      ...mData,
                      plant1: {
                        ...p1Data,
                        [latestSalesDayIndex]: String(newTotal)
                      }
                    }
                  };
                });
              }
            }
          }
          return nextTanks;
        });
      };

      // 快速切換下腳料槽回吃狀態
      const toggleTankCanRecycle = (tId) => {
        setTanksList(prev => prev.map(t => t.id === tId ? { ...t, canRecycle: !t.canRecycle } : t));
      };

      // 新增儲槽處理
      const handleAddTank = () => {
        if (!newTankId.trim()) return alert("請輸入儲槽代號！");
        const tId = newTankId.trim().toUpperCase();
        if (tanksList.some(t => t.id === tId)) return alert("該儲槽代號已存在！");

        const colors = ["blue", "indigo", "sky", "cyan", "emerald", "teal", "amber", "purple", "slate"];
        const randomColor = colors[tanksList.length % colors.length];

        const newTank = {
          id: tId,
          plantId: newTankPlantId,
          name: newTankName.trim() || `${tId} 槽`,
          type: newTankType,
          isSharedPool: (newTankPlantId === 'plant1' && newTankType === 'SUPPLY') ? newTankIsShared : false,
          canRecycle: newTankType === 'SCRAP' ? newTankCanRecycle : false,
          color: randomColor,
          defaultInit: parseFloat(newTankInit) || 100
        };

        setTanksList([...tanksList, newTank]);
        setTankInits(prev => ({ ...prev, [tId]: parseFloat(newTankInit) || 100 }));
        setNewTankId('');
        setNewTankName('');
        setShowAddTankModal(false);
      };

      // 刪除儲槽處理
      const handleDeleteTank = (tId) => {
        if (tanksList.length <= 1) return alert("至少需保留一個儲槽！");
        if (window.confirm(`確定要刪除儲槽「${tId}」嗎？`)) {
          setTanksList(tanksList.filter(t => t.id !== tId));
        }
      };

      // 開啟新增產線 Modal
      const openAddLineModal = () => {
        const defaultP = activePlantId === 'config' ? 'plant1' : activePlantId;
        setNewLinePlantId(defaultP);
        const plantSupplyTanks = tanksList.filter(t => t.plantId === defaultP && t.type === 'SUPPLY');
        const plantScrapTanks = tanksList.filter(t => t.plantId === defaultP && t.type === 'SCRAP');

        setNewLineSource(defaultP === 'plant1' ? 'SHARED_POOL' : (plantSupplyTanks[0] ? plantSupplyTanks[0].id : 'TK617'));
        setNewLineScrap(plantScrapTanks[0] ? plantScrapTanks[0].id : 'TK652');
        setShowAddLineModal(true);
      };

      // 新增產線處理
      const handleAddLine = () => {
        if (!newLineName.trim()) return alert("請輸入產線名稱！");
        const lineId = newLineName.trim();
        if (lines.some(l => l.id === lineId)) return alert("該產線名稱已存在！");

        const newLine = {
          id: lineId,
          plantId: newLinePlantId,
          enabled: true,
          flow: parseFloat(newLineFlow) || 1.5,
          yieldRate: parseFloat(newLineYield) || 93.4,
          source: newLineSource,
          scrap: newLineScrap,
          autoSwitch: true
        };
        setLines([...lines, newLine]);
        setNewLineName('');
        setShowAddLineModal(false);
      };

      // 刪除產線處理
      const handleDeleteLine = (id) => {
        if (lines.length <= 1) return alert("至少需保留一條產線！");
        if (window.confirm(`確定要刪除產線「${id}」嗎？`)) {
          setLines(lines.filter(l => l.id !== id));
        }
      };

      // 手動更新進耗存單一格子值
      const handleGridInputChange = (mKey, tankId, field, dayIdx, rawVal) => {
        const cleanedVal = cleanNumStr(rawVal);
        setManualGridData(prev => {
          const mData = prev[mKey] || {};
          const tData = mData[tankId] || {};
          const dData = tData[dayIdx] || {};
          return {
            ...prev,
            [mKey]: {
              ...mData,
              [tankId]: {
                ...tData,
                [dayIdx]: { ...dData, [field]: cleanedVal }
              }
            }
          };
        });
      };

      // 手動更新產銷當日實體原料庫存重量 (支援一廠共用池與二廠獨立槽位 targetKey)
      const handleSalesPlanChange = (mKey, targetKey, dayIdx, rawVal) => {
        const cleanedVal = cleanNumStr(rawVal);
        setSalesPlanData(prev => {
          const mData = prev[mKey] || {};
          const tData = mData[targetKey] || {};
          return {
            ...prev,
            [mKey]: {
              ...mData,
              [targetKey]: {
                ...tData,
                [dayIdx]: cleanedVal
              }
            }
          };
        });
      };

      // 篩選當前廠區的產線
      const activePlantLines = useMemo(() => {
        return lines.filter(l => (l.plantId || 'plant1') === activePlantId);
      }, [lines, activePlantId]);

      // 篩選當前廠區歸屬的儲槽
      const activePlantTanks = useMemo(() => {
        return tanksList.filter(t => (t.plantId || 'plant1') === activePlantId);
      }, [tanksList, activePlantId]);

      // 當前廠區的原料槽選單 (SUPPLY)
      const currentPlantSupplyTanks = useMemo(() => {
        const targetP = activePlantId === 'config' ? newLinePlantId : activePlantId;
        return tanksList.filter(t => (t.plantId || 'plant1') === targetP && t.type === 'SUPPLY');
      }, [tanksList, activePlantId, newLinePlantId]);

      // 當前廠區的下腳料槽選單 (SCRAP)
      const currentPlantScrapTanks = useMemo(() => {
        const targetP = activePlantId === 'config' ? newLinePlantId : activePlantId;
        return tanksList.filter(t => (t.plantId || 'plant1') === targetP && t.type === 'SCRAP');
      }, [tanksList, activePlantId, newLinePlantId]);

      // 一廠「共用原料池」的槽位清單
      const plant1SharedPoolTanks = useMemo(() => {
        return tanksList.filter(t => t.plantId === 'plant1' && t.type === 'SUPPLY' && t.isSharedPool);
      }, [tanksList]);

      // 自動偵測當前月份物件
      const activeMonthObj = useMemo(() => {
        return monthsList.find(m => m.key === activeMonthKey) || monthsList[0];
      }, [monthsList, activeMonthKey]);

      const activePlantObj = useMemo(() => {
        return PLANTS.find(p => p.id === activePlantId) || PLANTS[0];
      }, [activePlantId]);

      // 國定假日與行事曆自動同步 (支援每年自動抓取與離線快取)
      const [holidayMap, setHolidayMap] = useState({});

      useEffect(() => {
        const curYear = activeMonthObj.year;
        if (!curYear) return;
        const cacheKey = `tw_calendar_${curYear}`;

        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          try {
            setHolidayMap(JSON.parse(cached));
          } catch(e) {}
        }

        fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${curYear}.json`)
          .then(res => {
            if (!res.ok) throw new Error('Calendar fetch status: ' + res.status);
            return res.json();
          })
          .then(data => {
            const map = {};
            data.forEach(item => {
              // 支援官方 isHoliday (包含補班日為 false、國定假日與放假日為 true)
              map[item.date] = {
                isHoliday: item.isHoliday,
                description: item.description || ''
              };
            });
            setHolidayMap(map);
            localStorage.setItem(cacheKey, JSON.stringify(map));
          })
          .catch(err => {
            console.warn('無法連線取得最新國定假日，採用系統預設六日與快取:', err);
          });
      }, [activeMonthObj.year]);

      // 判斷某一天是否為休假/國定假日（變紅）
      const checkIsRedDay = (year, month, day) => {
        const yyyy = String(year);
        const mm = String(month).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const dateKey = `${yyyy}${mm}${dd}`;

        if (holidayMap[dateKey] !== undefined) {
          return {
            isRed: !!holidayMap[dateKey].isHoliday,
            holidayName: holidayMap[dateKey].description || ''
          };
        }

        const dayDate = new Date(year, month - 1, day);
        const isWeekend = [0, 6].includes(dayDate.getDay());
        return {
          isRed: isWeekend,
          holidayName: ''
        };
      };

      // 當切換到二廠等獨立槽廠區時，確保 selectedSalesTankId 為該廠有效的原料槽
      useEffect(() => {
        if (activePlantId !== 'config') {
          const supplyTanks = tanksList.filter(t => t.plantId === activePlantId && t.type === 'SUPPLY');
          if (supplyTanks.length > 0 && !supplyTanks.some(t => t.id === selectedSalesTankId)) {
            setSelectedSalesTankId(supplyTanks[0].id);
          }
        }
      }, [activePlantId, tanksList]);

      // 自動偵測「產銷計畫模式 (SALES)」下當前廠區「最後一個 (最新填寫)」有排產目標之日期索引 (0-indexed)
      // 使用者若連續填寫多個日期（如 10/5 後又填 10/12），系統自動以「最後/最新填寫之日期」為起算點，無需手動清空舊日期
      const latestSalesDayIndex = useMemo(() => {
        if (calcMode !== 'SALES') return 0;
        const monthSales = salesPlanData[activeMonthKey] || {};
        
        // 依當前廠區鎖定目標 targetKeys (一廠為 'plant1'，二廠為該廠所屬原料槽)
        const targetKeys = activePlantId === 'plant1'
          ? ['plant1']
          : tanksList.filter(t => (t.plantId || 'plant1') === activePlantId && t.type === 'SUPPLY').map(t => t.id);

        for (let i = activeMonthObj.daysCount - 1; i >= 0; i--) {
          for (const key of targetKeys) {
            if (monthSales[key] && monthSales[key][i] !== undefined && monthSales[key][i] !== '' && parseFloat(monthSales[key][i]) > 0) {
              return i;
            }
          }
        }
        return 0;
      }, [calcMode, salesPlanData, activeMonthKey, activePlantId, activeMonthObj, tanksList]);

      // 計算要呈現的日期索引陣列 (依最新起算日向後截取至月底)
      const displayDaysArr = useMemo(() => {
        const startIdx = latestSalesDayIndex;
        const total = activeMonthObj.daysCount - startIdx;
        return Array.from({ length: total }, (_, i) => startIdx + i);
      }, [latestSalesDayIndex, activeMonthObj]);

      // 當月有日報資料的日期清單 (供下拉選單快速選取，由新至舊排序)
      const availableReportDates = useMemo(() => {
        if (!tankDailyData) return [];
        return Object.keys(tankDailyData)
          .filter(d => d.startsWith(activeMonthKey))
          .sort()
          .reverse()
          .map(dateStr => {
            const dData = tankDailyData[dateStr] || {};
            const dayNum = parseInt(dateStr.split('-')[2], 10);
            const summary = activePlantId === 'plant1'
              ? (dData.plant1 ? `(一廠 ${dData.plant1}T)` : '')
              : (dData.TK617 || dData.TK618 ? `(617:${dData.TK617 || 0}T / 618:${dData.TK618 || 0}T)` : '');
            return {
              date: dateStr,
              dayIdx: dayNum - 1,
              label: `${activeMonthObj.month}/${dayNum}日`,
              summary
            };
          });
      }, [tankDailyData, activeMonthKey, activePlantId, activeMonthObj]);

      // 解析儲槽作業日報 Excel (.xlsm / .xlsx) 檔案
      const parseDailyReportExcelBuffer = (arrayBuffer, fileName) => {
        try {
          if (!window.XLSX) {
            return alert("XLSX 解析引擎尚未載入完成，請稍候重試！");
          }
          const wb = window.XLSX.read(arrayBuffer, { type: 'array' });
          const yearMatch = fileName.match(/(\d{4})/);
          const fileYear = yearMatch ? parseInt(yearMatch[1], 10) : activeMonthObj.year;

          const detectedEntries = [];
          const updatedDaily = { ...tankDailyData };

          wb.SheetNames.forEach(sheetName => {
            const cleanSheetName = sheetName.trim();
            const match = cleanSheetName.match(/^(\d{1,2})\.(\d{1,2})$/);
            if (!match) return;

            const m = parseInt(match[1], 10);
            const d = parseInt(match[2], 10);
            const dateKey = `${fileYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

            const sheet = wb.Sheets[sheetName];
            const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            if (!rows || rows.length === 0) return;

            const tanksMap = {
              'TK604A': 'TK604A', 'TK604B': 'TK604B', 
              'TK696': 'TK696', 'TK697': 'TK697', 'TK693': 'TK693',
              'TK652': 'TK652', 'TK611': 'TK611', 'TK613': 'TK613',
              'TK617': 'TK617', 'TK618': 'TK618'
            };

            const dayTanks = {};
            const maxRows = Math.min(40, rows.length);

            for (let r = 0; r < maxRows; r++) {
              const row = rows[r] || [];
              for (let c = 0; c < row.length; c++) {
                const valNorm = String(row[c] || '').trim().toUpperCase().replace(/[- ]/g, '');
                if (tanksMap[valNorm]) {
                  const tKey = tanksMap[valNorm];
                  for (let sr = r + 1; sr < Math.min(r + 8, rows.length); sr++) {
                    const rowSr = rows[sr] || [];
                    const label = String(rowSr[2] || '') + String(rowSr[1] || '') + String(rowSr[0] || '');
                    if (label.includes('重量') || label.toLowerCase().includes('kg')) {
                      const kg = parseFloat(rowSr[c]);
                      if (!isNaN(kg) && kg > 0) {
                        dayTanks[tKey] = Math.round(kg / 10) / 100;
                        break;
                      }
                    }
                  }
                }
              }
            }

            const p1Tanks = ['TK604A', 'TK604B', 'TK696', 'TK697', 'TK693'];
            let p1Sum = 0;
            let hasP1 = false;
            p1Tanks.forEach(tk => {
              if (dayTanks[tk] !== undefined) {
                p1Sum += dayTanks[tk];
                hasP1 = true;
              }
            });
            if (hasP1 && p1Sum > 0) {
              dayTanks.plant1 = Math.round(p1Sum * 100) / 100;
            }

            if (Object.keys(dayTanks).length > 0) {
              updatedDaily[dateKey] = { ...(updatedDaily[dateKey] || {}), ...dayTanks };
              const summary = activePlantId === 'plant1'
                ? (dayTanks.plant1 ? `(一廠 ${dayTanks.plant1}T)` : '')
                : (dayTanks.TK617 || dayTanks.TK618 ? `(617:${dayTanks.TK617 || 0}T / 618:${dayTanks.TK618 || 0}T)` : '');

              detectedEntries.push({
                dateStr: dateKey,
                month: m,
                day: d,
                sheetName: cleanSheetName,
                tanks: dayTanks,
                plant1: dayTanks.plant1,
                TK617: dayTanks.TK617,
                TK618: dayTanks.TK618,
                summary
              });
            }
          });

          if (detectedEntries.length === 0) {
            return alert(`⚠️ 檔案 [${fileName}] 中未讀取到符合「M.D (如 10.1, 10.8, 10.12)」命名之日報分頁！`);
          }

          // 依日期由新至舊排序
          detectedEntries.sort((a, b) => b.dateStr.localeCompare(a.dateStr));

          setTankDailyData(updatedDaily);
          try {
            localStorage.setItem('ipa_custom_tank_daily', JSON.stringify(updatedDaily));
          } catch(e) {}

          setUploadedExcelFileName(fileName);
          setParsedExcelSheetsList(detectedEntries);
          setSelectedReportDate(detectedEntries[0].dateStr);
          setShowDailyExcelModal(true);
        } catch (err) {
          console.error("解析 Excel 失敗", err);
          alert("解析 Excel 失敗：" + err.message);
        }
      };

      // 觸發日報 Excel 上傳
      const handleDailyReportExcelUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const arrayBuffer = event.target.result;
          parseDailyReportExcelBuffer(arrayBuffer, file.name);
          if (excelFileInputRef.current) excelFileInputRef.current.value = '';
        };
        reader.readAsArrayBuffer(file);
      };

      // 一鍵帶入儲槽日報 08:00 重量至產銷起算基準
      const handleApplyDailyReport = (targetDateStr) => {
        const dateToUse = targetDateStr || selectedReportDate;
        if (!dateToUse) return alert("請先從下拉選單選擇要帶入的日報日期！");
        const dData = tankDailyData[dateToUse];
        if (!dData) return alert("查無該日期的儲槽日報重量資料！");

        const dayIdx = parseInt(dateToUse.split('-')[2], 10) - 1;
        const mKey = dateToUse.slice(0, 7);

        if (activePlantId === 'plant1') {
          // 動態依目前有勾選「納入共用池」的槽位加總（若 TK693 被取消勾選排除，則不計入共用池起算）
          const currentShared = plant1SharedPoolTanks;
          let weight = 0;
          let includedTanks = [];
          currentShared.forEach(st => {
            const tw = dData[st.id] !== undefined ? dData[st.id] : 0;
            weight += tw;
            includedTanks.push(`${st.id}:${tw}T`);
          });
          weight = Math.round(weight * 100) / 100;

          if (weight === 0 && dData.plant1) {
            weight = dData.plant1; // 若無分槽資料則退回總計
          }

          if (weight === undefined || weight === 0) {
            return alert(`日報中查無 ${dateToUse} 一廠共用槽位重量！`);
          }
          handleSalesPlanChange(mKey, 'plant1', dayIdx, String(weight));
          setCalcMode('SALES');
          setShowDailyExcelModal(false);
          alert(`✅ 已成功帶入 ${dateToUse} 08:00 儲槽日報重量！\n共用池合計：${weight} 噸 (${includedTanks.join(', ')})\n系統已自動填入產銷 ${parseInt(dateToUse.split('-')[2], 10)} 日並切換至【產銷排產模式】起算。`);
        } else {
          // 二廠
          const w617 = dData.TK617 || 0;
          const w618 = dData.TK618 || 0;
          if (w617 > 0) handleSalesPlanChange(mKey, 'TK617', dayIdx, String(w617));
          if (w618 > 0) handleSalesPlanChange(mKey, 'TK618', dayIdx, String(w618));
          setCalcMode('SALES');
          setShowDailyExcelModal(false);
          alert(`✅ 已成功帶入 ${dateToUse} 08:00 儲槽日報重量！\nTK617: ${w617} 噸 / TK618: ${w618} 噸\n系統已自動填入產銷 ${parseInt(dateToUse.split('-')[2], 10)} 日並切換至【產銷排產模式】起算。`);
        }
      };

      // 原採文字/表格貼上解析
      const handleProcurementTextChange = (text) => {
        setProcurementRawText(text);
        if (!text.trim()) {
          setParsedProcurementList([]);
          return;
        }

        const lines = text.split('\n');
        const items = [];

        lines.forEach((line, idx) => {
          const l = line.trim();
          if (!l) return;
          if (l.includes('數量') || l.includes('訂單') || l.includes('ETD') || l.includes('ETA')) return;

          // 1. 匹配預計入廠日期 (取最後出現的日期，如 10/14-15, 11/3-4, 10/28)
          const dateMatches = [...l.matchAll(/(\d{1,2})\/(\d{1,2})(?:-(\d{1,2}))?/g)];
          const lastDateMatch = dateMatches.length > 0 ? dateMatches[dateMatches.length - 1] : null;
          const isPending = l.includes('待定');

          // 若完全沒有日期也沒有待定，跳過此行
          if (!lastDateMatch && !isPending) return;

          // 2. 精確匹配重量：優先匹配帶有 MT / 噸 / T 的數字 (例如 175MT, 175 MT, 175.5噸)
          // 嚴防誤將 CIF-5 或 FOB-6 中的「5」或「6」誤判為重量！
          let weight = 0;
          const weightWithUnit = l.match(/(\d+(?:\.\d+)?)\s*(?:MT|噸|T)\b/i);
          if (weightWithUnit) {
            weight = parseFloat(weightWithUnit[1]) || 0;
          } else {
            // 若未帶單位，匹配位於單號/批號之後、日期或待定之前的獨立純數字 (如 175)
            const fallbackWeight = l.match(/(?:(?:CIF|FOB|EXW)[-\s\w]+|\d{4}-I\d+)\s+(\d+(?:\.\d+)?)\b/i);
            if (fallbackWeight) {
              weight = parseFloat(fallbackWeight[1]) || 0;
            }
          }

          if (weight <= 0) return;

          // 3. 精確匹配單號與批號 (例如 CIF-5 2609-I05, FOB-10 2610-I10, 或獨立單號)
          // 嚴格限制在單號/批號格式，不向後貪婪吞入重量與日期
          let poStr = `進貨-${idx + 1}`;
          const fullPoMatch = l.match(/((?:CIF|FOB|EXW)[-\s]?\w+(?:\s+\d{4}-I\d+)?)/i) || l.match(/(\d{4}-I\d+)/i);
          if (fullPoMatch) {
            poStr = fullPoMatch[1].trim();
          }

          let m = activeMonthObj.month;
          let d = 1;
          let dateDisplay = '待定';

          if (lastDateMatch) {
            m = parseInt(lastDateMatch[1], 10);
            d = parseInt(lastDateMatch[2], 10); // 取區間起始日
            dateDisplay = lastDateMatch[0];
          }

          items.push({
            id: idx,
            po: poStr,
            weight: weight,
            month: m,
            day: d,
            dateDisplay: dateDisplay,
            targetTank: defaultImportTarget,
            isPending: isPending
          });
        });

        setParsedProcurementList(items);
      };

      // 確認批次寫入原採排程
      const handleConfirmProcurementImport = () => {
        const activeItems = parsedProcurementList.filter(it => !it.isPending && it.weight > 0 && it.month && it.day);
        if (activeItems.length === 0) {
          return alert("沒有可匯入的有效排程資料（請確認是否皆為待定或無數量）！");
        }

        setManualGridData(prev => {
          const updated = JSON.parse(JSON.stringify(prev));

          activeItems.forEach(item => {
            const targetMonthObj = monthsList.find(m => m.month === item.month) || activeMonthObj;
            const mKey = targetMonthObj.key;
            const dayIdx = item.day - 1;

            if (!updated[mKey]) updated[mKey] = {};

            if (item.targetTank === 'SHARED_POOL') {
              const sharedTanks = plant1SharedPoolTanks;
              const count = sharedTanks.length > 0 ? sharedTanks.length : 1;
              const perTank = Math.round((item.weight / count) * 10) / 10;
              sharedTanks.forEach((st, idx) => {
                if (!updated[mKey][st.id]) updated[mKey][st.id] = {};
                if (!updated[mKey][st.id][dayIdx]) updated[mKey][st.id][dayIdx] = {};
                const currentIn = parseFloat(updated[mKey][st.id][dayIdx].in) || 0;
                const addVal = (idx === count - 1) ? (item.weight - perTank * (count - 1)) : perTank;
                updated[mKey][st.id][dayIdx].in = String(Math.round((currentIn + addVal) * 10) / 10);
              });
            } else {
              const tId = item.targetTank;
              if (!updated[mKey][tId]) updated[mKey][tId] = {};
              if (!updated[mKey][tId][dayIdx]) updated[mKey][tId][dayIdx] = {};
              const currentIn = parseFloat(updated[mKey][tId][dayIdx].in) || 0;
              updated[mKey][tId][dayIdx].in = String(Math.round((currentIn + item.weight) * 10) / 10);
            }
          });

          return updated;
        });

        setShowProcurementModal(false);
        setProcurementRawText('');
        setParsedProcurementList([]);
        alert(`🎉 成功匯入 ${activeItems.length} 筆原採排程至對應月份之【進貨量 (+)】！`);
      };

      /**
       * 🟢 雙核心計算引擎 (一廠共用池 + 二廠獨立儲槽 產銷原料庫存獨立起算)
       */
      const calculatedData = useMemo(() => {
        const result = {}; 
        const poolSummary = {}; 

        let previousMonthEndingStock = {};
        tanksList.forEach(t => {
          const initVal = tankInits[t.id];
          previousMonthEndingStock[t.id] = (initVal !== undefined && initVal !== '') ? (parseFloat(initVal) || 0) : (t.defaultInit || 100);
        });

        monthsList.forEach((mObj) => {
          const mKey = mObj.key;
          const daysCount = mObj.daysCount;
          result[mKey] = {};
          poolSummary[mKey] = [];

          let currentStock = { ...previousMonthEndingStock };

          tanksList.forEach(t => {
            result[mKey][t.id] = [];
            if (currentStock[t.id] === undefined) {
              const initVal = tankInits[t.id];
              currentStock[t.id] = (initVal !== undefined && initVal !== '') ? (parseFloat(initVal) || 0) : (t.defaultInit || 100);
            }
          });

          // 自動偵測當月一廠與各獨立儲槽最後一個 (最新) 輸入之產銷日期索引
          const p1LatestSalesDay = (() => {
            if (calcMode !== 'SALES') return -1;
            const pData = (salesPlanData[mKey] && salesPlanData[mKey]['plant1']) || {};
            for (let i = daysCount - 1; i >= 0; i--) {
              if (pData[i] !== undefined && pData[i] !== '' && parseFloat(pData[i]) > 0) return i;
            }
            return -1;
          })();

          const indTankLatestSalesDay = {};
          if (calcMode === 'SALES') {
            tanksList.filter(t => t.type === 'SUPPLY' && !t.isSharedPool).forEach(sTank => {
              const pData = (salesPlanData[mKey] && salesPlanData[mKey][sTank.id]) || {};
              indTankLatestSalesDay[sTank.id] = -1;
              for (let i = daysCount - 1; i >= 0; i--) {
                if (pData[i] !== undefined && pData[i] !== '' && parseFloat(pData[i]) > 0) {
                  indTankLatestSalesDay[sTank.id] = i;
                  break;
                }
              }
            });
          }

          for (let dayIdx = 0; dayIdx < daysCount; dayIdx++) {
            // 🌟 1. 一廠共用池產銷原料起算 (僅在最新起算日當天生效，避免歷史舊輸入干擾)
            const p1SalesRawWeight = (calcMode === 'SALES' && dayIdx === p1LatestSalesDay)
              ? (parseFloat((salesPlanData[mKey] && salesPlanData[mKey]['plant1'] && salesPlanData[mKey]['plant1'][dayIdx])) || 0)
              : 0;

            if (p1SalesRawWeight > 0) {
              const sharedTanks = plant1SharedPoolTanks;
              if (sharedTanks.length > 0) {
                const perTankWeight = p1SalesRawWeight / sharedTanks.length;
                sharedTanks.forEach(st => {
                  currentStock[st.id] = perTankWeight;
                });
              }
            }

            // 🌟 2. 二廠/獨立原料槽產銷原料起算 (僅在各槽最新起算日當天生效)
            if (calcMode === 'SALES') {
              tanksList.filter(t => t.type === 'SUPPLY' && !t.isSharedPool).forEach(sTank => {
                if (dayIdx === indTankLatestSalesDay[sTank.id]) {
                  const tankSalesWeight = parseFloat((salesPlanData[mKey] && salesPlanData[mKey][sTank.id] && salesPlanData[mKey][sTank.id][dayIdx])) || 0;
                  if (tankSalesWeight > 0) {
                    currentStock[sTank.id] = tankSalesWeight;
                  }
                }
              });
            }

            let dailyPlant1PoolDemand = 0; 
            let dailyDedicatedDemand = {}; 
            let dailyScrapGen = {};

            tanksList.filter(t => t.type === 'SUPPLY').forEach(st => dailyDedicatedDemand[st.id] = 0);
            tanksList.filter(t => t.type === 'SCRAP').forEach(st => dailyScrapGen[st.id] = 0);

            // 產銷排產模式下，在起算日之前機台不扣料與產生下腳料，確保起算日庫存精準純淨
            const isP1Active = calcMode !== 'SALES' || p1LatestSalesDay === -1 || dayIdx >= p1LatestSalesDay;

            // 每天實際機台製程運作耗用的原料量 (Flow * 24 / Yield%，依試開俥區間過濾)
            lines.forEach(line => {
              if (line.enabled) {
                const linePlant = line.plantId || 'plant1';
                if (linePlant === 'plant1' && !isP1Active) return;
                if (linePlant !== 'plant1' && calcMode === 'SALES') {
                  const src = line.source;
                  if (src && indTankLatestSalesDay[src] !== undefined && indTankLatestSalesDay[src] !== -1 && dayIdx < indTankLatestSalesDay[src]) {
                    return;
                  }
                }

                const currentDayNum = dayIdx + 1;
                const startD = (line.trialStartDay !== undefined && line.trialStartDay !== '') ? Number(line.trialStartDay) : 1;
                const endD = (line.trialEndDay !== undefined && line.trialEndDay !== '') ? Number(line.trialEndDay) : 31;

                // 🌟 判定當日是否屬於開俥開機區間 (非區間日期運算耗用為 0)
                if (currentDayNum >= startD && currentDayNum <= endD) {
                  const flow = parseFloat(line.flow) || 0;
                  const lineYieldPct = (parseFloat(line.yieldRate) || 93.4) / 100;
                  
                  const rawNeed = (flow * 24) / lineYieldPct;
                  const scrapOut = rawNeed - (flow * 24);

                  const src = line.source || 'SHARED_POOL';
                  if (src === 'SHARED_POOL') {
                    dailyPlant1PoolDemand += rawNeed;
                  } else {
                    if (!dailyDedicatedDemand[src]) dailyDedicatedDemand[src] = 0;
                    dailyDedicatedDemand[src] += rawNeed;
                  }

                  const scrapT = line.scrap;
                  if (scrapT && dailyScrapGen[scrapT] !== undefined) dailyScrapGen[scrapT] += scrapOut;
                }
              }
            });

            // 1. 一廠共用原料池試算與扣減
            let poolStartSum = 0;
            let poolInSum = 0;
            let poolTransSum = 0;

            const sharedTanks = plant1SharedPoolTanks;
            sharedTanks.forEach(st => {
              const sId = st.id;
              const mInputs = (manualGridData[mKey] && manualGridData[mKey][sId] && manualGridData[mKey][sId][dayIdx]) || {};
              poolStartSum += currentStock[sId];
              poolInSum += parseFloat(mInputs.in) || 0;
              poolTransSum += parseFloat(mInputs.trans) || 0;
            });

            let remPoolDemand = dailyPlant1PoolDemand;

            sharedTanks.forEach(st => {
              const sId = st.id;
              const mInputs = (manualGridData[mKey] && manualGridData[mKey][sId] && manualGridData[mKey][sId][dayIdx]) || {};
              const inVal = parseFloat(mInputs.in) || 0;
              const trVal = parseFloat(mInputs.trans) || 0;

              let tempVal = currentStock[sId] + inVal + trVal;
              let dedDemand = dailyDedicatedDemand[sId] || 0;
              tempVal -= dedDemand;

              let allocatedPoolUse = Math.min(Math.max(0, tempVal), remPoolDemand);
              remPoolDemand -= allocatedPoolUse;
              let totalUse = dedDemand + allocatedPoolUse;

              let endVal = currentStock[sId] + inVal + trVal - totalUse;
              result[mKey][sId].push({ start: currentStock[sId], in: inVal, trans: trVal, use: totalUse, end: endVal });
              currentStock[sId] = endVal;
            });

            // 🌟 核心防呆修正：當共用原料池庫存耗盡且仍有未滿足之製程耗用 (赤字/缺料) 時，
            // 必須將剩餘缺料累扣入共用儲槽，使當日負結存精確遞延累積至次日期初，避免每日歸零未累加！
            if (remPoolDemand > 0 && sharedTanks.length > 0) {
              const deficitPerTank = remPoolDemand / sharedTanks.length;
              sharedTanks.forEach((st, idx) => {
                const sId = st.id;
                const curDeficit = (idx === sharedTanks.length - 1)
                  ? (remPoolDemand - deficitPerTank * (sharedTanks.length - 1))
                  : deficitPerTank;
                const tankRecords = result[mKey][sId];
                const lastRec = tankRecords[tankRecords.length - 1];
                if (lastRec) {
                  lastRec.use += curDeficit;
                  lastRec.end -= curDeficit;
                }
                currentStock[sId] -= curDeficit;
              });
              remPoolDemand = 0;
            }

            let poolEndSum = poolStartSum + poolInSum + poolTransSum - dailyPlant1PoolDemand;
            poolSummary[mKey].push({
              start: poolStartSum,
              in: poolInSum,
              trans: poolTransSum,
              use: dailyPlant1PoolDemand, // 每日機台實體耗料 (如 36T/33T)
              salesRawWeight: p1SalesRawWeight,
              end: poolEndSum,
              isShortage: poolEndSum < (parseFloat(safetyStock) || 50)
            });

            // 2. 非共用池獨立原料槽計算 (TK617, TK618...)
            tanksList.filter(st => st.type === 'SUPPLY' && !st.isSharedPool).forEach(sTank => {
              const sId = sTank.id;
              const mInputs = (manualGridData[mKey] && manualGridData[mKey][sId] && manualGridData[mKey][sId][dayIdx]) || {};
              const inVal = parseFloat(mInputs.in) || 0;
              const trVal = parseFloat(mInputs.trans) || 0;

              let useVal = dailyDedicatedDemand[sId] || 0;
              let tempVal = currentStock[sId] + inVal + trVal;
              let endVal = tempVal - useVal;

              result[mKey][sId].push({ start: currentStock[sId], in: inVal, trans: trVal, use: useVal, end: endVal });
              currentStock[sId] = endVal;
            });

            // 3. 下腳料槽計算
            tanksList.filter(st => st.type === 'SCRAP').forEach(scTank => {
              const scId = scTank.id;
              const scInputs = (manualGridData[mKey] && manualGridData[mKey][scId] && manualGridData[mKey][scId][dayIdx]) || {};
              const scIn = parseFloat(scInputs.in) || 0;
              const scUse = parseFloat(scInputs.use) || 0; 
              const scRecycle = scTank.canRecycle ? (parseFloat(scInputs.recycle) || 0) : 0; 
              const autoScrapIn = dailyScrapGen[scId] || 0;

              const endScrap = currentStock[scId] + autoScrapIn + scIn - scUse - scRecycle;
              result[mKey][scId].push({ 
                start: currentStock[scId], 
                autoIn: autoScrapIn, 
                in: scIn, 
                use: scUse, 
                recycle: scRecycle, 
                end: endScrap 
              });
              currentStock[scId] = endScrap;
            });
          }

          // 🌟 跨月連續傳承：將月底最後一天的動態結存，精確傳承給下個月第 1 天！
          previousMonthEndingStock = { ...currentStock };
        });

        return { result, poolSummary };
      }, [monthsList, safetyStock, calcMode, tanksList, lines, tankInits, manualGridData, salesPlanData, plant1SharedPoolTanks]);

      // 匯出 CSV 報表
      const exportCSV = () => {
        const currentMonthObj = activeMonthObj;
        const plantObj = activePlantObj;
        if (!currentMonthObj) return;

        let rows = [[`IPA 生產排程與進耗存整合系統 ${SYSTEM_VERSION} (${plantObj.name} - ${currentMonthObj.label} - ${calcMode === 'SALES' ? `產銷排產首日(${latestSalesDayIndex+1}號起)模式` : '流速滿載模式'})`]];
        rows.push(["日期", ...displayDaysArr.map(i => `${currentMonthObj.month}/${i + 1}`)]);

        if (activePlantId === 'plant1' && calculatedData.poolSummary[activeMonthKey]) {
          rows.push([]);
          rows.push(["=== 🔗 彰濱一廠共用原料池 (合計) ==="]);
          const pSum = calculatedData.poolSummary[activeMonthKey];
          rows.push(["共用池總期初量", ...displayDaysArr.map(i => Math.round(pSum[i].start))]);
          rows.push(["製程耗用原料總量(-)", ...displayDaysArr.map(i => Math.round(pSum[i].use))]);
          rows.push(["共用池調撥(+)", ...displayDaysArr.map(i => pSum[i].trans)]);
          rows.push(["共用池進貨(+)", ...displayDaysArr.map(i => pSum[i].in)]);
          rows.push(["共用池當日剩餘結存", ...displayDaysArr.map(i => Math.round(pSum[i].end))]);
        }

        activePlantTanks.forEach(t => {
          rows.push([]);
          rows.push([`--- ${t.name} ---`]);
          const daysData = (calculatedData.result[activeMonthKey] && calculatedData.result[activeMonthKey][t.id]) || [];

          rows.push(["期初庫存", ...displayDaysArr.map(i => Math.round(daysData[i].start))]);
          if (t.type === 'SUPPLY') {
            rows.push(["鴻勝調撥(+)", ...displayDaysArr.map(i => daysData[i].trans || 0)]);
            rows.push(["進貨量(+)", ...displayDaysArr.map(i => daysData[i].in || 0)]);
            rows.push(["預估使用(-)", ...displayDaysArr.map(i => Math.round(daysData[i].use))]);
          } else {
            rows.push(["產線下腳料(+)", ...displayDaysArr.map(i => (Math.round((daysData[i].autoIn || 0) * 10) / 10))]);
            rows.push(["外部進項(+)", ...displayDaysArr.map(i => daysData[i].in || 0)]);
            rows.push(["預估清運(-)", ...displayDaysArr.map(i => daysData[i].use || 0)]);
            if (t.canRecycle) {
              rows.push(["產線/槽車回吃(-)", ...displayDaysArr.map(i => daysData[i].recycle || 0)]);
            }
          }
          rows.push(["結存剩餘", ...displayDaysArr.map(i => Math.round(daysData[i].end))]);
        });

        const csvContent = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a"); 
        link.setAttribute("href", url); 
        link.setAttribute("download", `IPA_${plantObj.name}_進耗存預估報表_${currentMonthObj.label.replace('/','-')}.csv`);
        document.body.appendChild(link); 
        link.click(); 
        document.body.removeChild(link);
      };

      if (!isDataLoaded) return (
        <div className="flex flex-col h-screen items-center justify-center font-bold text-slate-500 bg-slate-100">
          <span className="text-4xl mb-4 animate-bounce">🛢️</span>
          <p>IPA 整合系統連線初始化中...</p>
        </div>
      );

      return (
        <div className="min-h-screen bg-slate-100 p-4 text-[13px]">
          <div className="mx-auto max-w-[1600px] space-y-4">
            
            {/* 🌟 頂部深藍色控制面板 (Header，包含完整系統名稱與版別) */}
            <div className="bg-slate-800 text-white p-4 rounded-xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
              <h1 className="text-lg font-bold flex items-center">
                <span className="mr-2 text-xl">🛢️</span> 
                IPA 生產排程與進耗存整合系統 <span className="ml-2 text-xs bg-blue-600 px-2 py-0.5 rounded-full font-bold text-blue-100">{SYSTEM_VERSION}</span>
              </h1>
              
              <div className="flex flex-wrap items-center gap-3 bg-slate-700 p-2 rounded-lg border border-slate-600">
                <span className="text-xs font-bold text-slate-300 ml-1">歷史存檔區：</span>
                <select 
                  className="bg-slate-600 text-white text-xs p-1.5 rounded border border-slate-500 focus:outline-none focus:border-blue-400 max-w-[170px]"
                  value={selectedArchive}
                  onChange={(e) => setSelectedArchive(e.target.value)}
                >
                  <option value="">-- 選擇歷史紀錄 --</option>
                  {archiveList.map((a, idx) => (
                    <option key={a.id + '_' + idx} value={a.id}>{a.id} ({String(a.time).split(' ')[0]})</option>
                  ))}
                </select>
                <button onClick={handleRestoreArchive} className="bg-slate-500 hover:bg-slate-400 px-3 py-1.5 rounded text-xs font-bold transition-all shadow flex items-center text-white">
                  📂 讀取
                </button>
                <div className="h-6 w-px bg-slate-600 mx-1"></div>
                <button onClick={handleArchiveOnly} className="bg-indigo-500 hover:bg-indigo-400 px-3 py-1.5 rounded text-xs font-bold transition-all shadow flex items-center text-white">
                  💾 備份存檔
                </button>
              </div>

              <div className="flex items-center space-x-3">
                <button 
                  onClick={handleClearAll} 
                  className="bg-rose-600 hover:bg-rose-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow-md flex items-center space-x-1 border border-rose-400"
                  title="重置為預設設定"
                >
                  <span>🗑️</span>
                  <span>重置預設設定</span>
                </button>
                <button onClick={handleSave} className="bg-blue-600 hover:bg-blue-500 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow-md flex items-center text-white border border-blue-400">
                  ☁️ 強制儲存
                </button>
                <div className={`px-4 py-1.5 rounded-full text-xs font-bold shadow-inner ${saveStatus === 'success' ? 'bg-emerald-500 text-white' : saveStatus === 'saving' ? 'bg-amber-500 text-white animate-pulse' : saveStatus === 'error' ? 'bg-red-500 text-white' : 'bg-slate-900 text-slate-300'}`}>
                   {saveStatus === 'success' ? '● 雲端同步就緒' : saveStatus === 'saving' ? '○ 儲存中...' : saveStatus === 'error' ? '！寫入失敗' : '○ 多人連線中'}
                </div>
              </div>
            </div>

            {/* 第一層大分頁：廠區切換 與 ⚙️ 儲槽與產線自由設定頁 */}
            <div className="flex justify-between items-center border-b-2 border-slate-300 pb-1">
              <div className="flex space-x-3">
                {PLANTS.map(plant => (
                  <button
                    key={plant.id}
                    onClick={() => setActivePlantId(plant.id)}
                    className={`px-6 py-3 font-black text-sm rounded-t-xl transition-all flex items-center space-x-2 shadow-sm ${activePlantId === plant.id ? 'bg-blue-700 text-white shadow-md scale-105' : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-300'}`}
                  >
                    <span className="text-base">{plant.name}</span>
                    <span className="text-[10px] bg-slate-800 text-white px-2 py-0.5 rounded-full font-normal">
                      {tanksList.filter(t => (t.plantId || 'plant1') === plant.id).length} 儲槽 / {lines.filter(l => (l.plantId || 'plant1') === plant.id).length} 產線
                    </span>
                  </button>
                ))}
              </div>

              <button
                onClick={() => setActivePlantId('config')}
                className={`px-5 py-2.5 font-bold text-xs rounded-xl transition-all flex items-center space-x-2 shadow-sm ${activePlantId === 'config' ? 'bg-purple-700 text-white shadow-md' : 'bg-white text-purple-700 hover:bg-purple-50 border border-purple-300'}`}
              >
                <span>⚙️ 儲槽與產線自由設定頁</span>
              </button>
            </div>

            {/* ⚙️ 儲槽與產線維護視圖 (Config Tab View) */}
            {activePlantId === 'config' ? (
              <div className="space-y-4">
                
                {/* 1. 儲槽管理卡片 */}
                <div className="bg-white p-5 rounded-xl shadow border space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <div>
                      <h2 className="text-sm font-bold text-slate-800 flex items-center">
                        <span className="mr-2 text-lg">🛢️</span> 系統儲槽維護 (一廠: TK604A, TK604B, TK696, TK697, TK693, TK652; 二廠: TK617 LG, TK618 日本, TK611, TK613)
                      </h2>

                    </div>
                    <button onClick={() => setShowAddTankModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded text-xs font-bold shadow flex items-center">
                      ➕ 新增儲槽
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-center text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-slate-700 border-b">
                          <th className="p-2.5">儲槽 ID</th>
                          <th className="p-2.5">顯示名稱</th>

                        </tr>
                      </thead>
                      <tbody>
                        {tanksList.map(t => (
                          <tr key={t.id} className="border-b hover:bg-slate-50">

                            </td>
                            <td className="p-2.5 font-bold text-blue-700">
                              {t.plantId === 'plant1' ? '彰濱一廠' : '彰濱二廠'}
                            </td>
                            <td className="p-2.5">
                              {t.plantId === 'plant1' && t.type === 'SUPPLY' ? (
                                <label className="inline-flex items-center space-x-1 cursor-pointer bg-blue-50 px-2 py-1 rounded border border-blue-200">
                                  <input 
                                    type="checkbox"
