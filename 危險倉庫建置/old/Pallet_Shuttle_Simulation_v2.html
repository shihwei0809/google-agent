<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防爆棧板穿梭車動線與大容量儲位模擬 v2</title>
    <style>
        body { font-family: '微軟正黑體', Arial, sans-serif; background-color: #2c3e50; color: #ecf0f1; margin: 0; padding: 20px; }
        h2 { text-align: center; color: #f1c40f; margin-bottom: 5px; }
        h4 { text-align: center; color: #bdc3c7; margin-top: 0; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        button { padding: 10px 25px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #e67e22; color: white; border: none; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        button:hover { background-color: #d35400; transform: translateY(-2px); }
        .canvas-container { display: flex; justify-content: center; position: relative; }
        canvas { background-color: #34495e; border: 3px solid #7f8c8d; box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-radius: 8px; }
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 14px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .box { width: 18px; height: 18px; border-radius: 3px; }
        .dashboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #7f8c8d; }
        .dash-item { margin: 5px 0; font-size: 15px; }
        .highlight { color: #f1c40f; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <h2>1,000 m² 防爆穿梭車 (Pallet Shuttle) 倉儲動態模擬</h2>
    <h4>(全區總儲位預設: 2,200 板 | 貨架規劃: 5層高 x 15板深 | 本畫面為 1 樓平面俯視圖)</h4>
    
    <div class="controls">
        <button onclick="startSimulation()">開始連續入庫作業</button>
        <button onclick="resetSimulation()" style="background-color: #7f8c8d;">重置廠房</button>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas" width="1000" height="600"></canvas>
        <div class="dashboard">
            <div class="dash-item">總規劃儲位數: <span class="highlight">2,200</span> 板</div>
            <div class="dash-item">單層平面儲位: <span class="highlight">440</span> 板 (俯視區)</div>
            <div class="dash-item">目前樓層庫存: <span class="highlight" id="stockCount">0</span> 板</div>
            <hr style="border-color: #7f8c8d; margin: 10px 0;">
            <div class="dash-item">防爆穿梭車數量: 4 台</div>
            <div class="dash-item">防爆堆高機數量: 2 台</div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="box" style="background-color: #95a5a6;"></div> 空儲位</div>
        <div class="legend-item"><div class="box" style="background-color: #f1c40f;"></div> 化學品棧板</div>
        <div class="legend-item"><div class="box" style="background-color: #3498db;"></div> 防爆堆高機</div>
        <div class="legend-item"><div class="box" style="background-color: #e74c3c;"></div> 防爆穿梭車</div>
        <div class="legend-item"><div class="box" style="background-color: #27ae60;"></div> 安全防爆區劃牆</div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // 參數設定：為了讓長官看到「大儲量」，畫面繪製多個區塊
        const blocks = 2; // 兩大排貨架區
        const lanesPerBlock = 8; // 每區 8 巷道
        const totalLanes = blocks * lanesPerBlock;
        const slotsPerLane = 15; // 深度 15 板
        
        const slotW = 20;
        const slotH = 20;
        const laneSpacing = 30;
        const blockSpacing = 150; // 中間留通道給堆高機
        const startX = 250;
        const startY = 40;

        let animationId;
        let isSimulating = false;
        let stock = 0;

        // 狀態變數
        let grid = [];
        for (let i = 0; i < totalLanes; i++) {
            grid.push(new Array(slotsPerLane).fill(false));
        }

        // 兩台堆高機
        let forklifts = [
            { id: 0, x: 50, y: 150, hasPallet: false, state: 'idle', targetLane: -1, baseY: 150 },
            { id: 1, x: 50, y: 400, hasPallet: false, state: 'idle', targetLane: -1, baseY: 400 }
        ];

        // 4台穿梭車 (分配在不同巷道待命)
        let shuttles = [
            { id: 0, lane: 0, x: startX, y: startY, hasPallet: false, state: 'idle', targetSlot: -1 },
            { id: 1, lane: 1, x: startX, y: startY + laneSpacing, hasPallet: false, state: 'idle', targetSlot: -1 },
            { id: 2, lane: lanesPerBlock, x: startX, y: startY + blockSpacing + (lanesPerBlock * laneSpacing), hasPallet: false, state: 'idle', targetSlot: -1 },
            { id: 3, lane: lanesPerBlock + 1, x: startX, y: startY + blockSpacing + ((lanesPerBlock + 1) * laneSpacing), hasPallet: false, state: 'idle', targetSlot: -1 }
        ];

        function getLaneY(laneIndex) {
            let block = Math.floor(laneIndex / lanesPerBlock);
            let subLane = laneIndex % lanesPerBlock;
            return startY + (block * (lanesPerBlock * laneSpacing + blockSpacing)) + (subLane * laneSpacing);
        }

        function drawWarehouse() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 畫理貨區 (進貨暫存區)
            ctx.fillStyle = 'rgba(41, 128, 185, 0.2)';
            ctx.fillRect(20, 20, 120, canvas.height - 40);
            ctx.fillStyle = '#ecf0f1';
            ctx.font = '16px Arial';
            ctx.fillText("進出貨理貨區", 30, 45);
            ctx.fillText("(非防爆區)", 40, 65);

            // 防爆牆標示
            ctx.strokeStyle = '#27ae60';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(160, 0);
            ctx.lineTo(160, canvas.height);
            ctx.stroke();
            ctx.lineWidth = 1;
            ctx.fillStyle = '#27ae60';
            ctx.fillText("防爆防火區劃牆", 170, 25);

            // 畫棧板產生點 (虛擬貨車卸貨)
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(60, 100, 20, 20);
            ctx.fillRect(60, 350, 20, 20);
            
            // 畫貨架
            for (let i = 0; i < totalLanes; i++) {
                let y = getLaneY(i);
                
                // 畫巷道標籤
                ctx.fillStyle = '#bdc3c7';
                ctx.font = '12px Arial';
                if(i % 2 === 0) ctx.fillText("Lane " + (i+1), startX - 50, y + 15);

                for (let j = 0; j < slotsPerLane; j++) {
                    let x = startX + (j * slotW);
                    ctx.strokeStyle = '#7f8c8d';
                    ctx.strokeRect(x, y, slotW, slotH);
                    
                    if (grid[i][j]) {
                        ctx.fillStyle = '#f1c40f'; // 棧板
                        ctx.fillRect(x + 2, y + 2, slotW - 4, slotH - 4);
                    }
                }
            }

            // 畫堆高機
            forklifts.forEach(fl => {
                ctx.fillStyle = '#3498db';
                ctx.fillRect(fl.x, fl.y, 35, 25);
                if (fl.hasPallet) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(fl.x + 10, fl.y + 2, 20, 20);
                }
            });

            // 畫穿梭車
            shuttles.forEach(sh => {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(sh.x, sh.y, 20, 20);
                if (sh.hasPallet) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(sh.x + 2, sh.y + 2, 16, 16);
                }
            });
            
            document.getElementById('stockCount').innerText = stock;
        }

        function getNextEmptySlot(lane) {
            for (let j = slotsPerLane - 1; j >= 0; j--) {
                if (!grid[lane][j]) return j;
            }
            return -1;
        }

        function updateSimulation() {
            if (!isSimulating) return;

            // 堆高機邏輯
            forklifts.forEach((fl, flIndex) => {
                if (fl.state === 'idle') {
                    // 尋找閒置的穿梭車
                    let targetShuttle = shuttles.find(sh => sh.state === 'idle' && getNextEmptySlot(sh.lane) !== -1);
                    if (targetShuttle && Math.random() < 0.05) { // 加點延遲讓畫面更自然
                        targetShuttle.state = 'waiting_for_pallet';
                        fl.state = 'fetching';
                        fl.targetLane = targetShuttle.lane;
                    }
                } else if (fl.state === 'fetching') {
                    // 到理貨區拿貨
                    if (fl.x > 60) fl.x -= 3;
                    else if (fl.y > fl.baseY - 40) fl.y -= 3;
                    else if (fl.y < fl.baseY - 50) fl.y += 3;
                    else {
                        fl.hasPallet = true;
                        fl.state = 'delivering';
                    }
                } else if (fl.state === 'delivering') {
                    let targetY = getLaneY(fl.targetLane);
                    // 移動至巷道口
                    if (fl.y < targetY) fl.y += 4;
                    else if (fl.y > targetY) fl.y -= 4;
                    else if (fl.x < startX - 45) fl.x += 4;
                    else {
                        // 交接
                        let sh = shuttles.find(s => s.lane === fl.targetLane);
                        if (sh && sh.state === 'waiting_for_pallet') {
                            fl.hasPallet = false;
                            fl.state = 'returning';
                            sh.hasPallet = true;
                            sh.state = 'moving_in';
                            sh.targetSlot = getNextEmptySlot(sh.lane);
                        }
                    }
                } else if (fl.state === 'returning') {
                    if (fl.x > 60) fl.x -= 4;
                    else {
                        fl.state = 'idle';
                    }
                }
            });

            // 穿梭車邏輯
            shuttles.forEach((sh) => {
                if (sh.state === 'moving_in') {
                    let targetX = startX + (sh.targetSlot * slotW);
                    if (sh.x < targetX) {
                        sh.x += 5; // 穿梭車速度快
                    } else {
                        sh.hasPallet = false;
                        grid[sh.lane][sh.targetSlot] = true;
                        stock++;
                        sh.state = 'moving_out';
                        
                        // 隨機切換到另一個有空位的巷道 (模擬被堆高機調度)
                        if(getNextEmptySlot(sh.lane) === -1) {
                           // 本巷滿了，找新的空巷道
                           for(let i=0; i<totalLanes; i++) {
                               if(!shuttles.find(s => s.lane === i) && getNextEmptySlot(i) !== -1) {
                                   sh.lane = i;
                                   break;
                               }
                           }
                        }
                    }
                } else if (sh.state === 'moving_out') {
                    if (sh.x > startX) {
                        sh.x -= 5;
                    } else {
                        sh.x = startX;
                        sh.y = getLaneY(sh.lane); // 如果有換巷道，瞬間移過去 (模擬堆高機搬運穿梭車)
                        sh.state = 'idle';
                    }
                }
            });

            drawWarehouse();
            animationId = requestAnimationFrame(updateSimulation);
        }

        function startSimulation() {
            if (!isSimulating) {
                isSimulating = true;
                updateSimulation();
            }
        }

        function resetSimulation() {
            isSimulating = false;
            cancelAnimationFrame(animationId);
            
            for (let i = 0; i < totalLanes; i++) {
                grid[i].fill(false);
            }
            stock = 0;
            
            forklifts = [
                { id: 0, x: 50, y: 150, hasPallet: false, state: 'idle', targetLane: -1, baseY: 150 },
                { id: 1, x: 50, y: 400, hasPallet: false, state: 'idle', targetLane: -1, baseY: 400 }
            ];

            shuttles = [
                { id: 0, lane: 0, x: startX, y: getLaneY(0), hasPallet: false, state: 'idle', targetSlot: -1 },
                { id: 1, lane: 1, x: startX, y: getLaneY(1), hasPallet: false, state: 'idle', targetSlot: -1 },
                { id: 2, lane: lanesPerBlock, x: startX, y: getLaneY(lanesPerBlock), hasPallet: false, state: 'idle', targetSlot: -1 },
                { id: 3, lane: lanesPerBlock + 1, x: startX, y: getLaneY(lanesPerBlock + 1), hasPallet: false, state: 'idle', targetSlot: -1 }
            ];
            
            drawWarehouse();
        }

        // 初始化
        shuttles.forEach(sh => sh.y = getLaneY(sh.lane));
        drawWarehouse();
    </script>
</body>
</html>
