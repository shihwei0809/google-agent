<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 3 課堂即時同步測驗 - 學員端</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 25, 40, 0.75);
      --border-color: rgba(255, 255, 255, 0.06);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      
      --neon-cyan: #06b6d4;
      --neon-green: #10b981;
      --neon-purple: #8b5cf6;
      --neon-pink: #ec4899;
      --neon-orange: #f97316;
      --neon-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 60%);
      background-attachment: fixed;
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      z-index: 10;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .home-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .home-btn:hover {
      color: var(--neon-cyan);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--neon-green);
      border: 1px solid rgba(16, 185, 129, 0.25);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--neon-green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slogan {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .input-field {
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      width: 100%;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--neon-purple);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
    }

    .action-btn {
      width: 100%;
      padding: 1rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    /* Option item */
    .option-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
      transition: all 0.3s ease;
    }

    .option-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateX(4px);
    }

    .option-item.selected {
      background: rgba(139, 92, 246, 0.08);
      border-color: var(--neon-purple);
    }

    .option-radio {
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-sub);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .option-item.selected .option-radio {
      border-color: var(--neon-purple);
      background: var(--neon-purple);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }

    /* Feedback message */
    .feedback-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      display: none;
    }

    .feedback-box.correct {
      background: rgba(16, 185, 129, 0.12);
      color: var(--neon-green);
    }

    .feedback-box.incorrect {
      background: rgba(239, 68, 68, 0.12);
      color: var(--neon-red);
    }

    /* Sync mode panels */
    #register-panel {
      display: block;
    }

    #classroom-panel {
      display: none;
    }

    #sync-wait-panel {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
    }

    /* Waiting animation */
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--neon-purple);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header" style="gap: 0.5rem; flex-wrap: wrap;">
      <div style="font-weight: 800; font-size: 1.1rem; color: white; display: flex; align-items: center; gap: 0.4rem;">
        <span style="font-size: 1.3rem;">🚀</span> TrainBuddy <span style="font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; background: rgba(139, 92, 246, 0.15); color: var(--neon-purple);">學員端</span>
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button id="audio-listen-btn" style="padding: 0.25rem 0.65rem; font-size: 0.75rem; border-radius: 50px; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.3); color: var(--neon-purple); cursor: pointer; font-weight: 700; display: none;" onclick="startListening()">🔊 收聽講師語音</button>
        <span class="status-badge" id="status-tag"><span class="status-dot"></span> 連線中</span>
      </div>
      <audio id="webrtc-audio" autoplay style="display: none;"></audio>
    </div>

    <!-- PANEL 1: Register nickname -->
    <div class="card" id="register-panel">
      <h1>加入課堂即時同步測驗</h1>
      <p class="slogan">請輸入您的姓名或學號，以進行即時答題同步</p>
      
      <div class="input-group">
        <label for="nickname-input">學員姓名 / 暱稱</label>
        <input type="text" id="nickname-input" class="input-field" placeholder="例如：李小明 或 70102">
      </div>
      <button class="action-btn" onclick="registerName()">進入互動室</button>
    </div>

    <!-- PANEL 2: Classroom Active Quiz -->
    <div class="card" id="classroom-panel">
      <h1 id="quiz-question-title">載入問題中...</h1>
      <p class="slogan" id="quiz-slogan-page">請選擇您的答案：</p>
      
      <div id="quiz-options-container">
        <!-- Rendered dynamically -->
      </div>
      
      <button class="action-btn" id="submit-btn" onclick="submitAnswer()">送出答案</button>
      
      <div class="feedback-box" id="quiz-feedback"></div>
    </div>

    <!-- PANEL 3: Waiting for tutor slide state -->
    <div class="card" id="sync-wait-panel">
      <div class="loader"></div>
      <h2 style="font-size: 1.3rem; margin-bottom: 0.5rem;">講師正在講授投影片...</h2>
      <p style="color: var(--text-sub); font-size: 0.9rem;">請看大螢幕，當講師翻到下一題測驗時，本畫面會自動更新！</p>
    </div>

    <!-- PANEL 4: Slide Content View for Students -->
    <div class="card" id="slide-content-panel" style="display: none;">
      <span class="status-badge" style="background: rgba(6, 182, 212, 0.1); color: var(--neon-cyan); border-color: rgba(6, 182, 212, 0.25); display: inline-flex; margin-bottom: 1rem;">📖 講師授課中</span>
      <h1 id="student-slide-headline" style="font-size: 1.5rem; line-height: 1.4; margin-bottom: 1rem; color: white;">投影片大標題</h1>
      <p id="student-slide-desc" style="color: var(--text-sub); line-height: 1.7; font-size: 0.95rem; white-space: pre-line;">詳細說明內容...</p>
    </div>
  </div>

  <script>
    let slidesData = [];
    let activeDeckId = '';
    let nickname = '';
    let currentSlideIndex = 1;
    let selectedAnswer = null;
    let submittedSlideIndex = null; // Prevent resubmission on the same slide page

    window.addEventListener('load', () => {
      // Load saved nickname if exists
      const savedName = localStorage.getItem('class_nickname');
      if (savedName) {
        document.getElementById('nickname-input').value = savedName;
      }
      
      // Keep syncing classroom state in background (every 500ms)
      setInterval(syncClassroom, 500);
    });

    function registerName() {
      const input = document.getElementById('nickname-input').value.trim();
      if (!input) {
        alert("請輸入姓名！");
        return;
      }
      nickname = input;
      localStorage.setItem('class_nickname', nickname);
      
      document.getElementById('register-panel').style.display = 'none';
      const audioBtn = document.getElementById('audio-listen-btn');
      if (audioBtn) audioBtn.style.display = 'inline-flex';
      syncClassroom();
    }

    async function syncClassroom() {
      if (!nickname) return; // Wait for registration

      try {
        const response = await fetch(`/api/class-state?nickname=${encodeURIComponent(nickname)}`);
        if (!response.ok) return;
        const data = await response.json();

        // Check if deck has changed
        if (data.activeDeckId !== activeDeckId) {
          activeDeckId = data.activeDeckId;
          slidesData = data.slides || [];
          selectedAnswer = null;
          submittedSlideIndex = null;
          document.getElementById('quiz-feedback').style.display = 'none';
          document.getElementById('submit-btn').disabled = false;
          document.getElementById('submit-btn').style.opacity = '1';
          
          const optionsContainer = document.getElementById('quiz-options-container');
          if (optionsContainer) {
            optionsContainer.innerHTML = '';
            delete optionsContainer.dataset.index;
          }
        }

        // Check if tutor reset the quiz or switched slides
        if (data.currentSlide !== currentSlideIndex) {
          currentSlideIndex = data.currentSlide;
          selectedAnswer = null;
          document.getElementById('quiz-feedback').style.display = 'none';
          document.getElementById('submit-btn').disabled = false;
          document.getElementById('submit-btn').style.opacity = '1';
        }

        // Check if tutor cleared answers for this slide
        if (data.voters.length === 0) {
          submittedSlideIndex = null;
          selectedAnswer = null;
          document.getElementById('quiz-feedback').style.display = 'none';
          document.getElementById('submit-btn').disabled = false;
          document.getElementById('submit-btn').style.opacity = '1';
        }

        if (slidesData.length === 0) return;
        const currentSlide = slidesData[currentSlideIndex - 1];
        if (!currentSlide) return;

        if (currentSlide.type === 'slide') {
          // Tutor is displaying presentation: Show slide content on student device
          document.getElementById('classroom-panel').style.display = 'none';
          document.getElementById('sync-wait-panel').style.display = 'none';
          
          const slidePanel = document.getElementById('slide-content-panel');
          if (slidePanel) {
            slidePanel.style.display = 'block';
            document.getElementById('student-slide-headline').textContent = currentSlide.headline || '';
            document.getElementById('student-slide-desc').textContent = currentSlide.desc || '';
          }
        } else {
          // Tutor triggered quiz: Display active options
          const slidePanel = document.getElementById('slide-content-panel');
          if (slidePanel) slidePanel.style.display = 'none';
          
          document.getElementById('sync-wait-panel').style.display = 'none';
          document.getElementById('classroom-panel').style.display = 'block';

          renderQuizUI(currentSlide);
        }

        document.getElementById('status-tag').innerHTML = '<span class="status-dot"></span> 同步中';
      } catch (e) {
        document.getElementById('status-tag').innerHTML = '<span class="status-dot" style="background:var(--neon-red);"></span> 伺服器離線';
      }
    }

    function renderQuizUI(slide) {
      document.getElementById('quiz-question-title').textContent = slide.headline;
      document.getElementById('quiz-slogan-page').textContent = `第 ${slide.index} 頁 隨堂測驗：`;

      const optionsContainer = document.getElementById('quiz-options-container');
      if (!optionsContainer) return;
      
      // If student already submitted this page, disable changing options
      const alreadySubmitted = submittedSlideIndex === currentSlideIndex;

      if (optionsContainer.children.length === 0 || optionsContainer.dataset.index !== String(currentSlideIndex)) {
        optionsContainer.innerHTML = '';
        optionsContainer.dataset.index = currentSlideIndex;

        Object.entries(slide.options).forEach(([letter, text]) => {
          const opt = document.createElement('div');
          opt.className = 'option-item';
          opt.id = `item-${letter}`;
          opt.onclick = () => selectOption(letter);

          opt.innerHTML = `
            <span class="option-radio"></span>
            <span>${letter}. ${text}</span>
          `;
          optionsContainer.appendChild(opt);
        });
      }
    }

    function selectOption(letter) {
      if (submittedSlideIndex === currentSlideIndex) return; // Cannot change answer after submission

      selectedAnswer = letter;
      const items = document.querySelectorAll('.option-item');
      items.forEach(item => item.classList.remove('selected'));

      const element = document.getElementById(`item-${letter}`);
      if (element) element.classList.add('selected');
    }

    async function submitAnswer() {
      if (!selectedAnswer) {
        alert("請選擇一個選項！");
        return;
      }
      if (submittedSlideIndex === currentSlideIndex) return;

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.5';

      try {
        const response = await fetch('/api/submit-answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nickname: nickname,
            answer: selectedAnswer
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          alert(data.error || '提交答案失敗');
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          return;
        }

        // Lock submission state for this page
        submittedSlideIndex = currentSlideIndex;

        // Show feedback immediately
        const currentSlide = slidesData[currentSlideIndex - 1];
        const feedback = document.getElementById('quiz-feedback');
        feedback.style.display = 'block';

        if (selectedAnswer === currentSlide.correctAnswer) {
          feedback.className = 'feedback-box correct';
          feedback.innerHTML = `🎉 答對了！${currentSlide.explanation}`;
        } else {
          feedback.className = 'feedback-box incorrect';
          feedback.innerHTML = `❌ 答錯了！正確答案是 ${currentSlide.correctAnswer}。${currentSlide.explanation}`;
        }

      } catch (e) {
        alert('無法連線到伺服器');
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    }

    let studentPeerConnection = null;
    async function startListening() {
      const btn = document.getElementById('audio-listen-btn');
      btn.disabled = true;
      btn.textContent = '⚡ 連線語音中...';

      try {
        if (studentPeerConnection) {
          studentPeerConnection.close();
        }
        
        studentPeerConnection = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        let audioEl = document.getElementById('webrtc-audio');
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = 'webrtc-audio';
          audioEl.autoplay = true;
          document.body.appendChild(audioEl);
        }

        studentPeerConnection.ontrack = (event) => {
          audioEl.srcObject = event.streams[0];
          audioEl.play().catch(e => {
            console.warn('Autoplay prevented, click listen button again', e);
          });
        };

        studentPeerConnection.addTransceiver('audio', { direction: 'recvonly' });

        const offer = await studentPeerConnection.createOffer();
        await studentPeerConnection.setLocalDescription(offer);

        await new Promise((resolve) => {
          if (studentPeerConnection.iceGatheringState === 'complete') {
            resolve();
          } else {
            function checkState() {
              if (studentPeerConnection.iceGatheringState === 'complete') {
                studentPeerConnection.removeEventListener('icegatheringstatechange', checkState);
                resolve();
              }
            }
            studentPeerConnection.addEventListener('icegatheringstatechange', checkState);
          }
        });

        const offerRes = await fetch('/api/webrtc/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nickname: nickname,
            offer: studentPeerConnection.localDescription
          })
        });

        if (!offerRes.ok) throw new Error('無法提交 WebRTC Offer');

        let answerFound = false;
        for (let i = 0; i < 20; i++) {
          await new Promise(r => setTimeout(r, 500));
          const ansRes = await fetch(`/api/webrtc/answer?nickname=${encodeURIComponent(nickname)}`);
          if (ansRes.ok) {
            const ansData = await ansRes.json();
            if (ansData.answer) {
              await studentPeerConnection.setRemoteDescription(new RTCSessionDescription(ansData.answer));
              answerFound = true;
              break;
            }
          }
        }

        if (answerFound) {
          btn.textContent = '🟢 語音已連線';
          btn.style.background = 'rgba(16, 185, 129, 0.15)';
          btn.style.borderColor = 'rgba(16, 185, 129, 0.3)';
          btn.style.color = 'var(--neon-green)';
        } else {
          throw new Error('講師端未開啟語音或廣播逾時，請確認老師已開啟麥克風！');
        }

      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = '🔊 收聽講師語音';
        btn.style.background = 'rgba(139, 92, 246, 0.15)';
        btn.style.borderColor = 'rgba(139, 92, 246, 0.3)';
        btn.style.color = 'var(--neon-purple)';
      }
    }
  </script>
</body>
</html>
