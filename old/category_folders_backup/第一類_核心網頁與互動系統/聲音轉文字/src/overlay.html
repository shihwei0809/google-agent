<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .overlay {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 270px;
      height: 40px;
      padding: 4px 12px;
      background: rgba(18, 18, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 9px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #aaaaaa;
    }
    .check-btn {
      background: #ffffff;
      color: #000000;
      font-weight: bold;
    }
    .center-content {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      height: 100%;
    }
    #waveform {
      display: block;
    }
    .spinner {
      display: none;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    .status-text {
      display: none;
      color: #e2e2e2;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="overlay" id="container">
    <!-- 左側取消按鈕 -->
    <div class="icon-btn close-btn" id="left-btn">✕</div>
    
    <!-- 中間內容：波形圖或狀態載入 -->
    <div class="center-content">
      <div class="spinner" id="spinner"></div>
      <canvas id="waveform" width="130" height="30"></canvas>
      <span class="status-text" id="status-text">錄音中...</span>
    </div>
    
    <!-- 右側確認按鈕 -->
    <div class="icon-btn check-btn" id="right-btn">✓</div>
  </div>

  <script>
    const container = document.getElementById('container');
    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    const waveform = document.getElementById('waveform');
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('status-text');

    const canvas = document.getElementById('waveform');
    const ctx = canvas.getContext('2d');
    let volume = 0;
    let currentVolume = 0;

    // 監聽並接收音量
    window.electronOverlay?.onVolumeUpdate((val) => {
      volume = val;
    });

    // 監聽並接收狀態
    window.electronOverlay?.onStatusUpdate((status) => {
      // 重設預設外觀
      container.style.border = '1px solid rgba(255, 255, 255, 0.08)';
      leftBtn.style.display = 'none';
      rightBtn.style.display = 'none';
      waveform.style.display = 'none';
      spinner.style.display = 'none';
      statusText.style.display = 'none';

      switch (status) {
        case 'recording':
          leftBtn.style.display = 'flex';
          rightBtn.style.display = 'flex';
          waveform.style.display = 'block';
          break;
        case 'processing':
          spinner.style.display = 'block';
          spinner.style.borderTopColor = '#4a9eff';
          statusText.style.display = 'block';
          statusText.textContent = '辨識中...';
          break;
        case 'polishing':
          spinner.style.display = 'block';
          spinner.style.borderTopColor = '#bf5af2';
          statusText.style.display = 'block';
          statusText.textContent = '潤飾中...';
          break;
        case 'done':
          statusText.style.display = 'block';
          statusText.innerHTML = '<span style="color: #30d158; font-weight: bold; margin-right: 4px;">✓</span> 完成';
          container.style.border = '1px solid rgba(48, 209, 88, 0.35)';
          break;
        case 'error':
          statusText.style.display = 'block';
          statusText.innerHTML = '<span style="color: #ff453a; font-weight: bold; margin-right: 4px;">⚠</span> 錯誤';
          container.style.border = '1px solid rgba(255, 69, 58, 0.35)';
          break;
      }
    });

    // 繪製動態波形
    function draw() {
      // 緩降平滑處理
      currentVolume += (volume - currentVolume) * 0.22;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      
      const barCount = 17;
      const barWidth = 3;
      const barGap = 3;
      const startX = (canvas.width - (barCount * (barWidth + barGap) - barGap)) / 2;
      
      for (let i = 0; i < barCount; i++) {
        // 對稱振幅計算 (中間高、兩側低)
        const distanceFromCenter = Math.abs(i - (barCount - 1) / 2);
        const centerFactor = Math.max(0.12, 1 - (distanceFromCenter / (barCount / 1.8)));
        
        // 微弱呼吸效果動畫（在靜音時仍有生命力感）
        const breath = Math.sin(Date.now() * 0.008 + i * 0.45) * 0.12;
        const amplitude = (currentVolume * 45 * centerFactor) + (breath * 6) + 2.5;
        
        const h = Math.max(3, Math.min(canvas.height - 6, amplitude));
        const x = startX + i * (barWidth + barGap);
        const y = (canvas.height - h) / 2;
        
        // 圓角矩形柱狀體
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x, y, barWidth, h, 1.5);
        } else {
          ctx.rect(x, y, barWidth, h);
        }
        ctx.fill();
      }
      
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
