name = "coa-check-pwa"
pages_build_output_dir = "public"
compatibility_date = "2024-03-20"

# Cloudflare D1 資料庫綁定 (共用工廠核心進出料資料庫 egups-db，節省資料庫名額)
[[d1_databases]]
binding = "DB"
database_name = "egups-db"
database_id = "b87a145c-937d-430b-94f0-1962255abd04"

# Cloudflare R2 物件儲存桶綁定 (存放 COA 與地磅照片)
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "coa-check-photos"

