<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環境溫度通報系統 (Cloudflare 版)</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: #333; margin-top: 0; }
        .temp-display { font-size: 48px; font-weight: bold; color: #2E7D32; text-align: center; margin: 20px 0; }
        .temp-display.danger { color: #d32f2f; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f9f9f9; }
        #install-banner { display: none; background: #2196F3; color: white; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div id="install-banner">📲 點擊安裝「溫度監控」桌面/手機 App</div>
        
        <div class="card">
            <h1>即時環境溫度</h1>
            <div id="current-temp" class="temp-display">-- °C</div>
            <p style="text-align: center; color: #666;" id="last-update">最後觀測時間: --</p>
        </div>

        <div class="card">
            <h2>24 小時溫度趨勢</h2>
            <canvas id="tempChart" width="400" height="200"></canvas>
        </div>

        <div class="card">
            <h2>最近紀錄 (前 10 筆)</h2>
            <table>
                <thead>
                    <tr>
                        <th>紀錄時間</th>
                        <th>溫度 (°C)</th>
                        <th>氣象觀測時間</th>
                        <th>系統狀態</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <tr><td colspan="4" style="text-align: center;">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // PWA 安裝邏輯
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'block';
        });

        document.getElementById('install-banner').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-banner').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // 資料獲取與圖表繪製
        let chart = null;

        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                if (data.logs && data.logs.length > 0) {
                    const latest = data.logs[0];
                    const tempEl = document.getElementById('current-temp');
                    tempEl.textContent = `${latest.temperature} °C`;
                    
                    const threshold = parseFloat(data.config.threshold || 29.0);
                    if (latest.temperature >= threshold) {
                        tempEl.classList.add('danger');
                    } else {
                        tempEl.classList.remove('danger');
                    }
                    
                    document.getElementById('last-update').textContent = `最後觀測時間: ${latest.obs_time}`;

                    // 更新表格
                    const tbody = document.getElementById('log-table-body');
                    tbody.innerHTML = '';
                    data.logs.slice(0, 10).forEach(log => {
                        const tr = document.createElement('tr');
                        
                        // 將 UTC 轉換為本地時間格式顯示
                        const date = new Date(log.timestamp + "Z");
                        const dateString = isNaN(date.getTime()) ? log.timestamp : date.toLocaleString('zh-TW', { hour12: false });
                        
                        tr.innerHTML = `
                            <td>${dateString}</td>
                            <td>${log.temperature}</td>
                            <td>${log.obs_time}</td>
                            <td>${log.status}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    // 繪製圖表 (時間反轉，舊的在左)
                    const chartData = data.logs.slice(0, 72).reverse();
                    const ctx = document.getElementById('tempChart').getContext('2d');
                    
                    if (chart) chart.destroy();
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: chartData.map(l => {
                                const d = new Date(l.timestamp + "Z");
                                return isNaN(d.getTime()) ? l.timestamp.split(' ')[1] : d.toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit', hour12: false});
                            }),
                            datasets: [{
                                label: '環境溫度 (°C)',
                                data: chartData.map(l => l.temperature),
                                borderColor: '#2196F3',
                                tension: 0.1,
                                fill: false
                            }, {
                                label: '高溫警戒線',
                                data: chartData.map(() => threshold),
                                borderColor: '#d32f2f',
                                borderDash: [5, 5],
                                borderWidth: 1,
                                pointRadius: 0,
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    suggestedMin: Math.min(...chartData.map(l => l.temperature)) - 2,
                                    suggestedMax: Math.max(...chartData.map(l => l.temperature), threshold) + 2
                                }
                            }
                        }
                    });
                }
            } catch (err) {
                console.error("資料獲取失敗", err);
            }
        }

        fetchData();
        setInterval(fetchData, 60000); // 每分鐘更新一次 UI
    </script>
</body>
</html>
