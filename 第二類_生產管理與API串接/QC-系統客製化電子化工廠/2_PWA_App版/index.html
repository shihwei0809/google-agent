<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>鴻勝化學 QC 檢驗即時看板系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <!-- 引入 SheetJS 用於客戶端即時解析 T100 排程 Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --radius: 10px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--ink); }
    .container { max-width: 1600px; margin: 0 auto; }
    
    /* PWA 安裝條 */
    #pwa-install-banner {
      display: none;
      background: linear-gradient(90deg, #1e40af, #3b82f6);
      color: white;
      padding: 10px 18px;
      border-radius: var(--radius);
      margin-bottom: 15px;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    #pwa-install-banner button {
      background: #ffffff;
      color: #1e40af;
      border: none;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .card { background: var(--card-bg); padding: 22px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border); }
    .card-title { margin: 0 0 16px; border-left: 5px solid var(--blue); padding-left: 12px; font-size: 1.25rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    
    /* T100 槽車快速排程選擇區塊 */
    .t100-banner {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .t100-badge {
      background: #16a34a;
      color: white;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .t100-select-wrapper {
      flex: 1;
      min-width: 280px;
    }
    .t100-select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #16a34a;
      border-radius: 6px;
      font-weight: 600;
      color: #14532d;
      background: white;
      font-size: 0.95rem;
    }
    .btn-t100-upload {
      background: #0284c7;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-t100-upload:hover { background: #0369a1; }
    
    .form-grid { 
      display: grid; 
      grid-template-columns: 2.5fr 0.9fr 0.9fr 1.3fr 1.1fr 1.3fr 1.1fr 1.1fr 1.1fr; 
      gap: 12px; 
      align-items: end; 
    }
    @media (max-width: 1350px) { .form-grid { grid-template-columns: repeat(4, 1fr); align-items: start; } }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
    
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #334155; white-space: nowrap; }
    .label-hint { font-size: 0.75rem; color: #64748b; font-weight: normal; margin-left: 2px;}
    .required::after { content: " *"; color: var(--red); }
    
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; background: #ffffff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    input::placeholder { color: #94a3b8; font-size: 0.85rem; }
    
    .btn-submit { background: #1e293b; color: white; padding: 13px; border: none; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 18px; font-size: 1.05rem; transition: background 0.2s; }
    .btn-submit:hover { background: #0f172a; }
    
    .filter-bar { background: #f1f5f9; padding: 14px 18px; border-radius: var(--radius); display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 20px; border: 1px solid var(--border); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .kpi-card { background: white; padding: 18px 22px; border-radius: var(--radius); box-shadow: var(--shadow); border-left: 6px solid; border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .kpi-value { font-size: 2.3rem; font-weight: 800; color: var(--ink); line-height: 1; }
    .kpi-label { font-size: 0.9rem; color: var(--muted); margin-top: 6px; font-weight: bold; }
    
    .kanban-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 1200px) { .kanban-container { grid-template-columns: 1fr; } }
    .kanban-column { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-height: 480px; border: 1px solid var(--border); display: flex; flex-direction: column; }
    .kanban-header { padding: 14px 18px; font-weight: bold; font-size: 1.1rem; border-bottom: 2px solid; display: flex; justify-content: space-between; align-items: center; }
    .header-pending { border-color: var(--amber); color: #b45309; background: #fffbeb; }
    .header-completed { border-color: var(--green); color: #047857; background: #ecfdf5; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #f8fafc; color: var(--ink); padding: 12px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
    td { padding: 11px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:hover td { background: #f8fafc; }
    
    .tag-flow { padding: 3px 7px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; white-space: nowrap; }
    .tag-in { background: #dbeafe; color: #1e3a8a; } 
    .tag-out { background: #fef08a; color: #854d0e; } 
    .tag-replenish { background: #d1fae5; color: #065f46; } 
    .tag-commission { background: #f3e8ff; color: #6b21a8; } 
    
    .btn-action { color: white; border: none; padding: 6px 11px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
    .btn-print { background: #3b82f6; margin-right: 4px; } 
    .btn-judge { background: #10b981; } 
    
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center; }
    .modal-content { background:white; padding:25px; border-radius:12px; width:360px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }

    .mode-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; background: #e0e7ff; color: #3730a3; font-weight: bold; }
    .toast { position: fixed; bottom: 25px; right: 25px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); z-index: 2000; display: none; font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="container">

  <!-- PWA 安裝提示橫幅 -->
  <div id="pwa-install-banner">
    <div><b>📱 安裝為獨立 App</b>：將本系統安裝至手機主畫面或電腦桌面，操作體驗更流暢！</div>
    <button id="pwa-install-btn" onclick="installPWA()">立即安裝</button>
  </div>

  <div class="card">
    <div class="card-title">
      <span>進出貨樣品登錄</span>
      <span id="envBadge" class="mode-badge">⚡ 系統運作中</span>
    </div>

    <!-- T100 槽車排程快速選擇列 (支援出貨與進料雙區塊) -->
    <div class="t100-banner">
      <span class="t100-badge">🚛 T100 槽車排程</span>
      <div class="t100-select-wrapper">
        <select id="t100Select" class="t100-select" onchange="onT100SelectChange(this.value)">
          <option value="">-- 點此直接選擇 T100 槽車排程 (包含出貨與進料) --</option>
        </select>
      </div>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display:none;" onchange="handleExcelUpload(event)">
      <button type="button" class="btn-t100-upload" onclick="document.getElementById('excelFileInput').click()">
        📂 匯入最新 T100 排程 Excel
      </button>
      <button type="button" onclick="resetForm()" style="padding:9px 12px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer; font-size:0.85rem; font-weight:bold;">
        清空重選
      </button>
    </div>

    <form id="qcForm">
      <div class="form-grid">
        <div>
          <label>出通/入庫單號<span class="label-hint">(選填，提前充填庫存留空自動帶入)</span></label>
          <input type="text" id="barcode" placeholder="選填，留空自動設為日期-庫存">
        </div>
        <div>
          <label>動向</label>
          <select id="flowType">
            <option value="出貨">出貨</option>
            <option value="進料">進料</option>
            <option value="補料">補料</option>
            <option value="委託">委託</option>
          </select>
        </div>
        <div>
          <label>等級</label>
          <select id="grade">
            <option value="工業級">工業級</option>
            <option value="UPS">UPS</option>
            <option value="IF">IF</option>
          </select>
        </div>
        <div>
          <label class="required">品名</label>
          <input type="text" id="productName" list="productList" placeholder="點選或輸入" required>
          <datalist id="productList">
            <option value="IPA"></option><option value="IPAUPS"></option><option value="IPAHQ"></option>
            <option value="CPNE3(T)"></option><option value="CPNE4"></option><option value="CPN-P1R"></option>
            <option value="EBR"></option><option value="EBR-P1R"></option><option value="NBAC"></option>
            <option value="NBAC-P1R"></option><option value="CPN"></option><option value="EG"></option>
            <option value="NMP"></option><option value="GAA"></option><option value="ACT"></option>
            <option value="PM"></option><option value="PMA98"></option><option value="heavy-R"></option>
            <option value="DPM"></option><option value="DPM-B1"></option><option value="SEP73"></option>
            <option value="Anone"></option><option value="GBL"></option><option value="PG"></option><option value="EBRR"></option>
          </datalist>
        </div>
        <div>
          <label class="required">進出貨槽號</label>
          <input type="text" id="tankNo" placeholder="例: TK605 或 TKC05" required>
        </div>
        <div>
          <label class="required">車牌/櫃號</label>
          <input type="text" id="customer" placeholder="例: PPCU7019228 或 KEQ-3506" required>
        </div>
        <div>
          <label>數量</label>
          <input type="text" id="quantity" placeholder="例: 5000 KG">
        </div>
        <div>
          <label>送樣單位</label>
          <select id="dept">
            <option value="資材課">資材課</option>
            <option value="現場一課">現場一課</option>
            <option value="現場二課">現場二課</option>
            <option value="回收處理課">回收處理課</option>
          </select>
        </div>
        <div>
          <label class="required">送樣人員</label>
          <input type="text" id="requester" placeholder="請輸入姓名" required>
        </div>
      </div>
      <button type="button" id="submitBtn" class="btn-submit" onclick="submitForm()">確認提交送樣 🚀</button>
    </form>
  </div>

  <div class="filter-bar">
    <div style="flex:1; min-width: 220px;">
      <label>即時搜尋 (單號 / 品名 / 車牌 / 槽號)</label>
      <input type="text" id="kwInput" oninput="render()" placeholder="輸入內容即時過濾...">
    </div>
    <div><label>日期(起)</label><input type="date" id="dateStart" onchange="render()"></div>
    <div><label>日期(迄)</label><input type="date" id="dateEnd" onchange="render()"></div>
    <button onclick="resetFilters()" style="padding:10px 16px; cursor:pointer; height:40px; background:#ffffff; border:1px solid #cbd5e1; border-radius:6px; font-weight:bold;">全部顯示 (清除)</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card" style="border-left-color: var(--amber);"><div class="kpi-value" id="kpi-pending">0</div><div class="kpi-label">待驗中</div></div>
    <div class="kpi-card" style="border-left-color: var(--green);"><div class="kpi-value" id="kpi-completed">0</div><div class="kpi-label">已檢驗完成</div></div>
    <div class="kpi-card" style="border-left-color: var(--blue);"><div class="kpi-value" id="kpi-today">0</div><div class="kpi-label">今日送樣總數</div></div>
  </div>

  <div class="kanban-container">
    <div class="kanban-column">
      <div class="kanban-header header-pending">
        <span>⏳ 待檢驗樣品</span>
        <span id="pendingCountBadge" style="font-size:0.85rem; font-weight:normal; background:white; padding:2px 8px; border-radius:12px; border:1px solid #fcd34d;">0 件</span>
      </div>
      <div style="overflow-x:auto;">
        <table id="table-pending">
          <thead>
            <tr><th>單號</th><th>動向</th><th>等級</th><th>品名</th><th>槽號</th><th>車牌/櫃號</th><th>送樣單位</th><th>送樣時間</th><th style="text-align:center;">操作</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    
    <div class="kanban-column">
      <div class="kanban-header header-completed">
        <span>✅ 已檢驗完成</span>
        <span id="completedCountBadge" style="font-size:0.85rem; font-weight:normal; background:white; padding:2px 8px; border-radius:12px; border:1px solid #a7f3d0;">0 件</span>
      </div>
      <div style="overflow-x:auto;">
        <table id="table-completed">
          <thead>
            <tr><th>單號</th><th>動向</th><th>等級</th><th>品名</th><th>槽號</th><th>車牌/櫃號</th><th>判定結果</th><th>完成時間</th><th>判定備註</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 判定對話框 Modal -->
<div id="judgeModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; border-left:4px solid var(--green); padding-left:10px;">品管放行判定</h3>
    <input type="hidden" id="currentId">
    <label>判定結果</label>
    <select id="modalResult" style="margin-bottom:15px; font-size:1.1rem; color:#059669; font-weight:bold;">
      <option value="PASS">PASS (合格放行)</option>
      <option value="FAIL">FAIL (不合格退回)</option>
    </select>
    <label>判定備註</label>
    <textarea id="modalNote" style="height:60px; margin-bottom:15px;" placeholder="請輸入檢驗數據或備註事項..."></textarea>
    <div style="background:#fef2f2; padding:12px; border-radius:6px; margin-bottom:20px; border-left:4px solid var(--red);">
      <label style="color:#b91c1c;">🔐 授權密碼 (預設為 8888 或後台設定)</label>
      <input type="password" id="modalPin" placeholder="請輸入 4 碼 PIN 碼" style="letter-spacing:3px; font-weight:bold; text-align:center; margin-top:4px;">
    </div>
    <div style="display:flex; gap:10px;">
      <button onclick="submitJudge()" id="modalBtn" class="btn-action btn-judge" style="flex:1; padding:12px; font-size:0.95rem;">確認判定</button>
      <button onclick="closeModal()" style="flex:1; background:#94a3b8; color:white; border:none; border-radius:6px; cursor:pointer;">取消</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

  // 前端即時解析上傳的 Excel（自動動態掃描「出貨」與「進料」雙區塊）
  function handleExcelUpload(e) {
    const file = e.target.files[0];
    if(!file) return;

    showToast("正在解析 Excel 槽車分頁(出貨與進料)...");
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        // 專門鎖定槽車分頁
        let targetSheetName = workbook.SheetNames.find(n => n.includes('槽車'));
        if(!targetSheetName) {
          targetSheetName = workbook.SheetNames[0];
          alert(`⚠️ 試算表中未找到包含「槽車」的分頁，預設使用第一分頁：「${targetSheetName}」`);
        }

        const worksheet = workbook.Sheets[targetSheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        
        if(rows.length < 5) {
          alert("Excel 列數不足，請確認檔案格式是否正確。");
          return;
        }

        let currentMode = null;
        let colMap = {};
        const newOrders = [];

        for(let r = 0; r < rows.length; r++) {
          const row = rows[r];
          if(!row || row.length === 0) continue;

          const rowStr = row.map(v => String(v || '')).join(' ');

          // 偵測出貨標題列
          if(rowStr.includes('出貨通知單')) {
            currentMode = '出貨';
            colMap = {};
            row.forEach((h, colIdx) => { if(h) colMap[String(h).trim()] = colIdx; });
            continue;
          }

          // 偵測進料/入庫標題列
          if(rowStr.includes('入庫單')) {
            currentMode = '進料';
            colMap = {};
            row.forEach((h, colIdx) => { if(h) colMap[String(h).trim()] = colIdx; });
            continue;
          }

          if(!currentMode) continue;

          if(currentMode === '出貨') {
            const docNo = row[colMap['出貨通知單']];
            const prod = row[colMap['品名']];
            if(!docNo || !prod) continue;

            const timeStr = row[colMap['預計出貨時間']] || '';
            const tank = row[colMap['儲位名稱']] || '';
            const spec = row[colMap['規格']] || '';
            const cust = row[colMap['交易對象簡稱']] || '';
            const truck = row[colMap['出通單單頭.車牌號碼']] || row[colMap['車牌號碼']] || row[colMap['車牌號碼(磅)']] || '';
            const qty = row[colMap['換算數量']] || '';
            const note = row[colMap['注意事項']] || '';

            let container = String(truck || '').trim();
            if(!container && note) {
              const m = String(note).match(/槽號[:：]?\s*([A-Za-z0-9\-]+)/);
              if(m) container = m[1];
              else {
                const m2 = String(note).match(/提貨槽車\s*([A-Za-z0-9\-]+)/);
                if(m2) container = m2[1];
              }
            }

            let grade = '工業級';
            if(String(prod).toUpperCase().includes('UPS')) grade = 'UPS';
            else if(String(prod).toUpperCase().includes('IF')) grade = 'IF';

            newOrders.push({
              doc_no: String(docNo).trim(),
              time: String(timeStr || '').trim(),
              flowType: '出貨',
              grade: grade,
              productName: String(prod).trim(),
              tankNo: String(tank || '').trim(),
              customer: String(cust || '').trim(),
              container: container ? container : String(cust || '').trim(),
              quantity: qty ? `${qty} KG` : String(spec || '').trim(),
              note: String(note || '').trim()
            });
          } else if(currentMode === '進料') {
            const docNo = row[colMap['入庫單']];
            const prod = row[colMap['品名']];
            if(!docNo || !prod) continue;

            const timeStr = row[colMap['預計進貨時間']] || '';
            const tank = row[colMap['槽别']] || row[colMap['儲位']] || '';
            const spec = row[colMap['規格']] || '';
            const vendor = row[colMap['供應商簡稱']] || '';
            const origin = row[colMap['出貨廠別(廠商)']] || '';
            const truck = row[colMap['車牌號碼']] || '';
            const box = row[colMap['櫃號']] || '';
            const qty = row[colMap['預計進貨數量(KG)']] || '';
            const note = row[colMap['備註']] || '';

            let container = String(truck || '').trim();
            if(box && String(box).trim()) {
              container = container ? `${container} (櫃:${box})` : String(box).trim();
            }

            const custStr = (vendor && origin) ? `${vendor} (${origin})` : (origin || vendor || '');

            let grade = '工業級';
            if(String(prod).toUpperCase().includes('UPS')) grade = 'UPS';
            else if(String(prod).toUpperCase().includes('IF')) grade = 'IF';

            newOrders.push({
              doc_no: String(docNo).trim(),
              time: String(timeStr || '').trim(),
              flowType: '進料',
              grade: grade,
              productName: String(prod).trim(),
              tankNo: String(tank || '').trim(),
              customer: custStr.trim(),
              container: container ? container : custStr.trim(),
              quantity: qty ? `${qty} KG` : String(spec || '').trim(),
              note: String(note || '').trim()
            });
          }
        }

        if(newOrders.length === 0) {
          alert("未在此分頁解析出任何有效的槽車排程！");
          return;
        }

        t100Orders = newOrders;
        renderT100Dropdown();
        const outCount = newOrders.filter(o => o.flowType === '出貨').length;
        const inCount = newOrders.filter(o => o.flowType === '進料').length;
        showToast(`🎉 成功自「${targetSheetName}」匯入 ${newOrders.length} 筆槽車排程 (${outCount} 出貨 + ${inCount} 進料)！`);
      } catch(err) {
        console.error(err);
        alert("解析 Excel 失敗：" + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function getFlowTag(type) {
    if(type === '進料') return `<span class="tag-flow tag-in">進料</span>`;
    if(type === '出貨') return `<span class="tag-flow tag-out">出貨</span>`;
    if(type === '補料') return `<span class="tag-flow tag-replenish">補料</span>`;
    if(type === '委託') return `<span class="tag-flow tag-commission">委託</span>`;
    return `<span class="tag-flow tag-in">${type || '-'}</span>`;
  }

  function formatSimpleDate(isoString) {
    if(!isoString) return '-';
    const d = new Date(isoString);
    if(isNaN(d.getTime())) return isoString;
    const pad = n => n.toString().padStart(2, '0');
    return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

      const sDate = s.createdAt ? new Date(s.createdAt).toISOString().split('T')[0] : '';

          load(); 
        } else { 
          alert(res.error); 
          document.getElementById('modalPin').value = ''; 
        }
      }).completeSample(id, result, note, pin);
    } else {
      setTimeout(() => {
        btn.disabled = false; btn.innerText = "確認判定";
        if(pin !== '8888') {
          alert("⛔ 授權失敗：品管專屬密碼錯誤！(預設為 8888)");
          document.getElementById('modalPin').value = '';
          return;
        }
        const item = allData.find(d => d.id === id);
        if(item) {
          item.status = 'completed';
          item.qcResult = result;
          item.qcNote = note;
          item.completedAt = new Date().toISOString();
          localStorage.setItem('HS_QC_SAMPLES', JSON.stringify(allData));
        }
        closeModal();
        showToast("✅ 判定放行成功（本機紀錄已更新）！");
        render();
      }, 300);
    }
  }

  function setBarcodePlaceholder() {
    const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
    document.getElementById('barcode').placeholder = "例: " + todayStr;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3500);
  }

  // PWA Install Prompt
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwa-install-banner').style.display = 'flex';
  });

  function installPWA() {
    if(!deferredPrompt) {
      alert("提示：可使用瀏覽器選單中的「安裝為應用程式」或「加到主畫面」進行安裝！");
      return;
    }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        document.getElementById('pwa-install-banner').style.display = 'none';
      }
      deferredPrompt = null;
    });
  }

  window.onload = () => {
    setBarcodePlaceholder();
    renderT100Dropdown();
    load();
    if(IS_GAS) setInterval(load, 30000);
    
    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW register failed:', err));
    }
  };
</script>
</body>
</html>
