<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeckEdit Video - 簡報自動語音影片生成器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --secondary: #8b5cf6;
      --secondary-glow: rgba(139, 92, 246, 0.4);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --error: #ef4444;
      --card-border-hover: rgba(59, 130, 246, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                  0 0 80px rgba(59, 130, 246, 0.05);
      position: relative;
    }

    .header-area {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .logo-icon svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* 步驟面板控制 */
    .step-panel {
      display: none;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .step-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 拖曳上傳區 */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 20px;
      padding: 50px 20px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.01);
      transition: all 0.3s;
      text-align: center;
      margin-bottom: 24px;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.03);
    }

    .dropzone-icon {
      font-size: 50px;
      margin-bottom: 16px;
      display: inline-block;
    }

    .dropzone p {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .dropzone-file-info {
      font-weight: 600;
      color: var(--text);
      display: none;
      font-size: 16px;
    }

    #fileInput {
      display: none;
    }

    /* 設定控制區 */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
      text-align: left;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-item label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .setting-item select {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
      cursor: pointer;
    }

    .setting-item select:focus {
      border-color: var(--primary);
    }

    /* 按鈕樣式 */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.4);
    }

    .btn:disabled {
      background: #374151;
      color: #6b7280;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    /* 載入與進度顯示 */
    .loading-container {
      margin-top: 30px;
      display: none;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .status-text {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
    }

    /* 旁白編輯列表 */
    .narration-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 550px;
      overflow-y: auto;
      margin-bottom: 30px;
      padding-right: 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.2);
    }

    /* 滾動條美化 */
    .narration-list::-webkit-scrollbar {
      width: 8px;
    }
    .narration-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }
    .narration-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .narration-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .narration-card {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      transition: all 0.3s;
    }

    .narration-card:hover {
      border-color: var(--card-border-hover);
      background: rgba(255, 255, 255, 0.04);
    }

    .slide-preview-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slide-preview {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111827;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: contain;
    }

    .slide-num-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      text-align: left;
    }

    .editor-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .editor-container textarea {
      width: 100%;
      height: 100px;
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.3s;
    }

    .editor-container textarea:focus {
      border-color: var(--primary);
    }

    .preview-action {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-preview {
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }

    .btn-preview:hover:not(:disabled) {
      background: var(--primary);
      color: white;
    }

    .btn-preview:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .audio-player-mini {
      height: 30px;
      display: none;
    }

    /* 播放器容器 */
    .video-result-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
    }

    .video-player {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16/9;
      background: black;
      border-radius: 16px;
      border: 1px solid var(--border);
      outline: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .action-group {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #4b5563;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-area">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/>
          </svg>
        </div>
        <h1>DeckEdit Video</h1>
      </div>
      <div class="subtitle">將您的簡報 PDF 檔案，全自動辨識文字並合成高音質的台灣女聲簡報影片</div>
    </div>

    <!-- 步驟 1：上傳與設定 -->
    <div class="step-panel active" id="step1">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="dropzone-icon" id="dropzoneIcon">📂</div>
        <p id="dropzonePrompt">將簡報 PDF 檔案拖曳至此處，或點擊選擇檔案</p>
        <p class="dropzone-file-info" id="fileInfo"></p>
        <input type="file" id="fileInput" accept="application/pdf">
      </div>

      <div class="settings-grid">
        <div class="setting-item">
          <label for="voiceSelect">語音發音員</label>
          <select id="voiceSelect">
            <option value="zh-TW-HsiaoChenNeural">台灣女生聲音 (曉臻)</option>
            <option value="zh-TW-HsiaoYuNeural">台灣女生聲音 (曉雨)</option>
            <option value="zh-TW-YunJheNeural">台灣男生聲音 (雲哲)</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="speedSelect">說話速度 (語速)</label>
          <select id="speedSelect">
            <option value="+0%">標準語速 (1.0x)</option>
            <option value="-10%">慢速 (0.9x)</option>
            <option value="+10%">快速 (1.1x)</option>
            <option value="+20%">極速 (1.2x)</option>
          </select>
        </div>
      </div>

      <button class="btn" id="prepareBtn" disabled>
        <span>1. 匯出投影片並提取旁白</span>
      </button>

      <div class="loading-container" id="prepareLoading">
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="prepareProgressFill"></div>
        </div>
        <div class="status-text" id="prepareStatusText">正在開啟 PDF 並讀取頁面...</div>
      </div>
    </div>

    <!-- 步驟 2：旁白文稿修正 -->
    <div class="step-panel" id="step2">
      <div style="text-align: left; margin-bottom: 16px;">
        <h3 style="font-size: 18px; margin-bottom: 6px;">✍️ 投影片文字旁白修正</h3>
        <p style="font-size: 13px; color: var(--text-muted);">
          以下是每頁簡報所偵測出的文字。您可以點擊文字欄位直接進行編輯或刪除不必要的贅詞（如頁碼、廣告字），並可以點擊 **🔊 試聽** 預覽聲音。
        </p>
      </div>

      <div class="narration-list" id="narrationList">
        <!-- 投影片卡片動態渲染區 -->
      </div>

      <button class="btn" id="generateBtn">
        <span>2. 開始合成並產生導覽影片</span>
      </button>

      <div class="loading-container" id="generateLoading">
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="generateProgressFill"></div>
        </div>
        <div class="status-text" id="generateStatusText">正在為每一頁生成高音質語音...</div>
      </div>
    </div>

    <!-- 步驟 3：成品展示 -->
    <div class="step-panel" id="step3">
      <div style="text-align: left; margin-bottom: 20px;">
        <h3 style="font-size: 20px; margin-bottom: 6px;">🎉 影片生成成功！</h3>
        <p style="font-size: 14px; color: var(--text-muted);">您可以在瀏覽器內直接觀看或點選下方按鈕下載成品。</p>
      </div>

      <div class="video-result-container">
        <video class="video-player" id="videoPlayer" controls></video>
        <div class="action-group">
          <a id="downloadLink" class="btn" style="text-decoration: none;" download>
            <span>💾 下載說明影片 (MP4)</span>
          </a>
          <button class="btn btn-secondary" onclick="startOver()" style="width: 200px;">
            <span>🔄 重新轉換</span>
          </button>
        </div>
      </div>
    </div>

    <div class="footer">本軟體為本地端離線工具，所有簡報解析、文字辨識均於本機處理。</div>
  </div>

  <script>
    let selectedFile = null;
    let sessionId = null;
    let pagesData = [];

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const dropzoneIcon = document.getElementById('dropzoneIcon');
    const dropzonePrompt = document.getElementById('dropzonePrompt');
    const fileInfo = document.getElementById('fileInfo');
    const prepareBtn = document.getElementById('prepareBtn');
    const prepareLoading = document.getElementById('prepareLoading');
    const prepareProgressFill = document.getElementById('prepareProgressFill');
    const prepareStatusText = document.getElementById('prepareStatusText');

    // 拖曳控制
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    function handleFileSelect(file) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        alert('請上傳 PDF 檔案格式！');
        return;
      }
      selectedFile = file;
      dropzoneIcon.textContent = '📄';
      dropzonePrompt.style.display = 'none';
      fileInfo.style.display = 'block';
      fileInfo.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      prepareBtn.disabled = false;
    }

    // 執行第一階段 Prepare
    prepareBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      prepareBtn.disabled = true;
      prepareLoading.style.display = 'block';
      prepareProgressFill.style.width = '10%';
      prepareStatusText.textContent = '正在將 PDF 投影片上傳至本機處理核心...';

      const formData = new FormData();
      formData.append('file', selectedFile);

      // 進度條模擬動畫
      let progress = 10;
      const interval = setInterval(() => {
        if (progress < 90) {
          progress += Math.floor(Math.random() * 4) + 1;
          prepareProgressFill.style.width = `${progress}%`;
          if (progress > 30 && progress < 70) {
            prepareStatusText.textContent = '正在將簡報頁面匯出為圖片並進行中文文字辨識 (這可能需要幾十秒)...';
          } else if (progress >= 70) {
            prepareStatusText.textContent = '文字辨識即將完成，正在準備編輯介面...';
          }
        }
      }, 1000);

      try {
        const response = await fetch('/api/prepare', {
          method: 'POST',
          body: formData
        });

        clearInterval(interval);
        if (!response.ok) throw new Error('解析簡報失敗，請確認檔案格式是否正確。');

        const resData = await response.json();
        if (resData.success) {
          prepareProgressFill.style.width = '100%';
          prepareStatusText.textContent = '辨識成功！載入文稿編輯器中...';
          
          sessionId = resData.session_id;
          pagesData = resData.pages;
          
          // 渲染編輯頁面
          renderNarrationEditor();
          
          setTimeout(() => {
            switchToStep(2);
          }, 600);
        } else {
          throw new Error(resData.message || '解析失敗');
        }
      } catch (err) {
        clearInterval(interval);
        prepareProgressFill.style.width = '100%';
        prepareProgressFill.style.background = 'var(--error)';
        prepareStatusText.innerHTML = `<span style="color:var(--error)">❌ 解析出錯：${err.message}</span>`;
        alert(`解析簡報出錯：${err.message}`);
        prepareBtn.disabled = false;
      }
    });

    // 渲染文稿編輯列表
    const narrationList = document.getElementById('narrationList');
    function renderNarrationEditor() {
      narrationList.innerHTML = '';
      pagesData.forEach(page => {
        const card = document.createElement('div');
        card.className = 'narration-card';
        card.innerHTML = `
          <div class="slide-preview-container">
            <span class="slide-num-label">第 ${page.page_num} 頁投影片</span>
            <img class="slide-preview" src="${page.img_url}" alt="第 ${page.page_num} 頁">
          </div>
          <div class="editor-container">
            <textarea id="text_${page.page_num}" placeholder="請在此輸入這張投影片的說明旁白...">${page.text}</textarea>
            <div class="preview-action">
              <button class="btn-preview" onclick="playAudioPreview(${page.page_num})">
                <span>🔊 試聽語音</span>
              </button>
              <audio id="audio_${page.page_num}" class="audio-player-mini" controls></audio>
            </div>
          </div>
        `;
        narrationList.appendChild(card);
      });
    }

    // 語音試聽功能
    async function playAudioPreview(pageNum) {
      const text = document.getElementById(`text_${pageNum}`).value.strip ? document.getElementById(`text_${pageNum}`).value.strip() : document.getElementById(`text_${pageNum}`).value.trim();
      if (!text) {
        alert('請先輸入或保留一些文字才能進行試聽！');
        return;
      }

      const voice = document.getElementById('voiceSelect').value;
      const speed = document.getElementById('speedSelect').value;
      const playBtn = event.currentTarget;
      const audioEl = document.getElementById(`audio_${pageNum}`);
      
      playBtn.disabled = true;
      const originalText = playBtn.innerHTML;
      playBtn.innerHTML = '<span>⏳ 產生中...</span>';

      try {
        const url = `/api/preview_audio?text=${encodeURIComponent(text)}&voice=${voice}&speed=${speed}`;
        audioEl.src = url;
        audioEl.style.display = 'block';
        audioEl.play();
      } catch (err) {
        alert('試聽語音生成失敗！');
      } finally {
        playBtn.disabled = false;
        playBtn.innerHTML = originalText;
      }
    }

    // 執行第二階段 Generate
    const generateBtn = document.getElementById('generateBtn');
    const generateLoading = document.getElementById('generateLoading');
    const generateProgressFill = document.getElementById('generateProgressFill');
    const generateStatusText = document.getElementById('generateStatusText');
    const videoPlayer = document.getElementById('videoPlayer');
    const downloadLink = document.getElementById('downloadLink');

    generateBtn.addEventListener('click', async () => {
      // 收集所有編輯後的旁白文字
      const narrationMap = {};
      pagesData.forEach(page => {
        const textVal = document.getElementById(`text_${page.page_num}`).value;
        narrationMap[page.page_num] = textVal;
      });

      generateBtn.disabled = true;
      generateLoading.style.display = 'block';
      generateProgressFill.style.width = '10%';
      generateStatusText.textContent = '正在傳送您編輯好的旁白文稿...';

      const requestBody = {
        session_id: sessionId,
        voice: document.getElementById('voiceSelect').value,
        speed: document.getElementById('speedSelect').value,
        narration: narrationMap
      };

      // 進度模擬
      let progress = 10;
      const interval = setInterval(() => {
        if (progress < 90) {
          progress += Math.floor(Math.random() * 5) + 1;
          generateProgressFill.style.width = `${progress}%`;
          if (progress > 30 && progress < 60) {
            generateStatusText.textContent = '正在產生每一頁的語音音軌檔案中...';
          } else if (progress >= 60) {
            generateStatusText.textContent = '語音生成完成，正在將影片與聲音串接渲染中 (約需 10~20 秒)...';
          }
        }
      }, 800);

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });

        clearInterval(interval);
        if (!response.ok) throw new Error('影片合成失敗，請稍後重試。');

        const resData = await response.json();
        if (resData.success) {
          generateProgressFill.style.width = '100%';
          generateStatusText.textContent = '影片合成成功！準備播放影片...';

          // 設定播放與下載連結
          videoPlayer.src = resData.video_url;
          downloadLink.href = resData.video_url;
          
          setTimeout(() => {
            switchToStep(3);
          }, 600);
        } else {
          throw new Error(resData.message || '合成失敗');
        }
      } catch (err) {
        clearInterval(interval);
        generateProgressFill.style.width = '100%';
        generateProgressFill.style.background = 'var(--error)';
        generateStatusText.innerHTML = `<span style="color:var(--error)">❌ 合成出錯：${err.message}</span>`;
        alert(`合成影片出錯：${err.message}`);
        generateBtn.disabled = false;
      }
    });

    function switchToStep(stepNum) {
      document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
      document.getElementById(`step${stepNum}`).classList.add('active');
    }

    function startOver() {
      selectedFile = null;
      sessionId = null;
      pagesData = [];
      fileInput.value = '';
      dropzoneIcon.textContent = '📂';
      dropzonePrompt.style.display = 'block';
      fileInfo.style.display = 'none';
      prepareBtn.disabled = true;
      prepareLoading.style.display = 'none';
      generateLoading.style.display = 'none';
      generateBtn.disabled = false;
      switchToStep(1);
    }
  </script>
</body>
</html>
