<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>鴻勝包材管理系統 v13.5</title>
  <style>
    body { background-color: #f4f6f9; font-size: 0.9rem; font-family: sans-serif; }
    .hidden { display: none !important; }
    .main-card { max-width: 900px; margin: 15px auto; border:none; }
    .nav-pills .nav-link { font-weight: bold; color: #555; cursor: pointer; border-radius: 8px;}
    .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
    .category-box { background: white; border-radius: 10px; padding: 12px; margin-bottom: 15px; border: 1px solid #dee2e6; }
    .category-title { font-weight: bold; font-size: 1rem; border-bottom: 2px solid #0d6efd; margin-bottom: 8px; color:#0d6efd; padding-bottom: 4px;}
    .stock-low { color: #dc3545; font-weight: bold; }
    .ledger-table th, .ledger-table td { vertical-align: middle; white-space: nowrap; padding: 6px 10px; font-size: 0.85rem;}
    .appsheet-label { font-size: 0.85rem; color: #5f6368; margin-bottom: 4px; font-weight: bold; }
    .appsheet-input { padding: 10px; font-size: 1rem; border: 1px solid #dadce0; } 
    .appsheet-readonly { background-color: #e9ecef; color: #495057; cursor: not-allowed; font-weight: bold;}
    .btn-outline-primary { border-color: #dadce0; color: #5f6368; font-weight: bold; }
    .btn-check:checked + .btn-outline-primary { background-color: #4a90e2; color: white; border-color: #4a90e2; }
    .btn-clear { border: 1px solid #dadce0; background-color: #f8f9fa; color: #6c757d; font-weight: bold; }
    #loginSection { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #e9ecef; }
    .login-card { width: 100%; max-width: 400px; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <div id="loginSection">
    <div class="login-card">
      <h3 class="text-center text-primary fw-bold mb-4">鴻勝包材管理系統</h3>
      <form onsubmit="handleLogin(event)">
        <div class="mb-3"><label class="appsheet-label">帳號</label><input type="text" id="loginAcc" class="form-control appsheet-input" required></div>
        <div class="mb-4"><label class="appsheet-label">密碼</label><input type="password" id="loginPwd" class="form-control appsheet-input" required></div>
        <button type="submit" id="loginBtn" class="btn btn-primary w-100 fw-bold py-2 fs-5">登入系統</button>
      </form>
    </div>
  </div>

  <div id="mainSection" class="container hidden">
    <div class="main-card">
      <ul class="nav nav-pills justify-content-center gap-2 bg-white p-2 rounded shadow-sm mb-3 align-items-center">
        <li class="nav-item"><a id="l-board" class="nav-link active px-3" onclick="showTab('board')">📦 總表</a></li>
        <li class="nav-item"><a id="l-query" class="nav-link px-3" onclick="showTab('query')">🔍 帳卡</a></li>
        <li class="nav-item"><a id="l-input" class="nav-link px-3" onclick="showTab('input')">📝 作業</a></li>
        <li class="nav-item ms-auto"><a class="nav-link text-danger px-3 fw-bold" onclick="handleLogout()" style="background:#fff2f2;">🚪 登出</a></li>
      </ul>

      <div id="tab-board"><div id="boardContainer" class="text-center mt-4">載入中...</div></div>

      <div id="tab-query" class="hidden">
        <div class="card p-3 shadow-sm mb-3">
          <label class="form-label fw-bold text-secondary mb-1">歷史帳卡關鍵字搜尋</label>
          <div class="input-group">
            <input type="text" id="qKey" class="form-control" placeholder="請輸入完整的品號、品名關鍵字...">
            <select id="qMonths" class="form-select" style="max-width: 110px;"><option value="1">近 1 月</option><option value="3" selected>近 3 月</option><option value="0">全部</option></select>
            <button class="btn btn-primary px-4" onclick="doAccountQuery()">對帳查詢</button>
          </div>
        </div>
        <div id="accountResultContainer" class="hidden card p-3 shadow-sm bg-white"></div>
      </div>

      <div id="tab-input" class="hidden">
        <div class="card p-4 shadow-sm mb-3" style="border-radius: 12px;">
          <form id="inventoryForm" onsubmit="submitForm(event)">
            <div class="mb-3"><label class="appsheet-label text-primary">作業日期</label><input type="date" id="iDate" class="form-control appsheet-input border-primary rounded" required></div>
            <div class="mb-3"><label class="appsheet-label">品名</label><input type="text" id="iName" class="form-control appsheet-input appsheet-readonly rounded" readonly></div>
            <div class="mb-3">
              <label class="appsheet-label">品號* <span id="itemLoading" class="spinner-border spinner-border-sm text-primary hidden"></span></label>
              <div class="input-group"><input type="text" id="iBarcode" list="itemList" class="form-control appsheet-input border-primary-custom" required onchange="onBarcodeChange()"><button class="btn btn-clear border-primary-custom" type="button" onclick="clearBarcode()">✖</button></div><datalist id="itemList"></datalist>
            </div>
            <div class="mb-3"><label class="appsheet-label">規格</label><input type="text" id="iSpec" class="form-control appsheet-input appsheet-readonly rounded" readonly></div>
            <div class="mb-3">
              <label class="appsheet-label">批號</label>
              <div class="input-group"><input type="text" id="iBatch" list="batchList" class="form-control appsheet-input" onchange="showBatchStock()"><button class="btn btn-clear" type="button" onclick="clearBatch()">✖</button></div><datalist id="batchList"></datalist>
            </div>
            <div class="mb-4"><label class="appsheet-label">該批號剩餘量</label><input type="text" id="iBatchStock" class="form-control appsheet-input appsheet-readonly rounded" value="0" readonly></div>
            <div class="mb-3">
              <label class="appsheet-label">類型(進/出)*</label>
              <div class="d-flex w-100"><input type="radio" class="btn-check" name="iType" id="typeIn" value="收入" onchange="toggleDept()"><label class="btn btn-outline-primary w-50" for="typeIn">收入</label><input type="radio" class="btn-check" name="iType" id="typeOut" value="出庫" onchange="toggleDept()" checked><label class="btn btn-outline-primary w-50" for="typeOut">出庫</label></div>
            </div>
            <div class="mb-3">
              <label class="appsheet-label">數量*</label>
              <div class="input-group"><input type="number" id="iQty" class="form-control appsheet-input" step="1" min="1" required><button class="btn btn-clear" type="button" onclick="clearQty()">✖</button></div>
            </div>
            <div class="mb-3" id="deptContainer">
              <label id="deptLabel" class="appsheet-label text-danger">領用單位*</label>
              <select id="iDept" class="form-select appsheet-input border-danger rounded" required>
                <option value="">請選擇...</option>
                <option value="資材組">資材組</option>
                <option value="分一">分一</option>
                <option value="分二">分二</option>
                <option value="生產組">生產組</option>
                <!-- 🆕 新增「其他」選項 -->
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="mb-3"><label class="appsheet-label text-primary">登打人員</label><input type="text" id="iUser" class="form-control appsheet-input appsheet-readonly border-primary rounded" readonly></div>
            <div class="mb-4"><label class="appsheet-label">備註</label><input type="text" id="iRemark" class="form-control appsheet-input rounded"></div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-3 fs-5" id="submitBtn">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allItemsData = [], currentBatchData = {}, loggedInUserName = "";
    function getTodayString() { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function handleLogin(e) {
      e.preventDefault();
      const acc = document.getElementById('loginAcc').value, pwd = document.getElementById('loginPwd').value, btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.innerText = "驗證中...";
      google.script.run.withSuccessHandler(res => {
        if (res.success) {
          loggedInUserName = res.name; document.getElementById('iUser').value = res.name;
          document.getElementById('loginSection').style.display = 'none'; document.getElementById('mainSection').classList.remove('hidden');
          initSystemData();
        } else { alert(res.message); btn.disabled = false; btn.innerText = "登入系統"; }
      }).verifyUser(acc, pwd);
    }
    function handleLogout() { location.reload(); }
    function initSystemData() {
       showTab('board'); document.getElementById('iDate').value = getTodayString();
       google.script.run.withSuccessHandler(items => {
         allItemsData = items; let html = "";
         items.forEach(i => { html += `<option value="${i.barcode}">${i.name}</option>`; });
         document.getElementById('itemList').innerHTML = html;
       }).getFormDropdownData();
       toggleDept(); 
    }
    function showTab(t) {
      ['board', 'query', 'input'].forEach(id => { document.getElementById('tab-'+id).classList.add('hidden'); document.getElementById('l-'+id).classList.remove('active'); });
      document.getElementById('tab-'+t).classList.remove('hidden'); document.getElementById('l-'+t).classList.add('active');
      if(t === 'board') loadBoard();
    }
    function loadBoard() {
      document.getElementById('boardContainer').innerHTML = "<div class='spinner-border text-primary'></div>";
      google.script.run.withSuccessHandler(data => {
        let h = "";
        data.forEach(g => {
          h += `<div class="category-box"><div class="category-title">📂 ${g.title}</div>`;
          g.items.forEach(i => { 
            let low = i.stock < i.safe ? "stock-low" : "text-success fw-bold"; 
            h += `<div class="d-flex justify-content-between align-items-center p-2 border-bottom"><div class="text-start"><b>${i.name}</b><br><small class="text-muted">${i.barcode}</small></div><div class="fs-5 ${low}">${i.stock}</div></div>`; 
          }); h += `</div>`;
        }); document.getElementById('boardContainer').innerHTML = h || "無資料";
      }).getCategoryStockData();
    }
    function onBarcodeChange() {
      const bc = document.getElementById('iBarcode').value.trim();
      if(!bc) { ['iName','iSpec','iBatch'].forEach(id=>document.getElementById(id).value=''); document.getElementById('iBatchStock').value='0'; return; }
      const match = allItemsData.find(i => i.barcode.toLowerCase() === bc.toLowerCase());
      if(match) { document.getElementById('iName').value = match.name; document.getElementById('iSpec').value = match.spec; }
      document.getElementById('itemLoading').classList.remove('hidden');
      
      google.script.run.withSuccessHandler(batches => {
        currentBatchData = {}; let html = "";
        batches.forEach(b => { 
          currentBatchData[b.batch] = b.stock; 
          // ★ 這裡會把發出次數顯示在下拉選單內！
          html += `<option value="${b.batch}">庫存: ${b.stock} (目前已發出 ${b.issueCount} 次)</option>`; 
        });
        document.getElementById('batchList').innerHTML = html; 
        document.getElementById('itemLoading').classList.add('hidden');
      }).getItemBatches(bc);
    }
    function showBatchStock() { const b = document.getElementById('iBatch').value; document.getElementById('iBatchStock').value = currentBatchData[b] || '0'; }
    function clearBarcode() { document.getElementById('iBarcode').value = ''; onBarcodeChange(); document.getElementById('iBarcode').focus(); }
    function clearBatch() { document.getElementById('iBatch').value = ''; showBatchStock(); }
    function clearQty() { document.getElementById('iQty').value = ''; }
    function toggleDept() { document.getElementById('deptLabel').innerText = document.getElementById('typeOut').checked ? '領用單位*' : '入庫單位 (預設：資材組)'; }
    
    function doAccountQuery() {
      const key = document.getElementById('qKey').value.trim();
      if(!key) { alert('請輸入查詢品號或品名關鍵字！'); return; }
      const container = document.getElementById('accountResultContainer');
      container.classList.remove('hidden'); container.innerHTML = "<div class='text-center p-3'><div class='spinner-border text-primary'></div> 明細對帳中...</div>";
      
      google.script.run.withSuccessHandler(res => {
        if(res.length === 0) { container.innerHTML = "<div class='alert alert-warning'>⚠️ 找不到任何相符品項的異動紀錄，請確認品號是否輸入完整（不需輸入單引號）。</div>"; return; }
        let h = "";
        res.forEach(item => {
          h += `<div class="mb-4 border p-3 rounded bg-light">
                  <h5 class="text-primary fw-bold">📋 品名：${item.details.name}</h5>
                  <p class="mb-2 text-muted">品號：${item.details.barcode} | 規格：${item.details.spec}</p>
                  <div class="table-responsive">
                    <table class="table table-bordered table-striped ledger-table bg-white">
                      <thead class="table-dark">
                        <tr><th>日期</th><th>摘要</th><th>收入量</th><th>收入批號</th><th>資材發</th><th>分一發</th><th>分二發</th><th>生產發</th><th>出庫批號</th><th>結存</th><th>備註</th></tr>
                      </thead>
                      <tbody>`;
          item.history.forEach(r => {
            h += `<tr><td>${r.date}</td><td>${r.summary}</td><td>${r.in_qty}</td><td>${r.in_batch}</td><td>${r.out_mat}</td><td>${r.out_p1}</td><td>${r.out_p2}</td><td>${r.out_prod}</td><td>${r.out_batch}</td><td class="fw-bold text-navy">${r.balance}</td><td>${r.remark}</td></tr>`;
          });
          h += `</tbody></table></div></div>`;
        });
        container.innerHTML = h;
      }).queryAccountCard(key, document.getElementById('qMonths').value);
    }

    function submitForm(e) {
      e.preventDefault();
      const type = document.getElementById('typeIn').checked ? "收入" : "出庫", qty = parseFloat(document.getElementById('iQty').value);
      const batch = document.getElementById('iBatch').value.trim() || "無批號";
      if (type === '出庫' && currentBatchData[batch] && qty > currentBatchData[batch]) { alert('該批號庫存不足！'); return; }
      
      const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "儲存中...";
      const rawDate = document.getElementById('iDate').value;
      const formattedInputDate = rawDate ? rawDate.replace(/-/g, '/') : getTodayString().replace(/-/g, '/');

      const formData = { 
        type, barcode: document.getElementById('iBarcode').value.trim(), qty, batch, 
        dept: document.getElementById('iDept').value, remark: document.getElementById('iRemark').value, 
        user: loggedInUserName, date: formattedInputDate 
      };
      google.script.run.withSuccessHandler(res => {
        alert(res); document.getElementById('inventoryForm').reset(); 
        document.getElementById('iUser').value = loggedInUserName; document.getElementById('iDate').value = getTodayString();
        btn.disabled = false; btn.innerText = "Save"; loadBoard();
      }).writeInventoryLog(formData);
    }
  </script>
</body>
</html>
