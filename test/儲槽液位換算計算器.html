<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>儲槽液位-重量換算計算器</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #0ea5e9;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --primary-light: #a5b4fc;
            --primary-dark: #4f46e5;
            --secondary: #38bdf8;
            --background: #090d16;
            --card-bg: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1f2937;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            transition: var(--transition);
        }

        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #312e81 100%);
            color: white;
            padding: 24px 20px 48px 20px;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: -32px auto 0 auto;
            padding: 0 16px 40px 16px;
            flex: 1;
            z-index: 10;
        }

        /* Navigation Tabs */
        .tab-nav {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 6px;
            gap: 6px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* Cards */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        /* Form elements */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-control {
            width: 100%;
            padding: 14px 14px 14px 44px;
            font-size: 16px;
            font-family: var(--font-family);
            background-color: var(--background);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .input-control:focus {
            border-color: var(--primary);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-unit {
            position: absolute;
            right: 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Searchable Select Dropdown */
        .search-select-container {
            position: relative;
        }

        .search-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 5px;
            display: none;
        }

        .search-select-item {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: var(--transition);
        }

        .search-select-item:hover {
            background-color: var(--background);
            color: var(--primary);
        }

        .search-select-item .prod-badge {
            font-size: 11px;
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Result Panel */
        .result-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(14, 165, 233, 0.05) 100%);
            border: 2px dashed var(--primary-light);
            text-align: center;
        }

        .result-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            margin: 10px 0;
        }

        .result-value span {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .spec-item {
            text-align: left;
            font-size: 13px;
        }

        .spec-item span {
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .spec-item strong {
            font-weight: 700;
            color: var(--text-main);
        }

        /* Batch / Grid Mode Layout */
        .batch-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-bar {
            flex: 1;
            min-width: 200px;
        }

        .batch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .batch-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: var(--transition);
        }

        .batch-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }

        .batch-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .batch-card-title {
            font-size: 15px;
            font-weight: 800;
        }

        .batch-card-badge {
            font-size: 11px;
            background-color: rgba(14, 165, 233, 0.1);
            color: var(--secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .batch-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .batch-input-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .batch-input-field label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .batch-input {
            width: 100%;
            padding: 8px;
            font-size: 13px;
            border: 1px solid var(--border);
            background-color: var(--background);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        .batch-input:focus {
            border-color: var(--primary);
        }

        .batch-result {
            border-top: 1px dashed var(--border);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
        }

        .batch-result .val {
            color: var(--primary);
            font-size: 16px;
            font-weight: 800;
        }

        /* Buttons */
        .btn {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--background);
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
    </style>
</head>

    <header>
        <div class="header-content">
            <div class="header-title">
                <h1><i class="fa-solid fa-gauge-high"></i> 儲槽液位-重量換算</h1>
                <p>鴻勝化學 ─ 82 個在線儲槽精確換算系統 (手機版)</p>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="切換深淺色模式">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('single')">
                <i class="fa-solid fa-flask"></i> 單槽對照換算
            </button>
            <button class="tab-btn" onclick="switchTab('batch')">
                <i class="fa-solid fa-table-cells-large"></i> 全槽日報輸入
            </button>
        </nav>

        <!-- PANEL 1: Single Tank Calculation -->
        <div id="panelSingle" class="tab-panel active">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-magnifying-glass"></i> 選擇槽體</div>
                
                <div class="input-group">
                    <label>搜尋/選擇槽號</label>
                    <div class="search-select-container">
                        <div class="input-wrapper">
                            <input type="text" id="tankSearchInput" class="input-control" placeholder="輸入槽號，例如: TK-601" oninput="filterTankList()" onfocus="showTankDropdown()" onblur="hideTankDropdown(event)">
                            <i class="fa-solid fa-database"></i>
                            <span class="input-unit" id="selectedProductBadge" style="display: none;">-</span>
                        </div>
                        <div id="tankDropdown" class="search-select-dropdown">
                            <!-- Generated Dynamically -->
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label id="levelInputLabel">輸入液位</label>
                    <div class="input-wrapper">
                        <input type="number" id="tankLevel" class="input-control" placeholder="請輸入液位數值" step="any" oninput="calculateSingleTank()">
                        <i class="fa-solid fa-ruler-vertical"></i>
                        <span class="input-unit" id="levelUnit">mm/%</span>
                    </div>
                </div>

                <div class="input-group" id="tempGroup">
                    <label>輸入槽溫 (°C)</label>
                    <div class="input-wrapper">
                        <input type="number" id="tankTemp" class="input-control" placeholder="請輸入槽體溫度" value="25" step="any" oninput="calculateSingleTank()">
                        <i class="fa-solid fa-temperature-three-quarters"></i>
                        <span class="input-unit">°C</span>
                    </div>
                </div>
            </div>

            <!-- Single Result Card -->
            <div class="card result-card">
                <div class="result-label">換算重量/容量</div>
                <div class="result-value" id="singleResult">0 <span>KG</span></div>
                
                <div class="spec-grid">
                    <div class="spec-item">
                        <span>目前所屬品名</span>
                        <strong id="specProduct">-</strong>
                    </div>
                    <div class="spec-item">
                        <span>所用對照密度</span>
                        <strong id="specDensity">-</strong>
                    </div>
                    <div class="spec-item" style="grid-column: span 2;">
                        <span>對照計算公式</span>
                        <strong id="specFormula" style="font-family: monospace; font-size: 11px;">-</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL 2: Batch calculation / Daily report grid -->
        <div id="panelBatch" class="tab-panel">
            <div class="card" style="padding: 16px; margin-bottom: 15px;">
                <div class="batch-controls">
                    <div class="input-wrapper search-bar">
                        <input type="text" id="batchSearch" class="input-control" style="padding: 10px 10px 10px 38px; font-size:14px;" placeholder="快速過濾槽號..." oninput="renderBatchGrid()">
                        <i class="fa-solid fa-filter" style="font-size:14px; left:12px;"></i>
                    </div>
                    <button class="btn btn-primary" onclick="exportBatchCSV()">
                        <i class="fa-solid fa-file-export"></i> 匯出日報 CSV
                    </button>
                    <button class="btn btn-secondary" onclick="clearBatchInputs()">
                        <i class="fa-solid fa-trash-can"></i> 重設
                    </button>
                </div>
            </div>

            <div class="batch-grid" id="batchGrid">
                <!-- Generated Dynamically -->
            </div>
        </div>
    </div>

    <footer>
        鴻勝化學 ─ 槽體液位換算平台 © 2026
    </footer>

            if (currentTheme !== 'dark') {
                newTheme = 'dark';
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Tab Switcher
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            
            if (tab === 'single') {
                document.querySelector('[onclick="switchTab(\'single\')"]').classList.add('active');
                document.getElementById('panelSingle').classList.add('active');
            } else {
                document.querySelector('[onclick="switchTab(\'batch\')"]').classList.add('active');
                document.getElementById('panelBatch').classList.add('active');
                renderBatchGrid();
            }
        }

        // Searchable dropdown logic
        function showTankDropdown() {
            const dd = document.getElementById('tankDropdown');
            dd.style.display = 'block';
            filterTankList();
        }

        function hideTankDropdown(event) {
            // Use timeout to allow click event on items to fire first
            setTimeout(() => {
                document.getElementById('tankDropdown').style.display = 'none';
            }, 200);
        }

        function filterTankList() {
            const query = document.getElementById('tankSearchInput').value.trim().toUpperCase();
            const dd = document.getElementById('tankDropdown');
            
            const filtered = tankData.tanks.filter(t => t.tank.toUpperCase().includes(query) || t.product.toUpperCase().includes(query));
            
            if (filtered.length === 0) {
                dd.innerHTML = '<div style="padding: 12px; text-align: center; color: var(--text-muted); font-size:13px;">找不到相符的槽號</div>';
                return;
            }

            dd.innerHTML = filtered.map(t => `
                <div class="search-select-item" onclick="selectTank('${t.tank}')">
                    <strong>${t.tank}</strong>
                    <span class="prod-badge">${t.product}</span>
                </div>
            `).join('');
        }

        function selectTank(tankName) {
            selectedTank = tankData.tanks.find(t => t.tank === tankName);
            if (!selectedTank) return;

            document.getElementById('tankSearchInput').value = selectedTank.tank;
            
            // Show product badge
            const badge = document.getElementById('selectedProductBadge');
            badge.innerText = selectedTank.product;
            badge.style.display = 'inline-block';
            
            // Adjust units and temperature fields based on formula
            const formula = selectedTank.formula.toUpperCase();
            const levelUnit = document.getElementById('levelUnit');
            const levelInputLabel = document.getElementById('levelInputLabel');
            const tempGroup = document.getElementById('tempGroup');

            if (formula.includes('%') || formula.includes('PERCENT')) {
                levelUnit.innerText = '%';
                levelInputLabel.innerText = '輸入液位 (%)';
            } else if (formula.includes('*1.5*1.5')) {
                levelUnit.innerText = 'meter';
                levelInputLabel.innerText = '輸入液位 (m)';
            } else {
                levelUnit.innerText = 'mm';
                levelInputLabel.innerText = '輸入液位 (mm)';
            }

            // If formula does not contain LOOKUP or density related variables, hide temperature input
            if (formula.includes('LOOKUP') || formula.includes('DENSITY')) {
                tempGroup.style.display = 'block';
            } else {
                tempGroup.style.display = 'none';
            }

            // Render specs
            document.getElementById('specProduct').innerText = selectedTank.product;
            document.getElementById('specFormula').innerText = selectedTank.formula;
            
            // Recalculate
            calculateSingleTank();
        }

        // Density table lookup
        function getDensity(temp, chem) {
            temp = Math.round(temp);
            if (temp < 1) temp = 1;
            if (temp > 50) temp = 50; // clamp to index table range
            
            const tempRow = tankData.densities[temp];
            if (tempRow && tempRow[chem] !== undefined && tempRow[chem] !== null) {
                return tempRow[chem];
            }
            return 1.0; // fallback default
        }

        // Evaluate formula safely
        function evaluateFormula(formulaJs, level, temp) {
            try {
                // Run eval with level and temp variables local
                const result = eval(formulaJs);
                return isNaN(result) ? 0 : result;
            } catch (e) {
                console.error("Eval error for formula:", formulaJs, e);
                return 0;
            }
        }

        function calculateSingleTank() {
            if (!selectedTank) return;

            const level = parseFloat(document.getElementById('tankLevel').value);
            const temp = parseFloat(document.getElementById('tankTemp').value) || 25;
            
            const valEl = document.getElementById('singleResult');
            const densityEl = document.getElementById('specDensity');

            if (isNaN(level)) {
                valEl.innerHTML = '0 <span>KG</span>';
                densityEl.innerText = '-';
                return;
            }

            // Get active density for spec display
            const formula = selectedTank.formula.toUpperCase();
            if (formula.includes('LOOKUP')) {
                // Try to find the chemical lookup target
                const chemMatch = selectedTank.js_formula.match(/getDensity\(temp,\s*'([^']+)'\)/);
                if (chemMatch && chemMatch[1]) {
                    const chem = chemMatch[1];
                    densityEl.innerText = `${chem}: ${getDensity(temp, chem)} g/cm³`;
                } else {
                    densityEl.innerText = '對照中';
                }
            } else {
                // Non temperature dependent
                densityEl.innerText = '常數固定';
            }

            // Evaluate
            const resultVal = evaluateFormula(selectedTank.js_formula, level, temp);
            
            // Format unit (TK-C00 series uses cubic meters/Liters? Let's check formula target)
            const unit = selectedTank.formula.includes('L') && !selectedTank.formula.includes('L2') ? 'L' : 'KG';
            
            // Rounded to whole or 2 decimal places
            valEl.innerHTML = `${Math.round(resultVal).toLocaleString()} <span>${unit}</span>`;
        }

        // --- BATCH / GRID MODE LOGIC ---
        let batchInputs = {}; // holds {tankName: {level, temp}}

        function renderBatchGrid() {
            const grid = document.getElementById('batchGrid');
            const search = document.getElementById('batchSearch').value.trim().toUpperCase();
            
            const filtered = tankData.tanks.filter(t => t.tank.toUpperCase().includes(search) || t.product.toUpperCase().includes(search));
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">無相符槽號</div>';
                return;
            }

            grid.innerHTML = filtered.map(t => {
                // Initialize default batch data
                if (!batchInputs[t.tank]) {
                    batchInputs[t.tank] = { level: '', temp: '25' };
                }
                
                const data = batchInputs[t.tank];
                const formula = t.formula.toUpperCase();
                const unit = formula.includes('%') ? '%' : (formula.includes('*1.5*1.5') ? 'm' : 'mm');
                const showTemp = formula.includes('LOOKUP') || formula.includes('DENSITY');
                
                return `
                    <div class="batch-card" id="card-${t.tank}">
                        <div class="batch-card-header">
                            <span class="batch-card-title">${t.tank}</span>
                            <span class="batch-card-badge">${t.product}</span>
                        </div>
                        <div class="batch-input-row">
                            <div class="batch-input-field">
                                <label>液位 (${unit})</label>
                                <input type="number" class="batch-input" value="${data.level}" oninput="updateBatchValue('${t.tank}', 'level', this.value)" placeholder="輸入">
                            </div>
                            <div class="batch-input-field" style="display: ${showTemp ? 'flex' : 'none'};">
                                <label>溫度 (°C)</label>
                                <input type="number" class="batch-input" value="${data.temp}" oninput="updateBatchValue('${t.tank}', 'temp', this.value)" placeholder="25">
                            </div>
                        </div>
                        <div class="batch-result">
                            <span>重量/容量</span>
                            <span class="val" id="batch-res-${t.tank}">-</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Calculate active ones on render
            filtered.forEach(t => recalculateBatchItem(t.tank));
        }

        function updateBatchValue(tankName, key, value) {
            if (!batchInputs[tankName]) {
                batchInputs[tankName] = { level: '', temp: '25' };
            }
            batchInputs[tankName][key] = value;
            recalculateBatchItem(tankName);
        }

        function recalculateBatchItem(tankName) {
            const t = tankData.tanks.find(x => x.tank === tankName);
            const data = batchInputs[tankName];
            const resEl = document.getElementById(`batch-res-${tankName}`);
            
            if (!resEl) return;

            const lvl = parseFloat(data.level);
            const temp = parseFloat(data.temp) || 25;

            if (isNaN(lvl)) {
                resEl.innerText = '-';
                return;
            }

            const resVal = evaluateFormula(t.js_formula, lvl, temp);
            const unit = t.formula.includes('L') && !t.formula.includes('L2') ? 'L' : 'KG';
            resEl.innerText = `${Math.round(resVal).toLocaleString()} ${unit}`;
        }

        function clearBatchInputs() {
            if (confirm('確定要清空所有輸入的液位數值嗎？')) {
                batchInputs = {};
                renderBatchGrid();
            }
        }

        function exportBatchCSV() {
            // Header
            let csvContent = "\uFEFF"; // Add BOM
            csvContent += "槽號,品名,輸入液位,輸入溫度(°C),換算結果,原始計算公式\n";

            let count = 0;
            tankData.tanks.forEach(t => {
                const data = batchInputs[t.tank];
                if (data && data.level !== '') {
                    const lvl = parseFloat(data.level);
                    const temp = parseFloat(data.temp) || 25;
                    const res = evaluateFormula(t.js_formula, lvl, temp);
                    const rounded = Math.round(res);
                    const unit = t.formula.includes('L') && !t.formula.includes('L2') ? 'L' : 'KG';
                    
                    csvContent += `${t.tank},${t.product},${lvl},${temp},${rounded} ${unit},"${t.formula}"\n`;
                    count++;
                }
            });

            if (count === 0) {
                alert('沒有任何已輸入資料的槽體可供匯出！');
                return;
            }

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}`;
            link.setAttribute("download", `儲槽液位換算表_${dateStr}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
