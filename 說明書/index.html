            font-weight: 700;
            letter-spacing: 0.5px;

        }

        .search-wrapper {

        .search-input {

            border-radius: 8px;

            font-weight: 600;

        }

            padding: 10px 12px;
            background: none;
            border: none;
            border-radius: 6px;
            color: var(--text-muted);

            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;

            display: block;

            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #fff;

            border-left-color: #3b82f6;
        }

        .markdown-body .alert-tip {

            text-transform: uppercase;
            letter-spacing: 0.5px;

        .copy-code-btn {

            right: 8px;
            top: 8px;

            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;

        .copy-code-btn:hover {
            color: var(--text-main);

        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-gradient);
            border-radius: 20px;
            margin-bottom: 24px;

            align-items: center;
            justify-content: center;

        .welcome-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;

        .welcome-desc {

            line-height: 1.5;
            font-size: 14px;

        const manualsData = [{"title": "flowchart-web 產品製程流程圖系統", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/flowchart-web_產品製程流程圖系統_說明書.md", "content": "# 產品製程流程圖系統 (flowchart-web) - 操作說明書\n\n## 專案簡介\n此專案為鴻勝化學的「產品製程流程圖系統 (槽體製程管控系統)」，提供廠區槽體、原料、製程、成品槽及格外品之互動式流程圖與即時狀態監控。\n\n## 主要功能特色\n- **SVG 互動式畫布**：高解析度 SVG 流程圖，可縮放、平移，點擊任一槽體可查看詳細規格。\n- **液位動態視覺效果**：槽體詳細資訊彈窗中，液位計具備動態水波動畫與即時數值更新。\n- **重要製程數據**：實時顯示溫度、壓力、成分狀態，並支援 N2 吹掃動態模擬。\n- **側邊欄智能導航**：快速過濾不同區域的製程槽體。\n- **匯入/匯出功能**：支援將配置參數與手動產能備份為 JSON 檔案下載，並可隨時匯入復原。\n\n## 技術棧\n- HTML5, CSS3, JavaScript (ES6)\n- SVG (可縮放向量圖形)\n\n## 本機執行與操作\n1. 進入 `flowchart-web` 目錄，雙擊 `index.html`。\n2. 點擊畫面上的槽體（如原料槽、成品槽），將彈出詳細規格視窗。\n3. 可點擊上方的 **「修改產能描述」** 手動調整黃色總產能標示，或點選 **「匯出/匯入」** 備份目前配置。\n"}, {"title": "hongsheng-web 軟管對刷稽核系統", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/hongsheng-web_軟管對刷稽核系統_說明書.md", "content": "# 軟管對刷稽核系統 (hongsheng-web) - 操作說明書\n\n## 專案簡介\n本專案為鴻勝化學的「軟管對刷稽核系統 — 互動式教育訓練與模擬演練」網頁應用程式。旨在幫助現場操作員通過暗黑科技風格的介面，進行模擬演練與 QC 檢驗培訓。\n\n## 主要功能特色\n- **科技感 UI 設計**：採用深色模式、霓虹光暈與動態掃描線視覺效果。\n- **即時連線狀態**：前端與 Firebase Firestore 實時連線，並設有連線狀態指示燈。\n- **雙模式切換**：\n  - **簡報模式**：用於講授軟管對刷與稽核的理論知識。\n  - **模擬演練模式**：模擬現場條碼掃描、操作員手動配對確認、以及 QC 儀表板檢驗流程。\n- **防錯警示系統**：實時比對刷卡資訊與預計配對，如出錯會觸發紅色警示燈與警告音效。\n\n## 技術棧\n- 前端：HTML5, CSS3 (Vanilla), JavaScript (ES6)\n- 後端資料庫：Firebase Firestore\n\n## 本機執行與操作\n1. 按兩下開起 `hongsheng-web/index.html` 即可單機運行。\n2. 若需實時 Firebase 連線，請確保 `.env` 或 `app.js` 中配置了正確的 Firebase API 金鑰。\n3. 進入網頁後，點選右上角的 **「開始演練」**，依序執行條碼掃描與對刷稽核操作。\n"}, {"title": "isotank-training 化學品卸料安全訓練", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/isotank-training_化學品卸料安全訓練_說明書.md", "content": "# ISOTANK 化學品卸料安全訓練 (isotank-training) - 操作說明書\n\n## 專案簡介\n本網頁為 ISOTANK 化學品進貨安全與卸料訓練的互動式安全教材，提供視覺化的 9 個安全步驟指導。\n\n## 主要功能特色\n- **視覺化教學步驟**：包含「隱形危機、進場核對、雙重防線、接管氣密」等 9 個安全控制點。\n- **SVG 動態演示**：點擊步驟時，會以 SVG 動畫展示防溢流堤架設、接地測試、以及管線對接氣密測試等現場流程。\n- **語音旁白與字幕**：結合配音檔，提供流暢的教材時間軸控制。\n\n## 技術棧\n- HTML5, CSS3, 內嵌 SVG 動畫與 CSS Keyframes。\n\n## 本機執行與操作\n1. 進入 `isotank-training` 目錄，雙擊 `index.html`。\n2. 點擊下方時間軸的 **「播放」**，教材將伴隨旁白自動播演。\n3. 亦可直接點選上方步驟圖示，跳轉至指定步驟查看 SVG 動畫演示。\n"}, {"title": "isotank-hf-demo 化學品卸料動畫與影片", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/isotank-hf-demo_化學品卸料動畫與影片_說明書.md", "content": "# ISOTANK 化學品卸料安全訓練動畫與影片 (isotank-hf-demo) - 操作說明書\n\n## 專案簡介\n本專案為鴻勝化學「ISOTANK 化學品卸料安全訓練」的動畫簡報與影片生成系統。本專案為 `isotank-training` 專案的全面升級版，使用最新的 **HyperFrames** 影音生成框架開發，採用深色暗黑科技感風格的網頁投影片（GSAP 動畫效果），配上微軟 Edge TTS 產生的台灣腔男聲旁白，並能自動渲染輸出高畫質的 MP4 教育訓練影片。\n\n## 主要功能特色\n- **HyperFrames 動畫簡報**：以 HTML + GSAP 編寫 12 頁精緻動畫投影片，每頁具有高質感、極流暢的動態圖形（Motion Graphics）。\n- **精準音訊與字幕對齊**：旁白使用微軟 Edge TTS 台灣男聲 `zh-TW-YunJheNeural` 產生。每頁的播放時長會根據旁白音檔長度（外加 1 秒緩衝）進行動態調整（而不是固定 10 秒）。\n- **自動化時間更新腳本**：提供 `fix_timing.py` 腳本，能夠根據旁白音檔的長度重新計算並自動修改 HTML 中各個 `clip` 的 `data-start` 與 `data-duration` 屬性。\n- **全自動影片渲染**：可以直接使用 `npx hyperframes render`（或執行編譯腳本）調用 Playwright 於無頭瀏覽器中自動錄製網頁動畫，並合併旁白音軌，一鍵生成 1920x1080 規格的 MP4 影片。\n\n## 技術棧\n- **前端動畫**：HTML5, CSS3, GSAP (GreenSock Animation Platform)\n- **影音渲染**：HyperFrames CLI (基於 Playwright)\n- **語音合成**：edge-tts (Microsoft Cognitive Services)\n- **多媒體處理**：FFmpeg (音訊延遲與音視訊混音)\n\n## 專案結構\n- `index.html`：主要的投影片動畫網頁（含 12 個投影片 clips、GSAP 時間軸等）。\n- `assets/narration/`：每頁對應的旁白音檔（`page-01.mp3` ~ `page-12.mp3`）。\n- `combined_audio.mp3`：串接完成的全程旁白音軌。\n- `fix_timing.py` / `apply_timing.py`：時間碼自動更新與同步腳本。\n- `package.json`：定義 `dev` (預覽)、`check` (檢查)、`render` (輸出影片) 等 script。\n- `isotank-final.mp4`：最終產出的含音軌高畫質影片（4分6秒，1920×1080）。\n\n## 本機執行與操作\n1. **啟動預覽 Studio**：\n   進入 `isotank-hf-demo` 目錄，執行：\n   ```bash\n   npm run dev\n   ```\n   即可在瀏覽器開啟 `http://localhost:3002` 預覽帶旁白與動畫的互動式簡報。\n\n2. **時間碼校準**：\n   若修改了簡報內容或旁白音檔，執行以下腳本自動重新計算並更新 `index.html` 的時間軸屬性：\n   ```bash\n   python fix_timing.py\n   ```\n\n3. **渲染輸出影片**：\n   執行以下命令，將網頁動畫自動導出為無音軌影片：\n   ```bash\n   npm run render\n   ```\n\n4. **音軌合成**：\n   使用 FFmpeg 將 `combined_audio.mp3` 與無音軌影片進行 mux，即可合成最終帶旁白的 `isotank-final.mp4` 教育訓練影片。\n"}, {"title": "test 大阪冒險電子書", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/test_大阪冒險電子書_說明書.md", "content": "# 大阪冒險之旅四格漫畫電子書 (test) - 操作說明書\n\n## 專案簡介\n本專案為小妤一家四口大阪五天四夜旅遊的四格漫畫互動式電子書，內建雙語音播放（微軟原生台灣國語與 ElevenLabs 電影級語音）與角色試聽功能。\n\n## 主要功能特色\n- **微軟原生 (Microsoft Native) 模式**：優化台灣腔聲線；針對 10 歲主角弟弟「小融 (Taiga)」進行童音校正（以微軟台灣男聲 `zh-TW-YunJheNeural` 結合 `+35Hz` 音高及 `+15%` 語速調整），完美呈現活潑小男童聲音。\n- **ElevenLabs 模式**：支援電影級高擬真配音，且設有額度耗盡自動降級至微軟語音的防錯機制。\n- **試聽面板**：提供獨立試聽按鈕，方便預覽個別角色音色。\n\n## 技術棧\n- 前端：HTML5, CSS3, JavaScript\n- 後端語音生成：Python (edge-tts), ElevenLabs API\n\n## 本機執行與操作\n1. 雙擊開起 `test/index.html` 查看電子書。\n2. 點選頁面右上角的設定（齒輪）圖示，可切換「語音模式」或對各角色進行語音試聽。\n"}, {"title": "聲音轉文字 NoType語音助理", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/聲音轉文字_NoType語音助理_說明書.md", "content": "# 聲音轉文字 (NoType 語音助理) - 操作說明書\n\n## 專案簡介\nNoType 是一個本機安裝的語音助理，允許使用者按下快捷鍵進行快速錄音，並自動透過 Whisper / Groq API 轉成文字，隨後模擬鍵盤將文字自動輸入至目前游標所在的任何應用程式中。\n\n## 主要功能特色\n- **全域快捷鍵**：可在任何視窗下按下快捷鍵觸發錄音。\n- **自動打字輸入**：識別完成後，免手動貼上，程式會模擬鍵盤直接打字輸入。\n- **設定面板**：支援設定 API KEY、AI 模型推薦、以及快捷鍵綁定。\n\n## 技術棧\n- 框架：Electron (Node.js)\n- API 服務：OpenAI Whisper API / Groq API\n\n## 本機執行與操作\n1. 雙擊執行 `聲音轉文字` 目錄底下的 `start.bat`。\n2. 啟動後會在系統右下角系統匣（Tray）運行。\n3. 按下設定好的錄音快捷鍵，說完話後再次按下快捷鍵，系統將自動在您光標位置輸入識別後的文字。\n"}, {"title": "Lv1 純前端說明書", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/互動式網站教學說明/Lv1_純前端說明書.md", "content": "# Level 1：純前端單機測驗 - 使用說明書\n\n---\n\n## 📝 模組概述\n本模組為互動式教學的第一步：**單機純網頁測驗**。所有題庫、作答逻辑與計分演算法皆封裝在瀏覽器端（前端），無須任何後端伺服器或資料庫。\n\n*   **適用場景**：課堂前的快速複習、學員自我評量、無須保存數據的單純互動練習。\n*   **優點**：零主機成本、載入速度極快、原始碼完全公開。\n*   **缺點**：學員一旦重新整理或關閉網頁，作答紀錄與分數即會完全歸零，且不安全，無法防護 AI API 金鑰。\n\n---\n\n## 🛠️ 技術實作與程式架構\n\n### 檔案位置\n*   `互動式網站/lv1-frontend.html`\n\n### 前端 JavaScript 判定邏輯\n我們將正確答案陣列硬編碼於前端，透過 DOM 操作即時更改選項的邊框顏色，並顯示原先隱藏的 `class=\"explanation\"` 區塊：\n\n```javascript\nconst correctAnswers = ['B', 'A']; // 正確選項\nlet userAnswers = [null, null];   // 學員作答狀態\nlet isGraded = false;\n\nfunction selectOption(qIndex, optionLetter) {\n  if (isGraded) return;\n  // 更新 UI 選取項樣式...\n  userAnswers[qIndex] = optionLetter;\n}\n\nfunction submitQuiz() {\n  // 1. 檢查是否回答完畢\n  // 2. 顯示隱藏的解析區塊 (.style.display = 'block')\n  // 3. 與 correctAnswers 對照，答對加分，並為選項套用 .correct / .incorrect 樣式\n  // 4. 顯示總分\n}\n```\n\n---\n\n## 🚀 操作說明\n1.  **開啟方式**：在檔案總管中雙擊 `互動式網站/lv1-frontend.html`，直接以瀏覽器開啟即可，不依賴任何本地伺服器。\n2.  **進行測驗**：\n    *   在單選題中點擊選項，該選項將以霓虹藍邊框標記為已選。\n    *   點擊「**送出測驗**」按鈕，題目下方會即時顯示**綠色（答對）**與**紅色（答錯）**的反饋。\n    *   解析區塊會自動展開，最下方會顯示總分圓環與回饋評語。\n    *   點擊「**重新挑戰**」會重置所有狀態。\n"}, {"title": "Lv2 Google試算表說明書", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/互動式網站教學說明/Lv2_Google試算表說明書.md", "content": "# Level 2：試算表後端 - 使用說明書\n\n---\n\n## 📝 模組概述\n本模組引入了「輕量級資料儲存」概念。學員完成測驗後，網頁會透過 HTTP POST 將學員的姓名、總分、以及詳細的答題選項傳送至 **Google Apps Script (GAS)**，並自動追加寫入到指定的 **Google 試算表**中。\n\n*   **適用場景**：課後成績靜態回收、簡單的人員訓練簽到與考核記錄。\n*   **解決的痛點**：克服 Level 1 關閉網頁即丟失數據的缺點，讓講師能在最熟悉的 Excel 介面中隨時統計成績。\n*   **技術限制**：GAS / 試算表寫入會有約 1~2 秒的同步延遲，當多人同時點擊送出時，可能會因為併發冲突而卡死，因此不適合即時對戰。\n\n---\n\n## 🛠️ 技術實作與程式架構\n\n### 檔案位置\n*   **前端頁面**：`互動式網站/lv2-sheets.html`\n*   **GAS 程式碼**：`互動式網站/gas-code.js`\n\n### 後端 GAS 鎖定防護機制\n為了避免多人同時寫入造成資料覆蓋，我們在 GAS 中加載了 `LockService`：\n```javascript\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(10000); // 鎖定 10 秒以進行排隊寫入\n    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();\n    var data = JSON.parse(e.postData.contents);\n    sheet.appendRow([new Date(), data.nickname, data.score, ...data.answers]);\n    return ContentService.createTextOutput(JSON.stringify({status: 'success'}));\n  } finally {\n    lock.releaseLock(); // 釋放鎖\n  }\n}\n```\n\n---\n\n## 🚀 部署與操作步驟\n\n### 第一步：部署雲端試算表 GAS 後端\n1.  開啟您的 Google 雲端硬碟，建立一個新的 **Google 試算表**。\n2.  點擊選單的「**擴充功能**」 $\\rightarrow$ 「**Apps Script**」。\n3.  將 `互動式網站/gas-code.js` 內容完整複製貼上。\n4.  點擊右上方「**部署**」 $\\rightarrow$ 「**新增部署**」。\n5.  設定部署類型為「**網頁應用程式**」：\n    *   **執行身分**：我 (您的 Google 帳號)\n    *   **誰有權限存取**：任何人 (Anyone)\n6.  點擊「部署」，授權 Google 帳戶後，**複製產生的網頁應用程式 URL**。\n\n### 第二步：配置前端與測試\n1.  在瀏覽器開啟 `互動式網站/lv2-sheets.html`。\n2.  在頁面頂部的「**GAS 部署網頁應用程式 URL**」輸入框中貼上您剛剛複製的 URL（狀態會即時從模擬模式切換為連線模式）。\n3.  輸入「姓名」，勾選測驗題，點擊「**送出測驗並存檔**」。\n4.  回到你的雲端 Google 試算表，你將會看到一列全新的作答紀錄即時追加到最後一行！\n"}, {"title": "Lv3 多人即時連線說明書", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/互動式網站教學說明/Lv3_多人即時連線說明書.md", "content": "# Level 3：多人即時同步連線 - 使用說明書\n\n---\n\n## 📝 模組概述\n本模組重現了三師爸「**互動教學駕駛艙**」的核心多人同步機制。\n將系統完全分離為：\n1.  **講師投影幕端 (Tutor View)**：控制投影片翻頁、推播題目，並在大螢幕上即時以圓形統計圖 (Donut Chart) 累計學生票數。\n2.  **學員答題端 (Student View)**：同步追隨講師投影片，若講師進入測驗，自動彈出答題卡並提交。\n\n*   **解決的痛點**：克服 Google Sheets 等傳統 API 的寫入瓶頸，提供秒級的即時數據處理，避免班級多人同時提交時卡死。\n*   **技術原理**：在正式環境使用 Firebase Firestore 的 `onSnapshot()` WebSocket 連線監聽；在本機環境則使用我們為您寫好的 Node 本機同步伺服器 (`server.js`) 進行資料交換。\n\n---\n\n## 🛠️ 技術實作與程式架構\n\n### 檔案位置\n*   **講師端頁面**：`互動式網站/lv3-tutor.html`\n*   **學員端頁面**：`互動式網站/lv3-student.html`\n*   **同步伺服器**：`互動式網站/server.js`\n\n### 同步運作流程 (Polling Mechanism)\n本機環境下，學員端與講師端每 500 毫秒向本地 Node 服務 `GET /api/class-state` 查詢當前狀態：\n1.  **講師翻頁**：講師在 `lv3-tutor.html` 翻到第 $N$ 頁 $\\rightarrow$ 發送 `POST /api/class-state` 將 `currentSlide` 設為 $N$ $\\rightarrow$ 學員端 `lv3-student.html` 在 500ms 內檢測到變化，自動轉頁。\n2.  **學員提交**：學員提交選項 $\\rightarrow$ 發送 `POST /api/submit-answer` $\\rightarrow$ 伺服器將該選項累加 $\\rightarrow$ 講師端在 500ms 內讀取新數據，**Conic-Gradient 圓餅圖即時動態重繪**。\n\n---\n\n## 🚀 操作測試指南\n\n### 第一步：啟動本機同步伺服器\n打開終端機，執行：\n```bash\nnode server.js\n```\n\n### 第二步：開啟講師端與學員端分頁\n1.  在瀏覽器開啟 **講師端**：[http://localhost:8888/lv3-tutor.html](http://localhost:8888/lv3-tutor.html)\n2.  點擊右上角「**複製學生端連結**」，並開啟一個**無痕視窗分頁**貼上（或使用手機掃描區域網址連線）：[http://localhost:8888/lv3-student.html](http://localhost:8888/lv3-student.html)\n\n### 第三步：測試即時互動效果\n1.  在學員端輸入暱稱（如：小明），點擊進入互動室。此時會顯示「講師正在講授投影片中...」。\n2.  回到講師端，點擊左側選單的「**3. 測驗 Q2: 喜愛的運動**」。\n3.  切回學員端，你會發現畫面**已自動秒級同步跳轉**，並出現 A/B/C 三個答題按鈕。\n4.  在學員端點擊「B) 足球」，點擊送出。學員端會即時出現綠色答對框與詳解。\n5.  此時看向講師端大螢幕，**總票數會立刻從 0 變為 1，圓形圖自動繪製出 B 選項佔比 100% 的區塊**！\n6.  講師可點擊「**重置本題答題**」讓全班重新作答。\n"}, {"title": "Lv4 AI批改與對談說明書", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/互動式網站教學說明/Lv4_AI批改與對談說明書.md", "content": "# Level 4 & Level 5：AI 即時批改與對談 - 使用說明書\n\n---\n\n## 📝 模組概述\n本模組展示了將 **AI 大語言模型 (Gemini API / Groq API)** 導入教學現場的完整架構。\n*   **Level 4 (AI 批改免登入)**：學員撰寫簡答/問答題，提交後後端即時向 AI 發送請求，AI 根據提示詞（規準）給出分數與修改建議，但做完即丟不存檔。\n*   **Level 5 (AI 全端一條龍)**：結合 AI 批改與長期資料庫儲存。AI 的批改分數與分析結果，會自動寫入 Firestore 資料庫中，累積為個人的長期學習歷程。\n*   **對談模式 (Chat Tutor)**：使用多輪對話歷史陣列 (Chat Context)，實現一個具有教學引導性的 AI 技術助教。\n\n---\n\n## 🔒 技術關鍵：後端安全中轉（API Proxy）\n這是本專案最核心的安全防護設計：**絕對不能在瀏覽器前端直接呼叫 API**，否則 API 金鑰 (API Key) 會在 F12 的網路 (Network) 標頭中被學員隨手複製。\n\n本系統的後端安全轉發設計如下：\n```\n[前端瀏覽器] ──(呼叫 /.netlify/functions/groq-chat)──> [Node.js 後端 (server.js)]\n                                                            │\n                                                  (讀取 .env 中的金鑰，中轉)\n                                                            ▼\n                                                     [Groq 官方 API]\n```\n\n---\n\n## 🛠️ 檔案位置與實作\n\n*   **後端代理邏輯**：`互動式網站/server.js` 中的 `/api/groq-chat` 與 `/api/ask-ai` 路由。\n*   **AI 批改問答頁面**：`互動式網站/lv4-netlify-ai.html`\n    *   *提示：在網址後方加入 `?level=5` 參數即可切換為 Level 5 模式，開啟姓名欄位與本地 Firebase 模擬學習歷程日誌。*\n*   **AI 多輪對談頁面**：`互動式網站/chat-tutor.html`\n\n---\n\n## 🚀 測試與操作步驟\n\n### 1. 本地啟動伺服器\n1.  確保 `互動式網站` 根目錄下的 `.env` 配置了 `GROQ_API_KEY` 或 `GEMINI_API_KEY`。\n2.  執行 `node server.js`。\n\n### 2. 測試 AI 簡答題批改\n1.  開啟 [http://localhost:8888/lv4-netlify-ai.html](http://localhost:8888/lv4-netlify-ai.html)。\n2.  在問答題輸入答案（例如：「Level 4用完即忘，Level 5會將評語分數存入Firebase中」）。\n3.  點擊「**提交並由 AI 即時批改**」。\n4.  系統將會回傳由 AI 產生的分數與具體建議。\n\n### 3. 測試 AI 即時對談 (Chat Mode)\n1.  開啟 [http://localhost:8888/chat-tutor.html](http://localhost:8888/chat-tutor.html)。\n2.  在下方輸入問題發送，AI 助教將會進行繁體中文回應，並在每次回答完後，自動提出一個引導性的追問問題以幫助您深造！\n"}, {"title": "README", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/互動式網站教學說明/README.md", "content": "# 互動式教學系統 - 全面操作說明書\n\n本專案是一個基於「用 AI 打造互動教學網頁五個階段」所開發的教學套件本機實作版本。旨在幫助講師/訓練官建立高互動性的數位課堂，提升人員訓練效率。\n\n---\n\n## 📂 專案說明書目錄\n\n我們已將各模組的操作說明進行了拆分整理，您可以點選以下連結查看各等級的詳細程式架構與配置方法：\n\n1. 📖 **[Lv.1 純前端單機版說明書](Lv1_純前端說明書.md)**\n   * 無須伺服器與資料庫，單機即時判定單選題對錯。\n2. 📖 **[Lv.2 Google 試算表連線說明書](Lv2_Google試算表說明書.md)**\n   * 前端 fetch 透過 GAS (Google Apps Script) 後端代理，自動將學員作答紀錄寫入雲端 Google 試算表。\n3. 📖 **[Lv.3 多人即時同步連線說明書](Lv3_多人即時連線說明書.md)**\n   * 「講者大螢幕 (Tutor View)」與「學員答題端 (Student View)」分離，實現秒級同步翻頁與圓餅圖計票結果實時渲染。\n4. 📖 **[Lv.4 & Lv.5 AI 即時批改與對談說明書](Lv4_AI批改與對談說明書.md)**\n   * 後端安全代理 (Serverless) 防護金鑰，串接 Groq/Gemini API 進行問答題批改與多輪語意對話。\n\n---\n\n## 🚀 本地開發伺服器啟動與操作指南\n\n為了讓本地環境的「多人即時連線 (Lv.3)」以及「AI 後端安全代理 (Lv.4)」能正常運作，本專案內置了一個 **零依賴的 Node.js 伺服器 (`server.js`)**。\n\n### 第一步：金鑰配置\n在 `互動式網站` 根目錄下，確認 `.env` 檔案內包含以下金鑰配置：\n```env\nGROQ_API_KEY=gsk_your_groq_key_here\nGEMINI_API_KEY=your_gemini_key_here\n```\n\n### 第二步：啟動本機伺服器\n打開終端機 (PowerShell/CMD)，進入 `互動式網站` 專案目錄，執行以下指令：\n```bash\nnode server.js\n```\n看見 `🚀 本地開發伺服器啟動成功！` 後，代表伺服器已在本地 **Port 8888** 監聽。\n\n### 第三步：開啟瀏覽器操作\n*   **主入口網頁**：`http://localhost:8888/index.html`\n*   **教學駕駛艙 (Lv.3 講者端)**：`http://localhost:8888/lv3-tutor.html`\n*   **學員答題端 (Lv.3 學員端)**：`http://localhost:8888/lv3-student.html`\n*   **AI 安全對談助教**：`http://localhost:8888/chat-tutor.html`\n"}, {"title": "IPAHQ 槽車確認與掃描系統", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/IPAHQ_槽車確認與掃描系統_說明書.md", "content": "# IPAHQ 槽車確認與掃描系統 - 操作說明書\n\n## 專案簡介\n本專案用於鴻勝化學的 IPAHQ 槽車進貨確認與掃描登記，透過條碼掃描防錯，確保卸料車號與採購單一致。\n\n## 主要功能特色\n- **GAS 雲端備份**：自動將槽車確認紀錄寫入 Google 試算表。\n- **本機資料庫連線**：使用 PHP 讀寫 SQL Server / MySQL，將車牌號碼與品管報告（COA）進行防錯匹配。\n- **行動裝置友善**：前端介面針對手持掃描槍與平板進行優化。\n\n## 技術棧\n- HTML5, Vanilla JS, PHP, Google Apps Script (GAS)\n\n## 操作步驟\n1. 確保本地 PHP 環境與 SQL 資料庫已啟動。\n2. 使用平板或掃描槍開啟系統網頁。\n3. 掃描槽車條碼，系統會即時綠燈過關或紅燈警告（代表車號或品名不符）。\n"}, {"title": "IPA 生產排程雙儲槽優化", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/IPA_生產排程雙儲槽優化_說明書.md", "content": "# IPA 生產排程雙儲槽優化 - 操作說明書\n\n## 專案簡介\n本專案針對 IPA 生產排程進行雙儲槽（儲槽 A、儲槽 B）容量分配優化，通過演算法自動計算進出料排程，防止槽體溢流並達到最大產能配置。\n\n## 主要功能特色\n- **雙儲槽容積計算**：實時試算進料流速、出料需求，預測未來 24 小時槽體剩餘容積。\n- **排程建議演算法**：當預測到溢流風險時，自動產生切換儲槽或降載之排程建議。\n- **試算表串接**：支援將試算結果輸出至 Google 試算表或本機 SQL 資料庫。\n\n## 技術棧\n- Python 3, Pandas (資料處理), PHP (網頁前台報表呈現)。\n\n## 操作步驟\n1. 進入 `IPA-生產排程雙儲槽優化` 目錄。\n2. 執行 Python 優化試算指令：\n   ```bash\n   python optimize_schedule.py\n   ```\n3. 打開瀏覽器至本地 PHP 伺服器網頁，即可查閱雙儲槽動態曲線與排程甘特圖。\n"}, {"title": "n系列 GAS轉APK與出貨", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/n系列_GAS轉APK與出貨_說明書.md", "content": "# n系列 GAS 轉 APK 與出貨系統 - 操作說明書\n\n## 專案簡介\n本專案將原本運行於 Google 試算表（GAS）的出貨登錄系統，封裝並轉換為 Android APK 安裝檔，供現場人員配戴手持 Android 掃描器使用，支援離線暫存與批次上傳。\n\n## 主要功能特色\n- **離線工作模式**：在廠區無 Wi-Fi 訊號處可先將掃描資料暫存於本地 SQLite 中。\n- **自動回傳雲端**：當偵測到網路連線時，自動將暫存出貨紀錄批次上傳至 Google Sheets。\n\n## 技術棧\n- Android SDK, Cordova/WebView, SQLite, Google Apps Script (GAS)\n\n## 安裝與操作\n1. 將產出的 `n-series-scanner.apk` 安裝至 Android 掃描槍。\n2. 開啟 App，設定 GAS Web App URL。\n3. 開始掃描出貨，確認完成後點選「批次同步」即可。\n"}, {"title": "N系列 條碼出貨核對與串接", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/N系列_條碼出貨核對與串接_說明書.md", "content": "# N系列 條碼出貨核對與串接 - 操作說明書\n\n## 專案簡介\n本系統專為 N 系列產品出貨設計，現場包裝員透過條碼槍掃描產品條碼，系統自動進行型號與出貨單核對，防止出錯貨。\n\n## 主要功能特色\n- **實時核對**：掃描後立即在畫面比對出貨型號與數量。\n- **API 自動同步**：核對完成後，自動調用 PHP API 將資料回傳至 ERP/MES 系統。\n\n## 技術棧\n- PHP, JavaScript, SQL Database\n\n## 操作步驟\n1. 打開出貨核對網頁。\n2. 掃描出貨單條碼以載入預計出貨清單。\n3. 依序掃描棧板或外箱上的產品條碼，確認完成後按「確認出貨」自動同步後台。\n"}, {"title": "QC 系統客製化電子化工廠", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/QC_系統客製化電子化工廠_說明書.md", "content": "# QC 系統客製化電子化工廠 - 操作說明書\n\n## 專案簡介\n此專案為品管部門客製化的 QC 檢驗結果自動化登錄系統，實現化學品品質檢驗數據與工廠管理系統的對接。\n\n## 主要功能特色\n- **自動防重複登錄**：寫入資料庫時自動比對批號與日期。\n- **數據看板**：實時將合格率、雜質含量以圖表（Chart.js）呈現於中控室螢幕。\n\n## 技術棧\n- PHP, Chart.js, SQL Server\n\n## 操作步驟\n1. QC 檢驗員於檢驗完成後，在網頁輸入產品批號與各項化學檢驗數值。\n2. 點擊「提交」，數據會即時寫入中央資料庫並同步更新在中控看板上。\n"}, {"title": "三合一單 to PHP Migration", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/三合一單_to_PHP_Migration_說明書.md", "content": "# 三合一單 to PHP Migration - 操作說明書\n\n## 專案簡介\n本指南與代碼用於將舊有的「三合一出貨確認單」系統（基於 Excel 巨集與 GAS），遷移至以 PHP + SQL 為架構的本地化工廠中央系統中。\n\n## 主要功能特色\n- **資料庫綱要遷移**：提供 Excel 資料庫化欄位對照表。\n- **PHP 資料匯入 API**：一鍵將歷史 Excel 三合一單轉換為資料庫紀錄。\n\n## 技術棧\n- PHP 8, SQL Server / MySQL\n\n## 遷移與操作步驟\n1. 於資料庫建立資料表（使用 `schema.sql`）。\n2. 將歷史 Excel 檔案放入 `import` 資料夾，並執行 `php import.php` 進行資料導入。\n"}, {"title": "軟管 KeyCode 管理優化方案", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/軟管_KeyCode_管理優化方案_說明書.md", "content": "# 軟管 Key-Code 管理優化方案 - 操作說明書\n\n## 專案簡介\n本方案針對鴻勝化學現場各製程管線的「軟管金鑰防錯編碼 (Key-Code)」進行條碼化與資料庫化管理，杜絕人工接錯管路的風險。\n\n## 主要功能特色\n- **管線編碼自動對應**：系統登錄每一條軟管的防呆編碼與適用槽體。\n- **警示燈號防錯**：當現場掃描時接頭 Key-Code 不匹配，立即在大螢幕發出紅燈警告。\n\n## 技術棧\n- HTML5, Javascript, PHP API\n\n## 操作步驟\n1. 進入 `軟管-Key-Code-管理優化方案` 網頁。\n2. 進行軟管配對掃描，確保畫面上顯示「匹配成功（綠燈）」再進行閥門開拓。\n"}, {"title": "clasp netlify mcp guide", "category": "第三類 AI代理與指南企劃", "path": "第三類_AI代理與指南企劃/clasp_netlify_mcp_guide_說明書.md", "content": "# Clasp + Netlify 部署指南 - 操作說明書\n\n## 專案簡介\n本專案提供標準安裝與部署指南，指導 AI Agent 如何將網頁前端自動部署至 Netlify，並將後端 Apps Script 透過 Google clasp 工具同步，實現無縫的雲端備份與部署。\n\n## 主要功能特色\n- **自動化 clasp 設定**：包含 `.clasp.json` 設定範例，防範 AI 部署權限錯誤。\n- **Netlify CLI 自動發布**：提供一鍵建置前端並發布至 Netlify 託管空間的腳本。\n\n## 技術棧\n- Node.js, @google/clasp, Netlify CLI\n\n## 操作步驟\n1. 參考說明書中的命令，安裝並登入 clasp：\n   ```bash\n   npm install -g @google/clasp\n   clasp login\n   ```\n2. 執行 `clasp push` 將 GAS 代碼推送到雲端試算表。\n3. 執行 `netlify deploy --prod` 發布前端網頁。\n"}, {"title": "claude html slide builder", "category": "第三類 AI代理與指南企劃", "path": "第三類_AI代理與指南企劃/claude_html_slide_builder_說明書.md", "content": "# Claude HTML Slide Builder - 操作說明書\n\n## 專案簡介\n此工具為專門設計給 Claude Code/Antigravity 使用的 Skill，能將純文字教材或教學大綱，自動重構並轉換為 Reveal.js 的互動式網頁簡報。\n\n## 主要功能特色\n- **Reveal.js 簡報框架**：自動配置翻頁動畫、程式碼高亮、與響應式排版。\n- **動態文字雲**：整合 wordcloud2.js 渲染即時問卷結果。\n- **GitHub Actions 自動部署**：簡報產出後，可自動打包並發布至 GitHub Pages。\n\n## 技術棧\n- Python 3, Reveal.js, wordcloud2.js\n\n## 操作步驟\n1. 將純文字教材放入 `input.txt`。\n2. 執行 Python 簡報建置腳本：\n   ```bash\n   python build_slides.py\n   ```\n3. 產出的簡報檔案為 `index.html`，可直接使用瀏覽器播放。\n"}, {"title": "Google Classroom anget", "category": "第三類 AI代理與指南企劃", "path": "第三類_AI代理與指南企劃/Google_Classroom_anget_說明書.md", "content": "# Google Classroom Agent - 操作說明書\n\n## 專案簡介\n本專案為一個自動化 AI 代理服務，串接 Google Classroom API，能協助講師自動發布作業、管理學員作答、並自動批改上傳作業。\n\n## 主要功能特色\n- **Classroom 自動發課**：支援以 API 批次建立課程單元。\n- **作業監控**：自動輪詢（Poll）學員繳交狀態，並在繳交時觸發 AI 進行初步評分。\n\n## 技術棧\n- Node.js, Google Classroom API, Google OAuth 2.0\n\n## 操作步驟\n1. 在專案目錄下配置 `credentials.json` (從 Google Cloud Console 申請)。\n2. 本地執行：\n   ```bash\n   node server.js\n   ```\n3. 瀏覽器開啟 `http://localhost:3000` 進行 Google 帳號授權，即可啟動自動化管理。\n"}, {"title": "grad trip 畢業旅行與簡報企劃", "category": "第三類 AI代理與指南企劃", "path": "第三類_AI代理與指南企劃/grad_trip_畢業旅行與簡報企劃_說明書.md", "content": "# 畢業旅行與簡報企劃 (grad-trip) - 操作說明書\n\n## 專案簡介\n本專案用於生成國小畢旅二天一夜回憶錄的互動式電子書網頁與配音影片合成。\n\n## 主要功能特色\n- **配音語音合成**：使用 Python 腳本將段落文字合成語音 Mp3 檔。\n- **影片與音訊混音**：提供 `mux_video.py` 與 `merge_audio.py`，使用 FFmpeg 自動將背景音樂與旁白配音進行混音，並與旅遊照片序列合成為最終 MP4 影片。\n\n## 技術棧\n- Python (edge-tts), FFmpeg, HTML5 (電子書展示)\n\n## 操作步驟\n1. 進入 `grad-trip` 目錄。\n2. 執行 `python generate_narration.py` 產出旁白配音檔。\n3. 執行 `python mux_video.py` 生成回憶錄 MP4 影片（已透過 .gitignore 排除大檔，影片會保留在本地 `grad-trip/renders/` 下）。\n"}, {"title": "padlet board 留言板操作說明書", "category": "第三類 AI代理與指南企劃", "path": "第三類_AI代理與指南企劃/padlet_board_留言板操作說明書.md", "content": "# Padlet 留言板系統 - 操作說明書\n\n## 專案簡介\n此專案實作了一個類 Padlet 風格的互動看板系統，使用者可以在板上自由新增便利貼、留言、與進行拖曳排版。\n\n## 主要功能特色\n- **互動便利貼**：支援新增、編輯、刪除便利貼，並可為便利貼自訂顏色。\n- **拖曳排列**：支援拖曳操作，卡片位置會自動儲存於本地暫存。\n\n## 技術棧\n- HTML5, CSS3, JavaScript (Drag and Drop API)\n\n## 操作步驟\n1. 雙擊 `padlet-board/留言板操作說明書.md` 查看詳細手冊。\n2. 開啟 `padlet-board/index.html` 即可在瀏覽器上操作留言板。\n"}, {"title": "保養品 客服聊天機器人", "category": "第三類 AI代理與指南企劃", "path": "第三類_AI代理與指南企劃/保養品_客服聊天機器人_說明書.md", "content": "# 保養品 客服聊天機器人 - 操作說明書\n\n## 專案簡介\n本專案為保養品智能客服問答與商品推薦機器人，能引導顧客進行肌膚檢測，並基於 Gemini/Groq API 進行個性化的保養品搭配推薦。\n\n## 主要功能特色\n- **多輪肌膚對談**：引導式問答（乾性/油性肌膚、敏感程度等）。\n- **商品知識庫檢索**：自動比對後台商品清單進行精準推薦。\n\n## 技術棧\n- HTML, CSS, JavaScript, Gemini API / Groq API\n\n## 操作步驟\n1. 於 `保養品` 目錄下開啟 `index.html`。\n2. 在交談視窗中輸入如：「我的皮膚很容易出油，有沒有推薦的保養品？」，機器人會自動引導分析並推薦產品。\n"}, {"title": "🎬 [投影片] 第一類 成果展示", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/第一類_成果展示.html", "content": "# 第一類 核心網頁與互動系統 - 成果展示簡報\\n\\n> [!TIP]\\n> **適合對象：** 公司內部主管、同事與合作夥伴\\n> **簡報風格：** 專業、數據導向，強調解決的工廠痛點與商業價值。\\n> **色調：** 科技藍青色系\\n\\n### 🔗 簡報連結\\n[👉 點此在全新分頁開啟互動式投影片](第一類_核心網頁與互動系統/第一類_成果展示.html)\\n\\n### 📺 錄製與簡報建議\\n1. 打開簡報後按 **F** 鍵可進入全螢幕模式。\\n2. 使用鍵盤左右方向鍵（`←` `→`）或空白鍵（`Space`）控制翻頁。\\n3. 可搭配錄影軟體（如 OBS 或 Xbox Game Bar）進行畫面錄製，對應旁白可參考本機 [影片腳本大綱.md](file:///C:/Users/C606/.gemini/antigravity/brain/01387643-0e54-43ef-88be-9cd57f6ff744/%E5%BD%B1%E7%89%87%E8%85%B3%E6%9C%AC%E5%A4%A7%E7%B6%B1.md)。"}, {"title": "📝 [投影片] 第一類 學習歷程", "category": "第一類 核心網頁與互動系統", "path": "第一類_核心網頁與互動系統/第一類_學習歷程.html", "content": "# 第一類 核心網頁與互動系統 - 個人學習歷程\\n\\n> [!NOTE]\\n> **適合對象：** 個人技術成長記錄、學習歷程檔案\\n> **簡報風格：** 第一人稱敘事，著重技術掙扎、突破點與個人成長心路歷程。\\n> **色調：** 暖色系紫粉色調\\n\\n### 🔗 簡報連結\\n[👉 點此在全新分頁開啟互動式投影片](第一類_核心網頁與互動系統/第一類_學習歷程.html)\\n\\n### 📺 錄製與簡報建議\\n1. 打開簡報後按 **F** 鍵可進入全螢幕模式。\\n2. 使用鍵盤左右方向鍵（`←` `→`）或空白鍵（`Space`）控制翻頁。\\n3. 可搭配錄影軟體（如 OBS 或 Xbox Game Bar）進行畫面錄製，對應旁白可參考本機 [影片腳本大綱.md](file:///C:/Users/C606/.gemini/antigravity/brain/01387643-0e54-43ef-88be-9cd57f6ff744/%E5%BD%B1%E7%89%87%E8%85%B3%E6%9C%AC%E5%A4%A7%E7%B6%B1.md)。"}, {"title": "🎬 [投影片] 第二類 成果展示", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/第二類_成果展示.html", "content": "# 第二類 生產管理與API串接 - 成果展示簡報\\n\\n> [!TIP]\\n> **適合對象：** 公司內部主管、同事與合作夥伴\\n> **簡報風格：** 強調現場管理防錯件數、作業流程自動化效率提升等數據指標。\\n> **色調：** 工業感綠橙色系\\n\\n### 🔗 簡報連結\\n[👉 點此在全新分頁開啟互動式投影片](第二類_生產管理與API串接/第二類_成果展示.html)\\n\\n### 📺 錄製與簡報建議\\n1. 打開簡報後按 **F** 鍵可進入全螢幕模式。\\n2. 使用鍵盤左右方向鍵（`←` `→`）或空白鍵（`Space`）控制翻頁。\\n3. 可搭配錄影軟體（如 OBS 或 Xbox Game Bar）進行畫面錄製，對應旁白可參考本機 [影片腳本大綱.md](file:///C:/Users/C606/.gemini/antigravity/brain/01387643-0e54-43ef-88be-9cd57f6ff744/%E5%BD%B1%E7%89%87%E8%85%B3%E6%9C%AC%E5%A4%A7%E7%B6%B1.md)。"}, {"title": "📝 [投影片] 第二類 學習歷程", "category": "第二類 生產管理與API串接", "path": "第二類_生產管理與API串接/第二類_學習歷程.html", "content": "# 第二類 生產管理與API串接 - 個人學習歷程\\n\\n         // 簡易的 Markdown 轉 HTML 解析器（支援 Offline/CORS 免伺服器）
        function parseMarkdown(md) {
            let html = md;

            // 處理代碼塊
            html = html.replace(/```(\w*)\n([\s\S]*?)\n```/g, function(match, lang, code) {
                const escapedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<pre><code>${escapedCode}</code><button class="copy-code-btn" onclick="copyCode(this)">複製</button></pre>`;
            });

            // 處理行內代碼
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 處理 Alerts (> [!NOTE], > [!TIP], > [!WARNING])
            html = html.replace(/> \[!(NOTE|TIP|WARNING)\]\n([\s\S]*?)(?=\n\n|\n[^>])/g, function(match, type, content) {
                const cleanContent = content.replace(/^>\s?/gm, '').trim();
                return `<div class="alert alert-${type.toLowerCase()}">
                    <div class="alert-title">🔔 ${type}</div>
                    <div>${cleanContent}</div>
                </div>`;
            });

            // 處理標題
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');

            // 處理粗體
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // 處理超連結
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color: var(--primary);">$1</a>');

            // 處理清單 (項目符號)
            html = html.replace(/^[-*]\s+(.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            // 合併相鄰的 <ul>
            html = html.replace(/<\/ul>\s*<ul>/gim, '');

            // 處理段落
            html = html.replace(/^(?!<[h|u|l|p|b|d|a|c])(.*$)/gim, '<p>$1</p>');
            // 清理多餘的空白段落
            html = html.replace(/<p><\/p>/g, '');

            return html;
        }

        // 渲染選單清單
        function renderMenu(list) {
            const menuArea = document.getElementById("menuArea");
            menuArea.innerHTML = "";

            // 將資料按類別分組
            const groups = {};
            list.forEach(item => {
                if (!groups[item.category]) {
                    groups[item.category] = [];
                }
                groups[item.category].push(item);
            });

            // 依序建立類別 HTML
            for (const [catName, items] of Object.entries(groups)) {
                const groupDiv = document.createElement("div");
                groupDiv.className = "category-group";
                
                const header = document.createElement("div");
                header.className = "category-header";
                header.innerText = catName;
                groupDiv.appendChild(header);

                const ul = document.createElement("ul");
                ul.className = "doc-list";

                items.forEach(item => {
                    const li = document.createElement("li");
                    const btn = document.createElement("button");
                    btn.className = "doc-item-btn";
                    btn.innerText = item.title;
                    btn.onclick = () => selectManual(item, btn);
                    li.appendChild(btn);
                    ul.appendChild(li);
                });

                groupDiv.appendChild(ul);
                menuArea.appendChild(groupDiv);
            }
        }

        let activeBtn = null;

        // 選取並閱讀說明書
        function selectManual(item, btn) {
            if (activeBtn) activeBtn.classList.remove("active");
            btn.classList.add("active");
            activeBtn = btn;

            document.getElementById("welcomeScreen").style.display = "none";
            document.getElementById("readerHeader").style.display = "flex";
            document.getElementById("readerContent").style.display = "block";

            document.getElementById("readerCategory").innerText = item.category;
            document.getElementById("readerTitle").innerText = item.title;
            
            const contentArea = document.getElementById("renderedMarkdown");
            contentArea.innerHTML = parseMarkdown(item.content);
        }

        // 模糊搜尋處理
        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            if (!query) {
                renderMenu(manualsData);
                return;
            }

            const filtered = manualsData.filter(item => {
                return item.title.toLowerCase().includes(query) || 
                       item.category.toLowerCase().includes(query) || 
                       item.content.toLowerCase().includes(query);
            });

            renderMenu(filtered);
        }

        // 複製代碼邏輯
        function copyCode(btn) {
            const codeBlock = btn.previousElementSibling;
            const text = codeBlock.innerText;

            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "已複製！";
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            }).catch(err => {
                console.error("無法複製代碼: ", err);
            });
        }

        // 初始化加載
        renderMenu(manualsData);
    </script>
</body>
</html>
