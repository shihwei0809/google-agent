<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混合調合與充填製程流程圖 (Mixing & Filling PFD)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --pipe-color: #38bdf8;
      --pipe-glow: rgba(56, 189, 248, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, var(--bg-dark) 80%);
      color: var(--text-main);
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .title-box h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-box p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-main);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--pipe-color);
      transform: translateY(-1px);
    }

    .btn.active {
      background: var(--pipe-color);
      color: #04121d;
      border-color: var(--pipe-color);
      box-shadow: 0 0 16px var(--pipe-glow);
    }

    /* Main Canvas Layout */
    .viewport {
      flex: 1;
      position: relative;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .canvas-container {
      width: 100%;
      max-width: 1380px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    /* SVG Base & Pipes */
    svg.pfd-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4));
    }

    /* SVG interactive classes */
    .pipe-line {
      stroke: var(--pipe-color);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 0 6px var(--pipe-glow));
    }

    .pipe-glow-pulse {
      stroke-dasharray: 10 14;
      animation: pipeFlow 1.4s linear infinite;
    }

    @keyframes pipeFlow {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }

    .interactive-equipment {
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .interactive-equipment:hover {
      filter: brightness(1.2) drop-shadow(0 0 14px rgba(56, 189, 248, 0.4));
    }

    /* Check Point Triangle Badge */
    .cp-group {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cp-group:hover {
      transform: scale(1.22);
    }

    .cp-group polygon {
      fill: var(--accent-red);
      stroke: #ffffff;
      stroke-width: 1.5;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8));
      animation: cpBlink 2.5s infinite ease-in-out;
    }

    @keyframes cpBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    /* Detail Modal Drawer */
    .drawer {
      position: fixed;
      right: 24px;
      top: 90px;
      width: 380px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      padding: 20px;
      z-index: 100;
      transform: translateX(420px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: #fff;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }

    .data-table th, .data-table td {
      padding: 8px 10px;
      text-align: left;
    }

    .data-table th {
      color: var(--text-sub);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .data-table td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: 'JetBrains Mono', monospace;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-pass { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-info { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

    /* Control strip */
    .controls-bar {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.7);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 1380px;
      align-items: center;
      justify-content: space-between;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .slider-group input[type="range"] {
      width: 140px;
      accent-color: var(--pipe-color);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>
        <span style="color: var(--accent-cyan);">⚗️</span> 混合調合與充填製程流程圖
        <span style="font-size: 12px; font-weight: normal; background: rgba(6, 182, 212, 0.15); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 2px 8px; border-radius: 4px;">PFD 互動元件</span>
      </h1>
      <p>RM-A~E 批次進料檢驗(IQC) ➔ Mixing Tank 混合槽 ➔ IPQC小循環/充填大循環 ➔ Drum 充填封裝</p>
    </div>
    <div class="toolbar">
      <button class="btn active" id="btnAnimToggle" onclick="toggleFlowAnimation()">
        <span>🌊 管線流動動態: 開啟</span>
      </button>
      <button class="btn" id="btnModeCycle" onclick="setFlowMode('cycle')">
        <span>🔄 IPQC 小循環模式</span>
      </button>
      <button class="btn" id="btnModeFill" onclick="setFlowMode('fill')">
        <span>📦 充填出貨模式</span>
      </button>
      <button class="btn" onclick="resetTankLevels()">
        <span>🔁 重置液位</span>
      </button>
    </div>
  </header>

  <div class="viewport">
    <div class="canvas-container">
      <svg class="pfd-svg" viewBox="0 0 1280 640">
        <defs>
          <!-- Gradients for 2.5D equipment -->
          <linearGradient id="tankYellowGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="50%" stop-color="#fde047"/>
            <stop offset="100%" stop-color="#eab308"/>
          </linearGradient>

          <linearGradient id="tankYellowTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fef9c3"/>
            <stop offset="100%" stop-color="#fde047"/>
          </linearGradient>

          <linearGradient id="tankBlueSide" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </linearGradient>

          <linearGradient id="tankBlueTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7dd3fc"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>

          <linearGradient id="mixingTankGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#64748b"/>
            <stop offset="35%" stop-color="#475569"/>
            <stop offset="70%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
          </linearGradient>

          <linearGradient id="mixingTankTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#64748b"/>
          </linearGradient>

          <linearGradient id="filterGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="50%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
          </linearGradient>

          <!-- Marker Arrow -->
          <marker id="arrowHead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <polygon points="0 0, 7 3.5, 0 7" fill="#38bdf8" />
          </marker>
        </defs>

        <!-- ================= PIPELINES (Behind Equipment) ================= -->
        <!-- RM-A pipe -->
        <path id="pipe-rm-a" class="pipe-line pipe-glow-pulse" d="M 390 145 L 445 145 L 445 200 L 520 200" marker-end="url(#arrowHead)"/>

        <!-- RM-E pipe -->
        <path id="pipe-rm-e" class="pipe-line pipe-glow-pulse" d="M 260 290 L 535 290" marker-end="url(#arrowHead)"/>

        <!-- RM-B/C/D pipes into Mixing Tank -->
        <path id="pipe-rm-b" class="pipe-line pipe-glow-pulse" d="M 250 370 L 250 330 L 535 330" marker-end="url(#arrowHead)"/>
        <path id="pipe-rm-c" class="pipe-line pipe-glow-pulse" d="M 350 370 L 350 345 L 535 345" marker-end="url(#arrowHead)"/>
        <path id="pipe-rm-d" class="pipe-line pipe-glow-pulse" d="M 450 370 L 450 360 L 535 360" marker-end="url(#arrowHead)"/>

        <!-- Main Outflow from Mixing Tank -->
        <path id="pipe-mix-out" class="pipe-line pipe-glow-pulse" d="M 740 360 L 980 360" marker-end="url(#arrowHead)"/>

        <!-- Small Loop (IPQC 小循環) -->
        <path id="pipe-loop-small" class="pipe-line pipe-glow-pulse" d="M 775 360 L 775 250 L 742 250" marker-end="url(#arrowHead)"/>

        <!-- Big Loop (充填口大循環回流) -->
        <path id="pipe-loop-big" class="pipe-line pipe-glow-pulse" d="M 915 360 L 915 240 L 742 240" marker-end="url(#arrowHead)"/>

        <!-- ================= EQUIPMENT (2.5D Isometric SVG) ================= -->

        <!-- 1. RM-A (3D Isometric Box) -->
        <g class="interactive-equipment" id="eq-rm-a" onclick="showEquipmentDetail('RM-A')">
          <!-- Back & Top Faces -->
          <polygon points="180,95 320,95 355,60 215,60" fill="url(#tankYellowTop)" stroke="#ca8a04" stroke-width="2"/>
          <polygon points="320,95 355,60 355,145 320,180" fill="#ca8a04" stroke="#a16207" stroke-width="2"/>
          <!-- Front Face -->
          <rect x="180" y="95" width="140" height="85" fill="url(#tankYellowGrad)" stroke="#ca8a04" stroke-width="2" rx="4"/>
          <!-- Label -->
          <text x="250" y="145" font-size="22" font-weight="700" fill="#713f12" text-anchor="middle" font-family="'JetBrains Mono', monospace">RM-A</text>
          <text x="250" y="165" font-size="11" font-weight="600" fill="#854d0e" text-anchor="middle">固態/濃縮主原料</text>
          <!-- Discharge Box / Valve -->
          <rect x="345" y="135" width="16" height="20" fill="#475569" stroke="#94a3b8" rx="2"/>
        </g>

        <!-- 2. RM-E (Small White/Silver Tank) -->
        <g class="interactive-equipment" id="eq-rm-e" onclick="showEquipmentDetail('RM-E')">
          <ellipse cx="225" cy="285" rx="35" ry="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
          <path d="M 190 285 v 25 a 35 12 0 0 0 70 0 v -25 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
          <ellipse cx="225" cy="285" rx="35" ry="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
          <text x="225" y="298" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="'JetBrains Mono'">RM-E</text>
        </g>

        <!-- 3. RM-B, RM-C, RM-D (Blue Cylindrical Drums) -->
        <!-- RM-B -->
        <g class="interactive-equipment" id="eq-rm-b" onclick="showEquipmentDetail('RM-B')">
          <path d="M 210 440 v 60 a 40 16 0 0 0 80 0 v -60 Z" fill="url(#tankBlueSide)" stroke="#0284c7" stroke-width="1.5"/>
          <ellipse cx="250" cy="440" rx="40" ry="16" fill="url(#tankBlueTop)" stroke="#38bdf8" stroke-width="1.5"/>
          <!-- Top Port -->
          <rect x="242" y="415" width="16" height="15" fill="#475569" stroke="#94a3b8" rx="2"/>
          <text x="250" y="480" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'JetBrains Mono'">RM-B</text>
          <text x="250" y="525" font-size="11" fill="#bae6fd" text-anchor="middle">輔料 B</text>
        </g>

        <!-- RM-C -->
        <g class="interactive-equipment" id="eq-rm-c" onclick="showEquipmentDetail('RM-C')">
          <path d="M 310 440 v 60 a 40 16 0 0 0 80 0 v -60 Z" fill="url(#tankBlueSide)" stroke="#0284c7" stroke-width="1.5"/>
          <ellipse cx="350" cy="440" rx="40" ry="16" fill="url(#tankBlueTop)" stroke="#38bdf8" stroke-width="1.5"/>
          <!-- Top Port -->
          <rect x="342" y="415" width="16" height="15" fill="#475569" stroke="#94a3b8" rx="2"/>
          <text x="350" y="480" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'JetBrains Mono'">RM-C</text>
          <text x="350" y="525" font-size="11" fill="#bae6fd" text-anchor="middle">輔料 C</text>
        </g>

        <!-- RM-D -->
        <g class="interactive-equipment" id="eq-rm-d" onclick="showEquipmentDetail('RM-D')">
          <path d="M 410 440 v 60 a 40 16 0 0 0 80 0 v -60 Z" fill="url(#tankBlueSide)" stroke="#0284c7" stroke-width="1.5"/>
          <ellipse cx="450" cy="440" rx="40" ry="16" fill="url(#tankBlueTop)" stroke="#38bdf8" stroke-width="1.5"/>
          <!-- Top Port -->
          <rect x="442" y="415" width="16" height="15" fill="#475569" stroke="#94a3b8" rx="2"/>
          <text x="450" y="480" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'JetBrains Mono'">RM-D</text>
          <text x="450" y="525" font-size="11" fill="#bae6fd" text-anchor="middle">輔料 D</text>
        </g>

        <!-- 4. Mixing Tank (Central Heavy Vessel) -->
        <g class="interactive-equipment" id="eq-mixing-tank" onclick="showEquipmentDetail('Mixing Tank')">
          <!-- Cylinder Base -->
          <path d="M 535 240 v 170 a 105 38 0 0 0 210 0 v -170 Z" fill="url(#mixingTankGrad)" stroke="#475569" stroke-width="2.5"/>
          <!-- Cylinder Top -->
          <ellipse cx="640" cy="240" rx="105" ry="38" fill="url(#mixingTankTop)" stroke="#64748b" stroke-width="2"/>
          
          <!-- Liquid Level Overlay (dynamic height) -->
          <clipPath id="mixClip">
            <path d="M 535 240 v 170 a 105 38 0 0 0 210 0 v -170 Z"/>
          </clipPath>
          <rect id="mixLiquidLevel" x="535" y="310" width="210" height="130" fill="rgba(6, 182, 212, 0.25)" clip-path="url(#mixClip)"/>

          <!-- Agitator Motor on Top -->
          <rect x="625" y="185" width="30" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
          <line x1="640" y1="215" x2="640" y2="240" stroke="#cbd5e1" stroke-width="4"/>

          <!-- Title Text -->
          <text x="640" y="325" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'JetBrains Mono', sans-serif">Mixing Tank</text>
          <text id="mixLevelPct" x="640" y="350" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">液位: 68% (170 KL)</text>
        </g>

        <!-- 5. Filters (3 Cartridge Group) -->
        <g class="interactive-equipment" id="eq-filters" onclick="showEquipmentDetail('3-Stage Filters')">
          <g transform="translate(805, 335)">
            <!-- Filter 1 -->
            <rect x="0" y="0" width="18" height="32" rx="4" fill="url(#filterGrad)" stroke="#94a3b8" stroke-width="1.5"/>
            <!-- Filter 2 -->
            <rect x="22" y="0" width="18" height="32" rx="4" fill="url(#filterGrad)" stroke="#94a3b8" stroke-width="1.5"/>
            <!-- Filter 3 -->
            <rect x="44" y="0" width="18" height="32" rx="4" fill="url(#filterGrad)" stroke="#94a3b8" stroke-width="1.5"/>
            <text x="31" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">精密濾心組</text>
          </g>
        </g>

        <!-- 6. Drums / Pallet Filling Station -->
        <g class="interactive-equipment" id="eq-drum-filling" onclick="showEquipmentDetail('Drum Filling')">
          <!-- Green Wooden Pallet -->
          <polygon points="1030,380 1190,380 1220,330 1060,330" fill="#15803d" stroke="#166534" stroke-width="2"/>
          <polygon points="1030,380 1030,395 1190,395 1190,380" fill="#14532d"/>

          <!-- 4 Finished Blue Drums on Pallet (2x2) -->
          <!-- Rear Drum 1 -->
          <path d="M 1070 260 v 40 a 20 8 0 0 0 40 0 v -40 Z" fill="#0284c7" opacity="0.85"/>
          <ellipse cx="1090" cy="260" rx="20" ry="8" fill="#38bdf8" opacity="0.85"/>
          <!-- Rear Drum 2 -->
          <path d="M 1120 260 v 40 a 20 8 0 0 0 40 0 v -40 Z" fill="#0284c7" opacity="0.85"/>
          <ellipse cx="1140" cy="260" rx="20" ry="8" fill="#38bdf8" opacity="0.85"/>

          <!-- Front Drum 1 -->
          <path d="M 1055 285 v 45 a 22 9 0 0 0 44 0 v -45 Z" fill="url(#tankBlueSide)" stroke="#0369a1"/>
          <ellipse cx="1077" cy="285" rx="22" ry="9" fill="url(#tankBlueTop)" stroke="#38bdf8"/>
          <!-- Front Drum 2 -->
          <path d="M 1110 285 v 45 a 22 9 0 0 0 44 0 v -45 Z" fill="url(#tankBlueSide)" stroke="#0369a1"/>
          <ellipse cx="1132" cy="285" rx="22" ry="9" fill="url(#tankBlueTop)" stroke="#38bdf8"/>

          <text x="1115" y="420" font-size="15" font-weight="700" fill="#f43f5e" text-anchor="middle">Drum 反壓:(前中後)</text>
          <text x="1005" y="335" font-size="15" font-weight="700" fill="#f8fafc">Filling</text>
        </g>

        <!-- ================= CHECK POINTS (Red Triangles + Annotation Labels) ================= -->

        <!-- Check Point 1: RM-A -->
        <g class="cp-group" onclick="showCpDetail('CP-1', 'RM-A 進料品質檢驗', '每月檢: Metal\n每批檢: 水阻值')">
          <polygon points="295,200 310,225 280,225" />
          <text x="320" y="210" font-size="13" font-weight="700" fill="#1d4ed8">每月檢: Metal</text>
          <text x="320" y="228" font-size="13" font-weight="700" fill="#1d4ed8">每批檢: 水阻值</text>
        </g>

        <!-- Check Point 2: RM-E -->
        <g class="cp-group" onclick="showCpDetail('CP-2', 'RM-E IQC 入料批次檢驗', 'IQC: (by batch)\n1. Metal')">
          <polygon points="175,320 190,345 160,345" />
          <text x="145" y="270" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">IQC: (by batch)</text>
          <text x="145" y="288" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">1. Metal</text>
        </g>

        <!-- Check Point 3: RM-B, C, D (IQC) -->
        <g class="cp-group" onclick="showCpDetail('CP-3', 'RM-B 入料檢驗', 'IQC:(by batch)\n1. Assay\n2. Metal')">
          <polygon points="250,545 262,568 238,568" />
          <text x="250" y="585" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">IQC:(by batch)</text>
          <text x="250" y="600" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Assay</text>
          <text x="250" y="615" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">2. Metal</text>
        </g>

        <g class="cp-group" onclick="showCpDetail('CP-4', 'RM-C 入料檢驗', 'IQC:(by batch)\n1. Assay\n2. Metal')">
          <polygon points="350,545 362,568 338,568" />
          <text x="350" y="585" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">IQC:(by batch)</text>
          <text x="350" y="600" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Assay</text>
          <text x="350" y="615" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">2. Metal</text>
        </g>

        <g class="cp-group" onclick="showCpDetail('CP-5', 'RM-D 入料檢驗', 'IQC:(by batch)\n1. Assay\n2. Metal')">
          <polygon points="450,545 462,568 438,568" />
          <text x="450" y="585" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">IQC:(by batch)</text>
          <text x="450" y="600" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Assay</text>
          <text x="450" y="615" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">2. Metal</text>
        </g>

        <!-- Check Point 6: IPQC 小循環 -->
        <g class="cp-group" onclick="showCpDetail('CP-6', 'IPQC 製程小循環取樣點', 'IPQC(小循環):\n1. 混合均勻度檢測\n2. 折光率/比重\n3. 黏度測定')">
          <polygon points="695,385 710,410 680,410" />
          <text x="670" y="430" font-size="14" font-weight="700" fill="#dc2626">IPQC(小循環):</text>
        </g>

        <!-- Check Point 7: 充填口大循環 -->
        <g class="cp-group" onclick="showCpDetail('CP-7', '充填口大循環檢驗點', '充填口(大循環):\n1. 顆粒數 (Particle Count)\n2. 微量金屬雜質 (ppb)\n3. 充填溫控監控')">
          <text x="915" y="220" font-size="14" font-weight="700" fill="#dc2626">充填口(大循環):</text>
          <polygon points="825,385 840,410 810,410" />
        </g>

        <!-- Check Point 8: Drum 充填區反壓點 -->
        <g class="cp-group" onclick="showCpDetail('CP-8', 'Drum 反壓檢驗 (前中後)', 'Drum反壓:(前中後):\n前段: 首桶取樣全分析\n中段: 氣密與反壓監控\n後段: 尾桶金屬與水分複查')">
          <polygon points="865,370 878,392 852,392" />
          <polygon points="1115,440 1128,462 1102,462" />
        </g>

        <!-- Legend (圖例) in bottom left -->
        <g transform="translate(30, 610)">
          <polygon points="12,-5 20,8 4,8" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
          <text x="28" y="6" font-size="13" font-weight="700" fill="#dc2626">Check Point (檢驗控制點 - 點擊看檢驗項目)</text>
        </g>

      </svg>
    </div>

    <!-- Quick Control Strip -->
    <div class="controls-bar">
      <div class="slider-group">
        <label>Mixing Tank 模擬液位:</label>
        <input type="range" id="mixLevelRange" min="0" max="100" value="68" oninput="updateMixingLevel(this.value)">
        <span id="rangeVal" style="font-family: 'JetBrains Mono'; color: var(--accent-cyan); font-weight: 700;">68%</span>
      </div>
      <div style="font-size: 13px; color: var(--text-sub);">
        💡 提示：點擊任何<strong>設備槽體</strong>或<strong>紅色 Check Point 三角形</strong>可開啟檢驗規範與參數抽屜
      </div>
    </div>
  </div>

  <!-- Interactive Detail Drawer -->
  <div class="drawer" id="infoDrawer">
    <div class="drawer-header">
      <div class="drawer-title" id="drawerTitle">檢驗點詳情</div>
      <button class="close-btn" onclick="closeDrawer()">&times;</button>
    </div>
    <div id="drawerBody">
      <!-- Dynamic Content -->
    </div>
  </div>

  <script>
    let isFlowing = true;
    let currentMode = 'all'; // all, cycle, fill

    function toggleFlowAnimation() {
      isFlowing = !isFlowing;
      const pipes = document.querySelectorAll('.pipe-line');
      const btn = document.getElementById('btnAnimToggle');
      pipes.forEach(p => {
        if (isFlowing) {
          p.classList.add('pipe-glow-pulse');
        } else {
          p.classList.remove('pipe-glow-pulse');
        }
      });
      btn.innerHTML = isFlowing ? '<span>🌊 管線流動動態: 開啟</span>' : '<span>⏸️ 管線流動動態: 暫停</span>';
      btn.classList.toggle('active', isFlowing);
    }

    function setFlowMode(mode) {
      currentMode = mode;
      const btnCycle = document.getElementById('btnModeCycle');
      const btnFill = document.getElementById('btnModeFill');

      const pSmall = document.getElementById('pipe-loop-small');
      const pBig = document.getElementById('pipe-loop-big');
      const pOut = document.getElementById('pipe-mix-out');

      if (mode === 'cycle') {
        btnCycle.classList.add('active');
        btnFill.classList.remove('active');
        pSmall.style.stroke = '#38bdf8';
        pBig.style.stroke = 'rgba(56, 189, 248, 0.2)';
        pOut.style.stroke = 'rgba(56, 189, 248, 0.2)';
        showCpDetail('MODE-CYCLE', 'IPQC 小循環循環狀態', '目前處於小循環配方混勻狀態。\n混合液經泵浦抽出後直接打回 Mixing Tank，確保調合物料充分均質化。');
      } else if (mode === 'fill') {
        btnCycle.classList.remove('active');
        btnFill.classList.add('active');
        pSmall.style.stroke = 'rgba(56, 189, 248, 0.2)';
        pBig.style.stroke = '#38bdf8';
        pOut.style.stroke = '#38bdf8';
        showCpDetail('MODE-FILL', '充填出貨運作模式', '目前處於 Drum 充填封裝模式。\n混合液流經 3 連式精密過濾心，送至充填站注入 200L 鋼桶，並備有回流大循環管道避免憋壓。');
      }
    }

    function updateMixingLevel(val) {
      document.getElementById('rangeVal').innerText = val + '%';
      const maxH = 170;
      const actualH = (val / 100) * maxH;
      const newY = 410 - actualH;
      const rect = document.getElementById('mixLiquidLevel');
      rect.setAttribute('y', newY);
      rect.setAttribute('height', actualH);

      const capacityTotalKL = 250;
      const currentKL = Math.round((val / 100) * capacityTotalKL);
      document.getElementById('mixLevelPct').innerText = `液位: ${val}% (${currentKL} KL)`;
    }

    function resetTankLevels() {
      updateMixingLevel(68);
      document.getElementById('mixLevelRange').value = 68;
    }

    function showCpDetail(id, title, desc) {
      const drawer = document.getElementById('infoDrawer');
      const drawerTitle = document.getElementById('drawerTitle');
      const drawerBody = document.getElementById('drawerBody');

      drawerTitle.innerHTML = `<span style="color:var(--accent-red)">🔺</span> ${title}`;
      
      const lines = desc.split('\n').map(l => `<li style="margin-bottom: 6px;">${l}</li>`).join('');

      drawerBody.innerHTML = `
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
          <div style="font-weight: 700; color: #fca5a5; font-size: 13px; margin-bottom: 6px;">品質管控項目 (Quality Check Specs):</div>
          <ul style="padding-left: 20px; font-size: 13px; color: #fecaca;">
            ${lines}
          </ul>
        </div>

        <table class="data-table">
          <thead>
            <tr><th>檢驗項目</th><th>規格標準</th><th>最新實測</th><th>狀態</th></tr>
          </thead>
          <tbody>
            <tr><td>Metal (金屬雜質)</td><td>&lt; 0.1 ppb</td><td>0.02 ppb</td><td><span class="badge badge-pass">PASS</span></td></tr>
            <tr><td>水阻值 (Resistivity)</td><td>&gt; 18.0 MΩ</td><td>18.2 MΩ</td><td><span class="badge badge-pass">PASS</span></td></tr>
            <tr><td>主成份 (Assay)</td><td>&ge; 99.8%</td><td>99.86%</td><td><span class="badge badge-pass">PASS</span></td></tr>
            <tr><td>顆粒數 (Particles)</td><td>&lt; 50 pcs/mL</td><td>12 pcs/mL</td><td><span class="badge badge-pass">PASS</span></td></tr>
          </tbody>
        </table>
      `;

      drawer.classList.add('open');
    }

    function showEquipmentDetail(eqName) {
      const drawer = document.getElementById('infoDrawer');
      const drawerTitle = document.getElementById('drawerTitle');
      const drawerBody = document.getElementById('drawerBody');

      drawerTitle.innerHTML = `<span style="color:var(--accent-cyan)">⚗️</span> 設備詳情: ${eqName}`;

      let eqInfo = {
        'RM-A': { type: '立方體固態/預溶料槽', cap: '60 KL', temp: '24.5 °C', press: '1.02 atm', role: '主要功能主配方原料' },
        'RM-E': { type: '輔料專用微量槽', cap: '15 KL', temp: '23.0 °C', press: '1.00 atm', role: '高活性添加物' },
        'RM-B': { type: '立體圓柱儲槽', cap: '50 KL', temp: '25.0 °C', press: '1.05 atm', role: '溶劑輔料 B' },
        'RM-C': { type: '立體圓柱儲槽', cap: '50 KL', temp: '24.8 °C', press: '1.03 atm', role: '中和調合劑 C' },
        'RM-D': { type: '立體圓柱儲槽', cap: '50 KL', temp: '25.2 °C', press: '1.04 atm', role: '穩定劑 D' },
        'Mixing Tank': { type: '中央大型攪拌反應槽', cap: '250 KL', temp: '28.5 °C', press: '1.15 atm', role: '全配方高速均質調合' },
        '3-Stage Filters': { type: '精密微孔濾心組 (0.1um)', cap: '流量 35 KL/Hr', temp: '常溫', press: '壓差 0.2 bar', role: '去除懸浮微粒與金屬殘渣' },
        'Drum Filling': { type: '成品棧板自動充填站', cap: '4 Drums / Pallet (800L)', temp: '25.0 °C', press: '反壓 0.05 bar', role: '充填出貨與秤重封蓋' }
      }[eqName] || { type: '製程單元', cap: 'N/A', temp: '25 °C', press: '1.0 atm', role: '一般流道單元' };

      drawerBody.innerHTML = `
        <div style="background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
          <div style="font-weight: 700; color: #7dd3fc; font-size: 14px; margin-bottom: 4px;">${eqInfo.type}</div>
          <div style="font-size: 13px; color: var(--text-sub);">${eqInfo.role}</div>
        </div>

        <table class="data-table">
          <tbody>
            <tr><th>設備設計公稱容量</th><td>${eqInfo.cap}</td></tr>
            <tr><th>運行溫度</th><td>${eqInfo.temp}</td></tr>
            <tr><th>內部操作壓力</th><td>${eqInfo.press}</td></tr>
            <tr><th>保養週期狀態</th><td><span class="badge badge-pass">良好 (正常運作)</span></td></tr>
          </tbody>
        </table>
      `;

      drawer.classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('infoDrawer').classList.remove('open');
    }
  </script>
</body>
</html>
