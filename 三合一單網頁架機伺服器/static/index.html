<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台積電槽車 Barcode 三合一單與運輸通知表 - 架機專用線上產生器</title>
    <!-- 引入 SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", "Segoe UI", Arial, sans-serif; }
        body { background-color: #F0F2F5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1150px; margin: 0 auto; background: #FFF; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #002060; margin-top: 0; font-size: 24px; border-bottom: 3px solid #002060; padding-bottom: 10px; }
        .subtitle { color: #555; font-size: 14px; margin-bottom: 20px; }
        
        .status-box { background: #E8F5E9; border-left: 5px solid #2E7D32; padding: 12px 15px; margin-bottom: 20px; border-radius: 4px; font-size: 14px; color: #1B5E20; font-weight: bold; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; background: #F8F9FA; padding: 12px 15px; border-radius: 8px; border: 1px solid #E0E0E0; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-green { background: #2E7D32; color: white; }
        .btn-green:hover { background: #1B5E20; }
        .btn-blue { background: #1565C0; color: white; }
        .btn-blue:hover { background: #0D47A1; }
        .btn-red { background: #D32F2F; color: white; }
        .btn-red:hover { background: #B71C1C; }
        .btn-purple { background: #7B1FA2; color: white; }
        .btn-purple:hover { background: #4A148C; }
        .btn-orange { background: #FF9800; color: white; }
        .btn-orange:hover { background: #F57C00; }

        .table-responsive { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 950px; }
        th { background: #002060; color: white; padding: 10px; text-align: center; font-weight: bold; }
        td { padding: 6px; border: 1px solid #DDD; text-align: center; }
        input[type="text"], input[type="date"] { width: 95%; padding: 5px 6px; border: 1px solid #CCC; border-radius: 4px; font-size: 13px; text-transform: uppercase; }
        input.batch-input { font-family: Consolas, monospace; font-weight: bold; color: #002060; }
        input.read-only { background-color: #F5F5F5; color: #1565C0; font-weight: bold; }
        input.long-code { color: #7B1FA2; font-weight: bold; }
        
        .footer-action { text-align: center; margin-top: 25px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-large { padding: 12px 30px; font-size: 16px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

<div class="container">
    <h1>🌐 台積電槽車 Barcode 三合一單與運輸通知表 (架機專用伺服器)</h1>
    <div class="subtitle">同仁免安裝 Python！開啟此網頁即可貼上資料或上傳 COA 截圖，由架機主機 Python 一鍵產生完美三合一單與運輸通知表 Excel！</div>

    <div class="status-box" id="statusBox">
        🔄 正在連線伺服器對照表...
    </div>

    <div class="toolbar">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <!-- 🖼️ 上傳 COA 截圖按鈕 (橘色) -->
            <label class="btn btn-orange" style="cursor:pointer;">
                🖼️ 上傳 COA 截圖 (OCR 辨識)
                <input type="file" id="coaInput" accept="image/*, .png, .jpg, .jpeg" style="display:none;" onchange="uploadCoaScreenshot(event)">
            </label>
            <!-- 📁 上傳附加檔案按鈕 (黃色或橘色) -->
            <label class="btn btn-orange" style="cursor:pointer; background:#F57C00;">
                📁 上傳附加檔案 (自動依單命名)
                <input type="file" id="extraFileInput" accept="*/*" style="display:none;" onchange="uploadExtraFile(event)">
            </label>
            <label class="btn btn-purple" style="cursor:pointer;">
                📥 從 Excel 匯入 (排程表)
                <input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none;" onchange="importExcelFile(event)">
            </label>
            <label class="btn btn-blue" style="cursor:pointer; background:#1A237E;">
                📑 載入既有運輸通知表 (修訂時間)
                <input type="file" id="transportInput" accept=".xlsx, .xls" style="display:none;" onchange="loadExistingTransportExcel(event)">
            </label>
            <button class="btn btn-blue" onclick="setTodayAllDates()">📅 帶入今天日期</button>
        </div>
        <div>
            <button class="btn btn-red" onclick="clearAllRows()">🗑️ 清除全部</button>
            <button class="btn btn-blue" onclick="addMoreRows(10)">➕ 新增 10 列</button>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 40px;">項次</th>
                    <th style="width: 170px;">批號 (請輸入 10 碼)</th>
                    <th style="width: 90px;">槽號 (自動)</th>
                    <th style="width: 120px;">地點 (如 18P3B)</th>
                    <th>長代號 (自動)</th>
                    <th style="width: 130px;">出貨日期 📅</th>
                    <th style="width: 100px;">預計到廠時間</th>
                    <th style="width: 100px;">修正到廠時間</th>
                    <th style="width: 60px;">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 動態生成列 -->
            </tbody>
        </table>
    </div>

    <div class="footer-action">
        <button class="btn btn-green btn-large" onclick="generateAllZip()">🚀 一鍵產生所有報表 (三合一單 + 運輸通知表 ZIP)</button>
        <button class="btn btn-blue btn-large" onclick="generate3in1Single()">📄 單獨產生三合一單 Excel</button>
        <button class="btn btn-blue btn-large" onclick="generateTransportExcel()">📄 單獨產生運輸通知表 Excel</button>
    </div>
</div>

<!-- ================= EXCEL 匯入預覽 Modal ================= -->
<style>
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal-box { background: #FFF; width: 750px; max-width: 95%; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); padding: 20px; display: flex; flex-direction: column; }
    .modal-header { font-size: 18px; font-weight: bold; color: #002060; border-bottom: 2px solid #EEE; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-info { font-size: 14px; color: #333; margin-bottom: 10px; }
    .modal-controls { background: #F9F9F9; padding: 12px; border-radius: 6px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .modal-controls input[type="number"] { width: 80px; padding: 5px; font-size: 14px; border: 1px solid #CCC; border-radius: 4px; }
    .preview-box { border: 1px solid #CCC; border-radius: 6px; padding: 10px; height: 250px; overflow-y: auto; background: #FAFAFA; font-family: Consolas, monospace; font-size: 13px; line-height: 1.5; }
    .modal-footer { margin-top: 15px; display: flex; justify-content: space-between; border-top: 1px solid #EEE; padding-top: 15px; }
</style>

<div class="modal-overlay" id="importModal">
    <div class="modal-box">
        <div class="modal-header">📥 Excel 匯入筆數與範圍選擇 (最後一筆往上抓)</div>
        <div class="modal-info">
            <span style="color: #2E7D32; font-weight: bold;">📊 總計偵測到：<span id="importModalTotal"></span> 筆有效出貨資料 (最舊 ➔ 最新)</span>
        </div>
        
        <div class="modal-controls">
            <strong>篩選日期：</strong>
            <button class="btn btn-orange" onclick="filterByDateMode('d0_d2')">📅 優先抓今天~後天 (3天)</button>
            <button class="btn btn-blue" onclick="filterByDateMode('d0')">今天</button>
            <button class="btn btn-blue" onclick="filterByDateMode('d1')">明天</button>
            <button class="btn btn-blue" onclick="filterByDateMode('d2')">後天</button>
            <button class="btn btn-purple" onclick="filterByDateMode('all')">全部日期</button>
            
            <span style="margin-left: 15px; border-left: 1px solid #CCC; padding-left: 15px;"><strong>筆數：</strong></span>
            <button class="btn btn-blue" onclick="setImportCount(5)">5 筆</button>
            <button class="btn btn-blue" onclick="setImportCount(10)">10 筆</button>
            <button class="btn btn-blue" onclick="setImportCount(20)">20 筆</button>
            <button class="btn btn-blue" onclick="setImportCount('all')">全部</button>
            
            <span style="margin-left: 10px;">自訂筆數：</span>
            <input type="number" id="importModalCount" min="1" oninput="updateImportPreview()">
        </div>
        
        <strong>📋 即將匯入資料即時預覽</strong>
        <div class="preview-box" id="importPreviewList">
            <!-- 預覽項目將動態生成 -->
        </div>
        
        <div class="modal-footer">
            <button class="btn btn-green btn-large" style="flex: 1; margin-right: 15px;" onclick="confirmImport()">🚀 確認匯入資料</button>
            <button class="btn btn-red btn-large" onclick="hideImportModal()">❌ 取消</button>
        </div>
    </div>
</div>


<script>
    let SERVER_MAPPING = {};

    window.onload = function() {
        fetchMapping();
        addMoreRows(15);
        setupKeyboardNavigation();
    };

    // ⌨️ 全局鍵盤 Excel 式上下左右與 Enter 導航
    function setupKeyboardNavigation() {
        const tableBody = document.getElementById("tableBody");
        if (!tableBody) return;

        tableBody.addEventListener("keydown", (e) => {
            const target = e.target;
            if (target.tagName !== "INPUT") return;

            const id = target.id;
            if (!id || !id.includes("_")) return;

            const parts = id.split("_");
            const colType = parts[0];
            const rowIdx = parseInt(parts[1]);
            const totalRows = tableBody.children.length;

            const colOrder = ["batch", "loc", "date", "time", "mod"];
            const colIndex = colOrder.indexOf(colType);

            // 1. ⬇️ 下鍵 或 ↵ Enter 鍵
            if (e.key === "ArrowDown" || e.key === "Enter") {
                e.preventDefault();
                let nextRow = rowIdx + 1;
                if (nextRow > totalRows) {
                    addMoreRows(5);
                }
                const nextInput = document.getElementById(`${colType}_${nextRow}`);
                if (nextInput) {
                    nextInput.focus();
                    if (nextInput.select && nextInput.type !== "date") nextInput.select();
                }
            }
            // 2. ⬆️ 上鍵
            else if (e.key === "ArrowUp") {
                e.preventDefault();
                if (rowIdx > 1) {
                    const prevInput = document.getElementById(`${colType}_${rowIdx - 1}`);
                    if (prevInput) {
                        prevInput.focus();
                        if (prevInput.select && prevInput.type !== "date") prevInput.select();
                    }
                }
            }
            // 3. ⬅️ 左鍵
            else if (e.key === "ArrowLeft") {
                const isStart = target.type === "date" || (target.selectionStart === 0 && target.selectionEnd === 0);
                if (isStart) {
                    if (colIndex > 0) {
                        e.preventDefault();
                        const leftInput = document.getElementById(`${colOrder[colIndex - 1]}_${rowIdx}`);
                        if (leftInput) {
                            leftInput.focus();
                            if (leftInput.select && leftInput.type !== "date") leftInput.select();
                        }
                    } else if (rowIdx > 1) {
                        e.preventDefault();
                        const leftInput = document.getElementById(`${colOrder[colOrder.length - 1]}_${rowIdx - 1}`);
                        if (leftInput) {
                            leftInput.focus();
                            if (leftInput.select && leftInput.type !== "date") leftInput.select();
                        }
                    }
                }
            }
            // 4. ➡️ 右鍵
            else if (e.key === "ArrowRight") {
                const isEnd = target.type === "date" || (target.selectionEnd === target.value.length);
                if (isEnd) {
                    if (colIndex < colOrder.length - 1 && colIndex !== -1) {
                        e.preventDefault();
                        const rightInput = document.getElementById(`${colOrder[colIndex + 1]}_${rowIdx}`);
                        if (rightInput) {
                            rightInput.focus();
                            if (rightInput.select && rightInput.type !== "date") rightInput.select();
                        }
                    } else if (rowIdx < totalRows) {
                        e.preventDefault();
                        const rightInput = document.getElementById(`${colOrder[0]}_${rowIdx + 1}`);
                        if (rightInput) {
                            rightInput.focus();
                            if (rightInput.select && rightInput.type !== "date") rightInput.select();
                        }
                    }
                }
            }
        });
    }

    function fetchMapping() {
        fetch("/api/mapping")
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    SERVER_MAPPING = res.data;
                    document.getElementById("statusBox").innerText = `✅ 已成功連線伺服器對照表！共載入 ${res.count} 筆地點對照碼。`;
                }
            })
            .catch(err => {
                document.getElementById("statusBox").innerText = "⚠️ 無法連線主機對照表，使用本機備用對照碼。";
            });
    }

    function addMoreRows(count) {
        const tbody = document.getElementById("tableBody");
        const currentCount = tbody.children.length;

        for (let i = 0; i < count; i++) {
            const rowIdx = currentCount + i + 1;
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${rowIdx}</td>
                <td><input type="text" class="batch-input" id="batch_${rowIdx}" maxlength="10" placeholder="26814E3191" oninput="onBatchChange(${rowIdx})" onpaste="onPasteHandler(event, ${rowIdx})"></td>
                <td><input type="text" class="read-only" id="tank_${rowIdx}" readonly placeholder="自動槽號"></td>
                <td><input type="text" id="loc_${rowIdx}" placeholder="18P3B" oninput="onLocChange(${rowIdx})"></td>
                <td><input type="text" class="read-only long-code" id="long_${rowIdx}" readonly placeholder="自動對照"></td>
                <td><input type="date" id="date_${rowIdx}"></td>
                <td><input type="text" id="time_${rowIdx}" placeholder="1400"></td>
                <td><input type="text" id="mod_${rowIdx}" placeholder="1600" style="color:#C00000; font-weight:bold;"></td>
                <td><button class="btn btn-red" style="padding: 2px 6px; font-size:11px;" onclick="clearRow(${rowIdx})">清空</button></td>
            `;
            tbody.appendChild(tr);
        }
    }

    function setTodayAllDates() {
        const today = new Date().toISOString().split('T')[0];
        const total = document.getElementById("tableBody").children.length;
        for (let i = 1; i <= total; i++) {
            if (document.getElementById(`batch_${i}`).value || document.getElementById(`loc_${i}`).value) {
                document.getElementById(`date_${i}`).value = today;
            }
        }
    }

    function getTankFromBatch(batch) {
        batch = batch.trim().toUpperCase();
        if (batch.length !== 10) return "";
        if (batch.endsWith("J1")) {
            return batch.substring(5, 8);
        }
        return batch.substring(5, 9);
    }

    function onBatchChange(idx) {
        const batchVal = document.getElementById(`batch_${idx}`).value.trim().toUpperCase();
        document.getElementById(`batch_${idx}`).value = batchVal;
        
        if (batchVal.length === 10) {
            const tank = getTankFromBatch(batchVal);
            document.getElementById(`tank_${idx}`).value = tank;
        } else {
            document.getElementById(`tank_${idx}`).value = "";
        }
    }

    function onLocChange(idx) {
        const locVal = document.getElementById(`loc_${idx}`).value.trim().toUpperCase();
        document.getElementById(`loc_${idx}`).value = locVal;

        if (SERVER_MAPPING[locVal]) {
            document.getElementById(`long_${idx}`).value = SERVER_MAPPING[locVal];
        } else if (locVal) {
            document.getElementById(`long_${idx}`).value = "❌ 未知代號";
        } else {
            document.getElementById(`long_${idx}`).value = "";
        }
    }

    function onPasteHandler(e, startIdx) {
        e.preventDefault();
        const clipboardData = e.clipboardData || window.clipboardData;
        const pastedData = clipboardData.getData('Text');
        if (!pastedData) return;

        const lines = pastedData.split(/\r\n|\n|\r/);
        let currentIdx = startIdx;

        lines.forEach(line => {
            if (!line.trim()) return;
            const items = line.split('\t').map(x => x.trim());

            let batchVal = "";
            let locVal = "";
            let dateVal = "";

            items.forEach(item => {
                const upper = item.toUpperCase().trim();
                // 如果是槽號 (如 E309, T305) 則略過，因為批號輸入時會自動計算
                if (upper.length <= 5 && (upper.startsWith('E') || upper.startsWith('T') || upper.startsWith('P')) && /\d/.test(upper)) {
                    return;
                }
                
                // 檢查是否為日期 (包含 / 或 - 且有數字)
                if ((upper.includes('/') || upper.includes('-')) && /\d/.test(upper) && !dateVal) {
                    dateVal = upper;
                } else if (upper.length === 10 && !batchVal && /[A-Z]/.test(upper) && /\d/.test(upper)) {
                    batchVal = upper;
                } else if ((SERVER_MAPPING[upper] || upper.includes('18P') || upper.includes('15P') || upper.includes('P3') || upper.length <= 6) && !locVal && upper !== batchVal && !upper.includes('/')) {
                    locVal = upper;
                }
            });

            if (batchVal || locVal || dateVal) {
                if (currentIdx > document.getElementById("tableBody").children.length) {
                    addMoreRows(5);
                }
                if (batchVal) {
                    document.getElementById(`batch_${currentIdx}`).value = batchVal;
                    onBatchChange(currentIdx);
                }
                if (locVal) {
                    document.getElementById(`loc_${currentIdx}`).value = locVal;
                    onLocChange(currentIdx);
                }
                if (dateVal) {
                    // 嘗試轉換日期為 YYYY-MM-DD
                    let dStr = dateVal.trim();
                    let y = new Date().getFullYear();
                    let m = "", d = "";
                    let match4 = dStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
                    let match2 = dStr.match(/^(\d{1,2})[-\/](\d{1,2})$/);
                    if (match4) {
                        y = match4[1]; m = match4[2]; d = match4[3];
                    } else if (match2) {
                        m = match2[1]; d = match2[2];
                    }
                    if (m && d) {
                        m = String(m).padStart(2, '0');
                        d = String(d).padStart(2, '0');
                        document.getElementById(`date_${currentIdx}`).value = `${y}-${m}-${d}`;
                    }
                }
                currentIdx++;
            }
        });
    }

    // 🖼️ 上傳 COA 截圖 (圖片自動預處理與前端 AI OCR 辨識)
    async function uploadCoaScreenshot(e) {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        document.getElementById("statusBox").innerText = "🖼️ 正在透過瀏覽器 AI 分析 COA 圖片文字座標 (免安裝本地 OCR)... 這可能需要幾秒鐘";
        
        try {
            // 載入 Tesseract.js
            if (typeof Tesseract === 'undefined') {
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
                document.head.appendChild(script);
                await new Promise(resolve => script.onload = resolve);
            }

            const worker = await Tesseract.createWorker('eng');
            const ret = await worker.recognize(file);
            await worker.terminate();

            const imgHeight = ret.data.image_height || (ret.data.lines && ret.data.lines.length > 0 ? ret.data.lines[ret.data.lines.length-1].bbox.y1 + 50 : 1000);
            
            // 1. 抓取所有辨識行與字詞
            let rawBoxes = [];
            let tableHeaderCandidates = [];

            // 尋找各行中的批號或表格特徵
            if (ret.data.lines && ret.data.lines.length > 0) {
                ret.data.lines.forEach(line => {
                    const lText = line.text.trim();
                    const cleanText = lText.replace(/[^A-Za-z0-9]/g, '');
                    
                    // 表頭行識別 (包含 Batch, Lot, Item, Spec, Test, Result, No, 批號, 規格, 檢驗)
                    if (/batch|lot|item|spec|result|test|date|tank/i.test(lText) && !/\d{8,}/.test(cleanText)) {
                        tableHeaderCandidates.push(line.bbox.y1);
                    }

                    // 檢查行內是否有單獨或包含 >= 8 碼的批號詞
                    if (line.words && line.words.length > 0) {
                        line.words.forEach(w => {
                            const wText = w.text.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                            const digits = wText.replace(/\D/g, '');
                            if (wText.length >= 8 && digits.length >= 6) {
                                rawBoxes.push({
                                    text: wText,
                                    top: line.bbox.y0,
                                    bottom: line.bbox.y1
                                });
                            }
                        });
                    }
                });
            } else if (ret.data.words && ret.data.words.length > 0) {
                ret.data.words.forEach(w => {
                    const wText = w.text.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                    const digits = wText.replace(/\D/g, '');
                    if (wText.length >= 8 && digits.length >= 6) {
                        rawBoxes.push({
                            text: wText,
                            top: w.bbox.y0,
                            bottom: w.bbox.y1
                        });
                    }
                    if (/batch|lot|item|spec|result|test|date|tank/i.test(w.text)) {
                        tableHeaderCandidates.push(w.bbox.y1);
                    }
                });
            }

            // 依照垂直 Y 座標由上至下排序
            rawBoxes.sort((a, b) => a.top - b.top);

            // 去除垂直重疊過近的重複框 (同一個批號可能有前後多個單詞)
            let uniqueBoxes = [];
            rawBoxes.forEach(b => {
                const existing = uniqueBoxes.find(ub => Math.abs(ub.top - b.top) < 15);
                if (!existing) {
                    uniqueBoxes.push(b);
                } else if (b.text.length > existing.text.length) {
                    existing.text = b.text;
                }
            });

            // 計算表頭底線 (header_bottom)
            let headerBottom = 0;
            if (uniqueBoxes.length > 0) {
                // 表頭永遠在第一筆批號上方！
                const firstBatchTop = uniqueBoxes[0].top;
                const headersAbove = tableHeaderCandidates.filter(y => y <= firstBatchTop + 5);
                if (headersAbove.length > 0) {
                    headerBottom = Math.max(...headersAbove) + 4;
                } else {
                    headerBottom = Math.max(0, firstBatchTop - 4);
                }
            } else if (tableHeaderCandidates.length > 0) {
                headerBottom = Math.max(...tableHeaderCandidates) + 8;
            } else {
                headerBottom = Math.floor(imgHeight * 0.35);
            }

            // 為每一筆批號分配清晰的 row_top 與 row_bottom 邊界
            let finalBoxes = uniqueBoxes.map((b, idx) => {
                let rowTop = (idx === 0) 
                    ? Math.max(headerBottom, b.top - 8) 
                    : Math.max(headerBottom, Math.floor((uniqueBoxes[idx-1].bottom + b.top) / 2));
                
                let rowBottom = (idx === uniqueBoxes.length - 1)
                    ? b.bottom + 16
                    : Math.floor((b.bottom + uniqueBoxes[idx+1].top) / 2);

                return {
                    text: b.text,
                    top: b.top,
                    bottom: b.bottom,
                    row_top: rowTop,
                    row_bottom: rowBottom
                };
            });

            formData.append("ocr_data", JSON.stringify({boxes: finalBoxes, header_bottom: headerBottom}));

            const res = await fetch("/api/upload_coa_image", {
                method: "POST",
                body: formData
            });

            if (!res.ok) {
                alert("COA 截圖上傳失敗！");
                return;
            }

            const data = await res.json();
            document.getElementById("statusBox").innerText = `✅ 截圖上傳成功！已成功精準定位 ${finalBoxes.length} 個批號數據列。`;
            alert(`🎉 COA 截圖上傳與 AI 辨識成功！\n系統已抓到圖片中 ${finalBoxes.length} 筆批號：\n${finalBoxes.map(b=>'• ' + b.text).join('\n')}\n\n產生 Excel 時會自動為每張單子裁切【表頭 + 該批號專屬數據列】！`);
        } catch(err) {
            alert(`COA 截圖處理出錯: ${err}`);
            document.getElementById("statusBox").innerText = "⚠️ 截圖上傳失敗。";
        }
    }

    // ================= EXCEL 匯入與預覽 Modal =================
    let allExtractedRecords = [];
    let currentFilteredRecords = [];
    let currentSheetCount = 0;

    function normalizeDateStr(raw) {
        if (!raw) return "";
        if (raw instanceof Date) {
            let y = raw.getFullYear();
            let m = String(raw.getMonth() + 1).padStart(2, '0');
            let d = String(raw.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        let str = String(raw).trim();
        if (!str) return "";

        // Excel 序列號 (如 45532)
        let num = Number(str);
        if (!isNaN(num) && num > 20000 && num < 60000) {
            let dateObj = new Date(Math.round((num - 25569) * 86400 * 1000));
            let y = dateObj.getFullYear();
            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // YYYY/MM/DD, YYYY-MM-DD, YYYY.MM.DD
        let m4 = str.match(/^(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
        if (m4) {
            return `${m4[1]}-${m4[2].padStart(2, '0')}-${m4[3].padStart(2, '0')}`;
        }

        // ROC 115/08/28
        let mTW = str.match(/^(\d{2,3})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
        if (mTW && parseInt(mTW[1]) < 1900) {
            let y = parseInt(mTW[1]) + 1911;
            return `${y}-${mTW[2].padStart(2, '0')}-${mTW[3].padStart(2, '0')}`;
        }

        // MM/DD or M/D (e.g. 8/28)
        let m2 = str.match(/^(\d{1,2})[-\/\.](\d{1,2})$/);
        if (m2) {
            let y = new Date().getFullYear();
            return `${y}-${m2[1].padStart(2, '0')}-${m2[2].padStart(2, '0')}`;
        }

        // MM/DD/YYYY
        let mMDY = str.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})/);
        if (mMDY) {
            return `${mMDY[3]}-${mMDY[1].padStart(2, '0')}-${mMDY[2].padStart(2, '0')}`;
        }

        let jsDate = new Date(str);
        if (!isNaN(jsDate.getTime()) && jsDate.getFullYear() > 2000) {
            let y = jsDate.getFullYear();
            let m = String(jsDate.getMonth() + 1).padStart(2, '0');
            let d = String(jsDate.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        return str;
    }

    function cleanLocationStr(loc) {
        if (!loc) return "";
        let s = String(loc).trim().toUpperCase();
        let cleaned = s.replace(/台積電?/g, '').replace(/新竹/g, '').replace(/台中/g, '').replace(/台南/g, '').replace(/廠/g, '').replace(/[-_\s]/g, '');
        if (SERVER_MAPPING[cleaned]) return cleaned;
        if (SERVER_MAPPING[s]) return s;
        let mAp = s.match(/(AP\d+[A-Z0-9]*)/);
        if (mAp) return mAp[1];
        let mLoc = s.match(/(\d+[A-Z]\d+[A-Z0-9]*|\d+[A-Z0-9]+)/);
        if (mLoc && (SERVER_MAPPING[mLoc[1]] || mLoc[1].includes("18P") || mLoc[1].includes("15P") || mLoc[1].includes("12P") || mLoc[1].includes("14P"))) return mLoc[1];
        return cleaned || s;
    }

    function importExcelFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const extractedRecords = [];
                currentSheetCount = workbook.SheetNames.length;

                // 遍歷 Excel 所有分頁
                workbook.SheetNames.forEach(sheetName => {
                    const worksheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "", blankrows: false });
                    if (!rows || rows.length === 0) return;

                    let batchCol = -1, locCol = -1, dateCol = -1, tankCol = -1, timeCol = -1, modTimeCol = -1, custCol = -1, prodCol = -1;
                    let startRow = 0;

                    // 檢查分頁全域文字是否標記為台積電 (例如 TSMC IPA料號:L12C53161)
                    let sheetHasTsmc = false;
                    for (let r = 0; r < Math.min(5, rows.length); r++) {
                        const rowStr = (rows[r] || []).join(" ").toUpperCase();
                        if (rowStr.includes("TSMC") || rowStr.includes("台積")) {
                            sheetHasTsmc = true;
                            break;
                        }
                    }

                    // 動態掃描前 15 列尋找欄位標題 (支援「到貨」、「到貨地」、「槽號」、「批號」等)
                    for (let r = 0; r < Math.min(15, rows.length); r++) {
                        const row = rows[r];
                        if (!row) continue;
                        for (let c = 0; c < row.length; c++) {
                            const v = String(row[c] || "").trim();
                            if (batchCol === -1 && (v.includes("批號") || v.toUpperCase().includes("BATCH") || v.toUpperCase().includes("LOT"))) batchCol = c;
                            if (locCol === -1 && (v.includes("地點") || v.includes("指送") || v.includes("交貨") || v.includes("到貨地") || v.includes("送達") || v.includes("廠區") || v.toUpperCase().includes("LOCATION") || v.toUpperCase().includes("DEST"))) locCol = c;
                            if (dateCol === -1 && (v === "到貨" || v === "到貨日" || v === "日期" || v === "出車" || v.includes("到貨日") || v.includes("出貨日") || v.includes("出車日") || v.includes("日期") || v.toUpperCase().includes("DATE")) && !v.includes("地") && !v.includes("點")) dateCol = c;
                            if (tankCol === -1 && (v.includes("槽號") || v.includes("槽車") || v.toUpperCase().includes("TANK"))) tankCol = c;
                            if (timeCol === -1 && (v.includes("到貨時間") || v.includes("預計") || v.includes("時間") || v.toUpperCase().includes("TIME")) && !v.includes("修正")) timeCol = c;
                            if (modTimeCol === -1 && v.includes("修正") && (v.includes("時間") || v.toUpperCase().includes("TIME"))) modTimeCol = c;
                            if (custCol === -1 && (v.includes("對象") || v.includes("客戶") || v.includes("廠商") || v.toUpperCase().includes("CUSTOMER"))) custCol = c;
                            if (prodCol === -1 && (v.includes("品名") || v.includes("產品") || v.toUpperCase().includes("PRODUCT"))) prodCol = c;
                        }
                        if (batchCol !== -1 && (locCol !== -1 || dateCol !== -1)) {
                            startRow = r + 1;
                            break;
                        }
                    }

                    // 鴻勝 / 勝一標準欄位備援 (B:到貨=1, C:批號=2, D:槽號=3, E:到貨地=4)
                    if (batchCol === -1 || locCol === -1) {
                        batchCol = 2;
                        dateCol = 1;
                        tankCol = 3;
                        locCol = 4;
                        startRow = 2; // 資料通常從第 3 列 (index 2) 開始
                    }

                    for (let r = startRow; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row || row.length === 0) continue;

                        let batchVal = String(row[batchCol] || "").trim().toUpperCase();
                        let locVal = String(row[locCol] || "").trim().toUpperCase();
                        let dateVal = dateCol !== -1 ? row[dateCol] : "";
                        let tankVal = tankCol !== -1 ? String(row[tankCol] || "").trim() : "";
                        let timeVal = timeCol !== -1 ? String(row[timeCol] || "").trim() : "";
                        let modTimeVal = modTimeCol !== -1 ? String(row[modTimeCol] || "").trim() : "";
                        let custVal = custCol !== -1 ? String(row[custCol] || "").trim() : "";

                        // 如果指定欄位不是有效 10 碼批號，在整列搜尋符合 10 碼英數混合字串 (如 26817E3051, 26731E44J1)
                        if (batchVal.length !== 10 || !/[0-9]/.test(batchVal)) {
                            for (let c = 0; c < row.length; c++) {
                                let cellStr = String(row[c] || "").trim().toUpperCase();
                                if (cellStr.length === 10 && /[0-9]/.test(cellStr) && /[A-Z]/.test(cellStr) && !cellStr.includes("/") && !cellStr.includes("-")) {
                                    batchVal = cellStr;
                                    break;
                                }
                            }
                        }

                        // 鴻勝批號嚴格必須剛好為 10 碼
                        if (batchVal.length !== 10 || !/[0-9]/.test(batchVal)) continue;

                        // 排除明確非台積電客戶 (例如 南亞、長春、聯電、日月光等)
                        if (custVal && (custVal.includes("南亞") || custVal.includes("長春") || custVal.includes("聯電") || custVal.includes("日月光")) && !custVal.includes("台積")) {
                            continue;
                        }

                        let cleanLoc = cleanLocationStr(locVal);
                        let isTsmc = sheetHasTsmc || 
                                     (custVal && custVal.includes("台積")) || 
                                     (locVal && (locVal.includes("台積") || locVal.includes("18P") || locVal.includes("15P") || locVal.includes("12P") || locVal.includes("14P") || locVal.includes("AP") || locVal.includes("F"))) ||
                                     SERVER_MAPPING[cleanLoc];
                        if (!isTsmc && custVal && !custVal.includes("台積")) continue;

                        let normDate = normalizeDateStr(dateVal);
                        if (!tankVal) {
                            tankVal = getTankFromBatch(batchVal);
                        }

                        extractedRecords.push({
                            sheet: sheetName,
                            batch: batchVal,
                            tank: tankVal,
                            loc: cleanLoc,
                            date: normDate,
                            time: timeVal,
                            modTime: modTimeVal
                        });
                    }
                });

                if (extractedRecords.length === 0) {
                    alert(`⚠️ 在所選檔案的所有 ${currentSheetCount} 個分頁中，未找到任何有效的台積電批號排程資料！`);
                    return;
                }

                allExtractedRecords = extractedRecords;
                
                // 預設嘗試啟用「今天~後天」優先過濾
                const today = new Date();
                const getFmt = (d) => {
                    let y = d.getFullYear();
                    let m = String(d.getMonth() + 1).padStart(2, '0');
                    let day = String(d.getDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                };

                const d0 = getFmt(today);
                let d1Obj = new Date(today); d1Obj.setDate(today.getDate() + 1); const d1 = getFmt(d1Obj);
                let d2Obj = new Date(today); d2Obj.setDate(today.getDate() + 2); const d2 = getFmt(d2Obj);
                const d0_d2 = [d0, d1, d2];

                const windowMatches = allExtractedRecords.filter(r => d0_d2.includes(r.date));
                if (windowMatches.length > 0) {
                    currentFilteredRecords = windowMatches;
                    showImportModal(`已優先過濾「今天~後天 (${d0} ~ ${d2})」共 ${windowMatches.length} 筆 (全 ${currentSheetCount} 個分頁總計 ${allExtractedRecords.length} 筆)`);
                } else {
                    currentFilteredRecords = [...allExtractedRecords];
                    showImportModal(`全 ${currentSheetCount} 個分頁總計 ${allExtractedRecords.length} 筆排程 (無今天~後天資料，顯示全部)`);
                }

            } catch (err) {
                alert("❌ 讀取 Excel 失敗：" + err.message);
            }
            e.target.value = ""; // 重置 input file
        };
        reader.readAsArrayBuffer(file);
    }

    function filterByDateMode(mode) {
        const today = new Date();
        const getFmt = (d) => {
            let y = d.getFullYear();
            let m = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const d0 = getFmt(today);
        let d1Obj = new Date(today); d1Obj.setDate(today.getDate() + 1); const d1 = getFmt(d1Obj);
        let d2Obj = new Date(today); d2Obj.setDate(today.getDate() + 2); const d2 = getFmt(d2Obj);

        let filtered = [];
        let label = "";

        if (mode === 'd0_d2') {
            const targets = [d0, d1, d2];
            filtered = allExtractedRecords.filter(r => targets.includes(r.date));
            label = `「今天~後天 (${d0} ~ ${d2})」`;
        } else if (mode === 'd0') {
            filtered = allExtractedRecords.filter(r => r.date === d0);
            label = `「今天 (${d0})」`;
        } else if (mode === 'd1') {
            filtered = allExtractedRecords.filter(r => r.date === d1);
            label = `「明天 (${d1})」`;
        } else if (mode === 'd2') {
            filtered = allExtractedRecords.filter(r => r.date === d2);
            label = `「後天 (${d2})」`;
        } else {
            filtered = [...allExtractedRecords];
            label = `「全部日期」`;
        }

        if (filtered.length === 0) {
            alert(`在所有 ${currentSheetCount} 個分頁中，找不到符合 ${label} 的出貨排程！`);
            return;
        }

        currentFilteredRecords = filtered;
        document.getElementById("importModalTotal").innerText = `${label} 共 ${filtered.length} 筆 (全 ${currentSheetCount} 分頁總計 ${allExtractedRecords.length} 筆)`;
        setImportCount('all');
    }

    // 🚀 一鍵一次全產生打包 ZIP
    async function generateAllZip() {
        const total = document.getElementById("tableBody").children.length;
        const records = [];

        for (let i = 1; i <= total; i++) {
            const batch = document.getElementById(`batch_${i}`).value.trim();
            const tank = document.getElementById(`tank_${i}`).value.trim();
            const loc = document.getElementById(`loc_${i}`).value.trim();
            const dateVal = document.getElementById(`date_${i}`).value.trim();
            const timeVal = document.getElementById(`time_${i}`).value.trim();
            const modVal = document.getElementById(`mod_${i}`).value.trim();

            if (batch || loc) {
                if (batch.length !== 10) {
                    alert(`第 ${i} 項的批號長度錯誤！必須剛好為 10 碼。`);
                    return;
                }
                if (!SERVER_MAPPING[loc]) {
                    alert(`第 ${i} 項的地點「${loc}」不存在於地點對照表中！`);
                    return;
                }
                records.push({
                    batch: batch,
                    tank: tank,
                    loc: loc,
                    date: dateVal,
                    time: timeVal,
                    modTime: modVal
                });
            }
        }

        if (records.length === 0) {
            alert("請至少輸入一筆有效的排程資料！");
            return;
        }

        try {
            const res = await fetch("/api/generate_all_zip", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    records: records,
                    do3in1: true,
                    doTransport: true
                })
            });

            if (!res.ok) {
                const err = await res.json();
                alert(`產生失敗: ${err.detail}`);
                return;
            }

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
            a.download = `三合一單輸出_${todayStr}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();

            alert("🎉 一鍵全產生成功！已為您下載包含所有三合一單與運輸通知表之 ZIP 資料夾！");
        } catch(e) {
            alert(`一鍵產生失敗: ${e}`);
        }
    }

    async function generate3in1Single() {
        const total = document.getElementById("tableBody").children.length;
        const records = [];

        for (let i = 1; i <= total; i++) {
            const batch = document.getElementById(`batch_${i}`).value.trim();
            const tank = document.getElementById(`tank_${i}`).value.trim();
            const loc = document.getElementById(`loc_${i}`).value.trim();
            const dateVal = document.getElementById(`date_${i}`).value.trim();

            if (batch || loc) {
                if (batch.length !== 10) {
                    alert(`第 ${i} 項的批號長度錯誤！必須剛好為 10 碼。`);
                    return;
                }
                if (!SERVER_MAPPING[loc]) {
                    alert(`第 ${i} 項的地點「${loc}」不存在於地點對照表中！`);
                    return;
                }
                records.push({
                    batch: batch,
                    tank: tank,
                    loc: loc,
                    date: dateVal
                });
            }
        }

        if (records.length === 0) {
            alert("請至少輸入一筆有效的排程資料！");
            return;
        }

        try {
            const res = await fetch("/api/generate_all_zip", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    records: records,
                    do3in1: true,
                    doTransport: false
                })
            });

            if (!res.ok) {
                const err = await res.json();
                alert(`產生失敗: ${err.detail}`);
                return;
            }

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
            a.download = `三合一單輸出_${todayStr}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();

            alert("🎉 單獨產生三合一單成功！已為您下載包含三合一單 Excel 之 ZIP 資料夾！");
        } catch(e) {
            alert(`單獨產生三合一單失敗: ${e}`);
        }
    }

    // 📑 載入既有運輸通知表 (還原所有排程卡片以進行到廠時間修訂)
    function loadExistingTransportExcel(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                if (!worksheet || !worksheet['!ref']) {
                    alert("⚠️ 選取的檔案中無任何有效工作表或資料！");
                    return;
                }

                const range = XLSX.utils.decode_range(worksheet['!ref']);
                const maxRow = range.e.r + 1; // 1-indexed 實體最大列號

                const getCellVal = (coord) => {
                    const cell = worksheet[coord];
                    if (!cell) return "";
                    let val = (cell.w !== undefined ? cell.w : (cell.v !== undefined ? cell.v : "")).toString();
                    return val.trim();
                };

                const records = [];
                let r = 1; // 1-indexed 對應 Excel 實體列號 (第 1, 8, 15, 22... 列)

                while (r <= maxRow) {
                    // 日期: F{r} (第 1 列第 6 欄)
                    let d_raw = getCellVal(`F${r}`);
                    
                    // 廠區: D{r+1} (第 2 列第 4 欄), 槽號: E{r+1} (第 2 列第 5 欄)
                    let l_raw = getCellVal(`D${r+1}`);
                    let tank_raw = getCellVal(`E${r+1}`);
                    
                    // 預計時間: F{r+2} (第 3 列第 6 欄)
                    let t_raw = getCellVal(`F${r+2}`);
                    
                    // 修正時間: 右側卡片 M{r+3} 或 左側卡片 F{r+3}
                    let mt_raw = getCellVal(`M${r+3}`) || getCellVal(`F${r+3}`);

                    // 清理地點文字 (如 "台積\n18P3B" -> "18P3B")
                    let cleanLoc = l_raw.replace(/台積電?/g, '').replace(/新竹/g, '').replace(/台中/g, '').replace(/台南/g, '').replace(/廠/g, '').replace(/[-_\s\r\n]/g, '').trim();
                    let normDate = normalizeDateStr(d_raw);
                    let cleanTank = tank_raw.replace(/[-_\s\r\n]/g, '').trim();
                    let cleanTime = t_raw.replace(/[-_\s\r\n]/g, '').trim();
                    let cleanModTime = mt_raw.replace(/[-_\s\r\n]/g, '').trim();

                    // 防呆過濾：排除固定樣式文字
                    if (cleanTime === "4300" || cleanTime.includes("支")) cleanTime = "";
                    if (cleanModTime === "4300" || cleanModTime.includes("支")) cleanModTime = "";

                    if (normDate || cleanLoc || cleanTank || cleanTime) {
                        records.push({
                            batch: "",
                            tank: cleanTank,
                            loc: cleanLoc,
                            date: normDate,
                            time: cleanTime,
                            modTime: cleanModTime
                        });
                    }
                    r += 7; // 每張卡片固定跨 7 列
                }

                if (records.length === 0) {
                    alert("⚠️ 未在選取的 Excel 中偵測到標準格式之運輸通知表卡片！");
                    return;
                }

                // 清空目前表格並依卡片筆數還原至第 1 ~ N 列
                clearAllRows();
                if (records.length > document.getElementById("tableBody").children.length) {
                    addMoreRows(records.length - document.getElementById("tableBody").children.length);
                }

                records.forEach((rec, idx) => {
                    const rowIdx = idx + 1;
                    document.getElementById(`batch_${rowIdx}`).value = "";
                    if (rec.loc) {
                        document.getElementById(`loc_${rowIdx}`).value = rec.loc;
                        onLocChange(rowIdx);
                    }
                    if (rec.tank) {
                        document.getElementById(`tank_${rowIdx}`).value = rec.tank;
                    }
                    if (rec.date) {
                        document.getElementById(`date_${rowIdx}`).value = rec.date;
                    }
                    if (rec.time) {
                        document.getElementById(`time_${rowIdx}`).value = rec.time;
                    }
                    if (rec.modTime) {
                        document.getElementById(`mod_${rowIdx}`).value = rec.modTime;
                    }
                });

                document.getElementById("statusBox").innerText = `✅ 成功精準還原既有運輸通知表共 ${records.length} 筆排程！請直接在目標列填寫【修正到廠時間】。`;
                alert(`🎉 既有運輸通知表還原成功！\n已為您精準還原共 ${records.length} 筆排程（已按原始位置對齊第 1~${records.length} 列）。\n\n請直接在欲修訂的排程列填寫【修正到廠時間】（如 1600），完成後點擊下方按鈕即可重新產出修正版報表！`);

            } catch (err) {
                alert("❌ 載入既有運輸通知表失敗：" + err.message);
            }
            e.target.value = ""; // 重置 input
        };
        reader.readAsArrayBuffer(file);
    }
